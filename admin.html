<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>JR Shop - Admin</title>

<style>
*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111
}

body{
  min-height:100vh
}

button,
input,
textarea,
select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

/* =========================
   LOGIN
========================= */

#login{
  min-height:100vh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.box{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:30px;
  border-radius:22px
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  margin-bottom:8px
}

.logo span{
  color:#16a34a
}

.sub{
  text-align:center;
  color:#777;
  margin-bottom:25px
}

/* =========================
   INPUTS
========================= */

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:0;
  background:#fff
}

input:focus,
textarea:focus,
select:focus{
  border-color:#16a34a
}

textarea{
  resize:vertical
}

/* =========================
   BUTTONS
========================= */

.btn{
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold
}

.green{
  background:#16a34a;
  color:#fff
}

.red{
  background:#dc2626;
  color:#fff
}

.dark{
  background:#111;
  color:#fff
}

.gray{
  background:#e5e7eb;
  color:#111
}

.full{
  width:100%;
  margin-top:8px
}

.err{
  color:#dc2626;
  text-align:center;
  margin-top:12px;
  line-height:1.7
}

/* =========================
   ADMIN
========================= */

#admin{
  display:none
}

header{
  background:#111;
  color:#fff;
  padding:15px;
  position:sticky;
  top:0;
  z-index:5
}

.head{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 60px
}

.title{
  margin-bottom:20px
}

.title h1{
  margin-bottom:5px
}

.title p{
  color:#666
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px
}

.stat,
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px #0001
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:7px
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px
}

.tab{
  padding:11px 16px;
  border-radius:9px;
  background:#ddd;
  font-weight:bold
}

.tab.active{
  background:#111;
  color:#fff
}

.section{
  display:none
}

.section.show{
  display:block
}

/* =========================
   ROW
========================= */

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px
}

.search{
  max-width:350px
}

/* =========================
   ORDERS
========================= */

.orders,
.products{
  display:grid;
  gap:12px
}

.order h3{
  margin:5px 0
}

.muted{
  color:#777;
  font-size:13px;
  line-height:1.8
}

.info{
  background:#f8f8f8;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  line-height:1.8
}

.total{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin:10px 0
}

.actions{
  display:flex;
  gap:8px;
  margin-top:8px
}

.actions>*{
  flex:1
}

.empty{
  text-align:center;
  background:#fff;
  padding:30px;
  border-radius:14px;
  color:#777
}

/* =========================
   PRODUCTS
========================= */

.productgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px
}

.product .p{
  padding-top:8px
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:20;
  padding:12px;
  overflow-y:auto
}

.modalbox{
  background:#fff;
  width:100%;
  max-width:450px;
  margin:20px auto 30px;
  padding:20px;
  border-radius:16px
}

.modalbox h2{
  margin-top:0;
  margin-bottom:15px
}

.file-title{
  display:block;
  margin-top:10px;
  margin-bottom:4px;
  font-weight:bold
}

#pfile{
  padding:10px;
  background:#f8f8f8
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .productgrid{
    grid-template-columns:repeat(2,1fr)
  }

  .row{
    flex-wrap:wrap
  }

  .search{
    max-width:none
  }

  .head .logo{
    font-size:20px
  }

  .modal{
    padding:8px
  }

  .modalbox{
    margin:8px auto 30px;
    padding:16px;
    border-radius:14px
  }

  .modalbox h2{
    font-size:23px
  }

  .actions{
    flex-direction:row
  }

  .actions .btn{
    min-height:48px
  }

}

</style>

</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login">

  <div class="box">

    <div class="logo">
      JR <span>Shop</span>
    </div>

    <div class="sub">
      لوحة تحكم الإدارة
    </div>

    <input
      id="email"
      type="email"
      value="ilyesdida@hotmail.fr"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      id="loginBtn"
      type="button"
      class="btn green full"
      onclick="login()"
    >
      🔐 تسجيل الدخول
    </button>

    <div
      id="err"
      class="err"
    ></div>

  </div>

</div>

<!-- =========================
     ADMIN
========================= -->

<div id="admin">

  <header>

    <div class="head">

      <div class="logo">
        JR <span>Shop</span>
      </div>

      <button
        type="button"
        class="btn red"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </header>

  <div class="container">

    <!-- TITLE -->

    <div class="title">

      <h1>
        👋 لوحة التحكم
      </h1>

      <p>
        إدارة الطلبات والمنتجات
      </p>

    </div>

    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        الطلبات

        <b id="s1">
          0
        </b>

      </div>

      <div class="stat">

        المعلقة

        <b id="s2">
          0
        </b>

      </div>

      <div class="stat">

        المكتملة

        <b id="s3">
          0
        </b>

      </div>

      <div class="stat">

        المبيعات

        <b id="s4">
          0 دج
        </b>

      </div>

    </div>

    <!-- TABS -->

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        onclick="tab('orders',this)"
      >
        📦 الطلبات
      </button>

      <button
        type="button"
        class="tab"
        onclick="tab('products',this)"
      >
        🛍️ المنتجات
      </button>

    </div>

    <!-- =====================
         ORDERS SECTION
    ====================== -->

    <section
      id="orders"
      class="section show"
    >

      <div class="row">

        <h2>
          📦 الطلبات
        </h2>

        <input
          id="search"
          class="search"
          placeholder="بحث..."
          oninput="drawOrders()"
        >

        <button
          type="button"
          class="btn dark"
          onclick="loadOrders()"
        >
          🔄
        </button>

      </div>

      <div
        id="orderList"
        class="orders"
      >

        <div class="empty">
          جاري التحميل...
        </div>

      </div>

    </section>

    <!-- =====================
         PRODUCTS SECTION
    ====================== -->

    <section
      id="products"
      class="section"
    >

      <div class="row">

        <h2>
          🛍️ المنتجات
        </h2>

        <button
          type="button"
          class="btn green"
          onclick="openModal()"
        >
          ➕ إضافة
        </button>

      </div>

      <div
        id="productList"
        class="productgrid"
      >

        <div class="empty">
          جاري التحميل...
        </div>

      </div>

    </section>

  </div>

</div>

<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="modal"
  class="modal"
>

  <div class="modalbox">

    <h2 id="modalTitle">
      ➕ منتج جديد
    </h2>

    <input
      id="pid"
      type="hidden"
    >

    <input
      id="pname"
      type="text"
      placeholder="اسم المنتج"
    >

    <input
      id="pprice"
      type="number"
      inputmode="numeric"
      placeholder="السعر"
    >

    <input
      id="pold"
      type="number"
      inputmode="numeric"
      placeholder="السعر القديم"
    >

    <input
      id="pstock"
      type="number"
      inputmode="numeric"
      placeholder="المخزون"
    >

    <input
      id="pimage"
      type="url"
      placeholder="رابط الصورة"
    >

    <label class="file-title">
      📱 تحميل صورة من الهاتف
    </label>

    <input
      id="pfile"
      type="file"
      accept="image/*"
    >

    <textarea
      id="pdesc"
      rows="4"
      placeholder="الوصف"
    ></textarea>

    <select id="pactive">

      <option value="true">
        نشط
      </option>

      <option value="false">
        غير نشط
      </option>

    </select>

    <div class="actions">

      <button
        id="saveProductBtn"
        type="button"
        class="btn green"
        onclick="saveProduct();"
      >
        💾 حفظ
      </button>

      <button
        type="button"
        class="btn gray"
        onclick="closeModal()"
      >
        إلغاء
      </button>

    </div>

  </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cstjgsuehmqcolajspqh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      storage:window.localStorage
    }
  }
);


/* =========================
   VARIABLES
========================= */

let orders = [];
let products = [];


/* =========================
   ELEMENTS
========================= */

const loginBox =
document.getElementById("login");

const adminBox =
document.getElementById("admin");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const errBox =
document.getElementById("err");

const orderList =
document.getElementById("orderList");

const productList =
document.getElementById("productList");

const searchInput =
document.getElementById("search");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const pid =
document.getElementById("pid");

const pname =
document.getElementById("pname");

const pprice =
document.getElementById("pprice");

const pold =
document.getElementById("pold");

const pstock =
document.getElementById("pstock");

const pimage =
document.getElementById("pimage");

const pfile =
document.getElementById("pfile");

const pdesc =
document.getElementById("pdesc");

const pactive =
document.getElementById("pactive");

const saveProductBtn =
document.getElementById("saveProductBtn");


/* =========================
   HELPERS
========================= */

function esc(x){

  return String(x ?? "")
    .replace(/[&<>"']/g,m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m]));

}


function money(x){

  return Number(x || 0)
    .toLocaleString("fr-FR");

}


function status(x){

  return {

    pending:"معلق",
    confirmed:"مؤكد",
    shipped:"تم الشحن",
    delivered:"تم التسليم",
    cancelled:"ملغى"

  }[x] || x || "معلق";

}


/* =========================
   LOGIN
========================= */

async function login(){

  errBox.textContent = "";

  const e = emailInput.value.trim();
  const p = passwordInput.value;

  if(!e || !p){

    errBox.textContent =
      "❌ أدخل البريد وكلمة المرور";

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "⏳ جاري الدخول...";

  try{

    console.log("LOGIN START");
    console.log("EMAIL:", e);

    const { data, error } =
      await db.auth.signInWithPassword({
        email: e,
        password: p
      });

    console.log("LOGIN RESULT:", data);
    console.log("LOGIN ERROR:", error);

    if(error){

      errBox.textContent =
        "❌ فشل تسجيل الدخول:\n" +
        error.message;

      loginBtn.disabled = false;
      loginBtn.textContent = "🔐 تسجيل الدخول";

      return;
    }

    if(!data || !data.session){

      errBox.textContent =
        "❌ لم يتم إنشاء جلسة الدخول";

      loginBtn.disabled = false;
      loginBtn.textContent = "🔐 تسجيل الدخول";

      return;
    }

    loginBtn.textContent = "✅ تم الدخول";

    loginBox.style.display = "none";
    adminBox.style.display = "block";

    await loadOrders();
    await loadProducts();

  }catch(error){

    console.error("LOGIN EXCEPTION:", error);

    errBox.textContent =
      "❌ خطأ:\n" +
      (error.message || String(error));

    loginBtn.disabled = false;
    loginBtn.textContent = "🔐 تسجيل الدخول";

  }

}


/* =========================
   SESSION
========================= */

async function checkSession(){

  try{

    const result =
      await db.auth.getSession();


    if(result.error){

      console.error(
        result.error
      );

      loginBox.style.display =
        "flex";

      adminBox.style.display =
        "none";

      return;
    }


    if(result.data.session){

      loginBox.style.display =
        "none";

      adminBox.style.display =
        "block";


      await loadOrders();

      await loadProducts();

    }else{

      loginBox.style.display =
        "flex";

      adminBox.style.display =
        "none";

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  orderList.innerHTML =
    '<div class="empty">جاري تحميل الطلبات...</div>';


  const r =
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(r.error){

    console.error(r.error);

    orderList.innerHTML =
      '<div class="empty">❌ ' +
      esc(r.error.message) +
      '</div>';

    return;
  }


  orders =
    r.data || [];


  updateStats();

  drawOrders();

}


/* =========================
   STATS
========================= */

function updateStats(){

  document
    .getElementById("s1")
    .textContent =
      orders.length;


  document
    .getElementById("s2")
    .textContent =
      orders.filter(
        x =>
          x.status === "pending"
      ).length;


  document
    .getElementById("s3")
    .textContent =
      orders.filter(
        x =>
          x.status === "delivered"
      ).length;


  const sales =
    orders
      .filter(
        x =>
          x.status !== "cancelled"
      )
      .reduce(
        (a,x) =>
          a + Number(x.total || 0),
        0
      );


  document
    .getElementById("s4")
    .textContent =
      money(sales) +
      " دج";

}


/* =========================
   DRAW ORDERS
========================= */

function drawOrders(){

  const q =
    (
      searchInput.value || ""
    )
    .toLowerCase()
    .trim();


  const list =
    orders.filter(o =>

      !q ||

      JSON.stringify(o)
        .toLowerCase()
        .includes(q)

    );


  if(!list.length){

    orderList.innerHTML =
      '<div class="empty">لا توجد طلبات</div>';

    return;
  }


  orderList.innerHTML =
    list.map(o => {

      let items =
        o.items ||
        o.products ||
        o.order_items ||
        [];


      if(
        typeof items === "string"
      ){

        try{

          items =
            JSON.parse(items);

        }catch(e){

          console.error(e);

        }

      }


      let itemText = "";


      if(
        Array.isArray(items)
      ){

        itemText =
          items.map(i =>

            `<div>
              • ${esc(
                i.name ||
                i.title ||
                "منتج"
              )}
              × ${i.quantity || 1}
            </div>`

          ).join("");

      }else{

        itemText =
          esc(items);

      }


      return `

        <div class="card order">

          <div class="row">

            <div>

              <h3>
                📦 ${esc(
                  o.name ||
                  o.full_name ||
                  o.customer_name ||
                  "زبون"
                )}
              </h3>

              <div class="muted">

                #${esc(o.id)}

                <br>

                ${esc(
                  o.created_at || ""
                )}

              </div>

            </div>


            <b>
              ${esc(
                status(o.status)
              )}
            </b>

          </div>


          <div class="info">

            📞 ${esc(
              o.phone ||
              o.telephone ||
              ""
            )}

            <br>

            📍 ${esc(
              o.wilaya ||
              o.state ||
              ""
            )}

            ${esc(
              o.address || ""
            )}

            <br><br>

            ${itemText}

          </div>


          <div class="total">

            ${money(o.total)} دج

          </div>


          <div class="actions">

            <select
              onchange="
                changeStatus(
                  '${esc(o.id)}',
                  this.value
                )
              "
            >

              ${[
                "pending",
                "confirmed",
                "shipped",
                "delivered",
                "cancelled"
              ].map(s=>`

                <option
                  value="${s}"
                  ${o.status===s?"selected":""}
                >
                  ${status(s)}
                </option>

              `).join("")}

            </select>


            <button
              type="button"
              class="btn red"
              onclick="
                deleteOrder(
                  '${esc(o.id)}'
                )
              "
            >
              🗑️
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   CHANGE ORDER STATUS
========================= */

async function changeStatus(
  id,
  value
){

  const r =
    await db
      .from("orders")
      .update({
        status:value
      })
      .eq(
        "id",
        id
      );


  if(r.error){

    alert(
      "❌ خطأ:\n\n" +
      r.error.message
    );

    return;
  }


  await loadOrders();

}


/* =========================
   DELETE ORDER
========================= */

async function deleteOrder(id){

  if(
    !confirm(
      "هل تريد حذف هذا الطلب؟"
    )
  ){

    return;

  }


  const r =
    await db
      .from("orders")
      .delete()
      .eq(
        "id",
        id
      );


  if(r.error){

    alert(
      "❌ خطأ:\n\n" +
      r.error.message
    );

    return;
  }


  await loadOrders();

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  productList.innerHTML =
    '<div class="empty">جاري تحميل المنتجات...</div>';


  const r =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(r.error){

    console.error(r.error);

    productList.innerHTML =
      '<div class="empty">❌ ' +
      esc(r.error.message) +
      '</div>';

    return;
  }


  products =
    r.data || [];


  drawProducts();

}


/* =========================
   DRAW PRODUCTS
========================= */

function drawProducts(){

  if(!products.length){

    productList.innerHTML =
      '<div class="empty">لا توجد منتجات</div>';

    return;
  }


  productList.innerHTML =
    products.map(p => {

      const image =
        p.image ||
        p.image_url ||
        "";


      return `

        <div class="card product">

          ${
            image

            ?

            `<img
              src="${esc(image)}"
              alt="${esc(
                p.name ||
                p.title ||
                "منتج"
              )}"
              onerror="
                this.style.display='none';
              "
            >`

            :

            `<div
              style="
                height:180px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:50px;
                background:#eee;
                border-radius:10px
              "
            >
              🛍️
            </div>`

          }


          <div class="p">

            <h3>
              ${esc(
                p.name ||
                p.title ||
                "منتج"
              )}
            </h3>


            <b
              style="color:#16a34a"
            >
              ${money(p.price)} دج
            </b>


            <div class="muted">

              المخزون:
              ${esc(
                p.stock ?? 0
              )}

            </div>


            <p class="muted">

              ${esc(
                p.description || ""
              )}

            </p>


            <div class="actions">

              <button
                type="button"
                class="btn dark"
                onclick="
                  editProductById(
                    '${esc(p.id)}'
                  )
                "
              >
                ✏️
              </button>


              <button
                type="button"
                class="btn red"
                onclick="
                  deleteProduct(
                    '${esc(p.id)}'
                  )
                "
              >
                🗑️
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}
    /* =========================
     OPEN MODAL
  ========================= */

  function openModal(){

    modal.style.display = "block";

    document.body.style.overflow = "hidden";

    modalTitle.textContent =
      "➕ منتج جديد";

    pid.value = "";
    pname.value = "";
    pprice.value = "";
    pold.value = "";
    pstock.value = "";
    pimage.value = "";
    pdesc.value = "";
    pactive.value = "true";
    pfile.value = "";

    setTimeout(function(){
      pname.focus();
    },100);

  }


  /* =========================
     CLOSE MODAL
  ========================= */

  function closeModal(){

    modal.style.display = "none";

    document.body.style.overflow = "";

  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProductById(id){

    const p =
      products.find(function(x){

        return String(x.id) === String(id);

      });


    if(!p){

      alert(
        "❌ لم يتم العثور على المنتج"
      );

      return;
    }


    editProduct(p);

  }


  function editProduct(p){

    openModal();

    modalTitle.textContent =
      "✏️ تعديل المنتج";


    pid.value =
      p.id || "";


    pname.value =
      p.name ||
      p.title ||
      "";


    pprice.value =
      p.price ?? "";


    pold.value =
      p.old_price ?? "";


    pstock.value =
      p.stock ?? 0;


    pimage.value =
      p.image ||
      p.image_url ||
      "";


    pdesc.value =
      p.description ||
      "";


    pactive.value =
      String(
        p.active !== false
      );


    pfile.value = "";

  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  async function saveProduct(){

    const btn =
      document.getElementById(
        "saveProductBtn"
      );

    try{

      btn.disabled = true;

      btn.textContent =
        "⏳ جاري...";


      const name =
        document
          .getElementById("pname")
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById("pprice")
            .value || 0
        );


      const old_price =
        Number(
          document
            .getElementById("pold")
            .value || 0
        );


      const stock =
        Number(
          document
            .getElementById("pstock")
            .value || 0
        );


      const description =
        document
          .getElementById("pdesc")
          .value
          .trim();


      const active =
        document
          .getElementById("pactive")
          .value === "true";


      const productId =
        document
          .getElementById("pid")
          .value;


      let imageUrl =
        document
          .getElementById("pimage")
          .value
          .trim();


      const fileInput =
        document.getElementById(
          "pfile"
        );


      const file =
        fileInput.files &&
        fileInput.files.length
          ? fileInput.files[0]
          : null;


      /* =====================
         CHECK
      ===================== */

      if(!name){

        alert(
          "❌ اكتب اسم المنتج"
        );

        return;
      }


      if(price <= 0){

        alert(
          "❌ اكتب السعر"
        );

        return;
      }


      if(stock < 0){

        alert(
          "❌ المخزون غير صحيح"
        );

        return;
      }


      /* =====================
         IMAGE
      ===================== */

      if(file){

        btn.textContent =
          "📤 رفع الصورة...";


        const ext =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          ext;


        console.log(
          "بدأ رفع الصورة:",
          fileName
        );


        const upload =
          await db.storage
            .from("product-images")
            .upload(
              fileName,
              file,
              {
                cacheControl:"3600",
                upsert:false,
                contentType:file.type
              }
            );


        if(upload.error){

          console.error(
            "UPLOAD ERROR:",
            upload.error
          );


          alert(
            "❌ مشكلة رفع الصورة:\n\n" +
            upload.error.message
          );

          return;
        }


        const publicUrl =
          db.storage
            .from("product-images")
            .getPublicUrl(
              fileName
            );


        imageUrl =
          publicUrl.data.publicUrl;


        console.log(
          "رابط الصورة:",
          imageUrl
        );

      }


      /* =====================
         DATA
      ===================== */

      const data = {

        name:name,

        price:price,

        old_price:old_price,

        stock:stock,

        image:imageUrl,

        description:description,

        active:active

      };


      console.log(
        "بيانات المنتج:",
        data
      );


      /* =====================
         DATABASE
      ===================== */

      btn.textContent =
        "💾 حفظ المنتج...";


      let result;


      if(productId){

        result =
          await db
            .from("products")
            .update(data)
            .eq(
              "id",
              productId
            );

      }else{

        result =
          await db
            .from("products")
            .insert([
              data
            ]);

      }


      if(result.error){

        console.error(
          "DATABASE ERROR:",
          result.error
        );


        alert(
          "❌ مشكلة قاعدة البيانات:\n\n" +
          result.error.message
        );

        return;
      }


      /* =====================
         SUCCESS
      ===================== */

      alert(
        productId
          ? "✅ تم تعديل المنتج"
          : "✅ تمت إضافة المنتج"
      );


      closeModal();


      fileInput.value = "";


      await loadProducts();


    }catch(error){

      console.error(
        "SAVE ERROR:",
        error
      );


      alert(
        "❌ حدث خطأ:\n\n" +
        (
          error.message ||
          String(error)
        )
      );


    }finally{

      btn.disabled = false;

      btn.textContent =
        "💾 حفظ";

    }

  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(id){

    if(
      !confirm(
        "هل تريد حذف المنتج؟"
      )
    ){

      return;

    }


    const r =
      await db
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if(r.error){

      console.error(
        r.error
      );


      alert(
        "❌ خطأ:\n\n" +
        r.error.message
      );

      return;
    }


    await loadProducts();


    alert(
      "✅ تم حذف المنتج"
    );

  }


  /* =========================
     TABS
  ========================= */

  function tab(id,button){

    document
      .querySelectorAll(".section")
      .forEach(function(x){

        x.classList.remove(
          "show"
        );

      });


    document
      .querySelectorAll(".tab")
      .forEach(function(x){

        x.classList.remove(
          "active"
        );

      });


    document
      .getElementById(id)
      .classList.add(
        "show"
      );


    button.classList.add(
      "active"
    );

  }


  /* =========================
     MODAL OUTSIDE CLICK
  ========================= */

  modal.addEventListener(
    "click",
    function(e){

      if(e.target === modal){

        closeModal();

      }

    }
  );


  /* =========================
     ESC TO CLOSE MODAL
  ========================= */

  document.addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Escape" &&
        modal.style.display === "block"
      ){

        closeModal();

      }

    }
  );


  /* =========================
     ENTER TO LOGIN
  ========================= */

  passwordInput.addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        login();

      }

    }
  );


  /* =========================
     START APP
  ========================= */

  checkSession();


</script>
