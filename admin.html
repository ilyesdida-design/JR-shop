<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR Shop - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f4f6;color:#111}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.login{min-height:100vh;background:#111;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:420px;padding:28px;border-radius:20px}
.logo{text-align:center;font-size:32px;font-weight:bold;margin-bottom:8px}
.green{color:#16a34a}
.sub{text-align:center;color:#777;margin-bottom:22px}
input,select,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.btn{padding:12px 16px;border-radius:10px;font-weight:bold}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-dark{background:#111;color:#fff}
.btn-gray{background:#ddd}
.full{width:100%}
.error{color:#dc2626;text-align:center;margin-top:10px}
#admin{display:none}
header{background:#111;color:#fff;padding:15px}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
main{max-width:1100px;margin:auto;padding:20px 15px}
h1{margin:0 0 5px}
.muted{color:#777}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat,.card{background:#fff;border-radius:15px;padding:18px;box-shadow:0 2px 10px #0000000d}
.stat b{font-size:24px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{padding:11px 18px;border-radius:10px;background:#ddd;font-weight:bold}
.tab.active{background:#111;color:#fff}
.section{display:none}
.section.active{display:block}
.order,.product{background:#fff;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
.order h3,.product h3{margin:0 0 8px}
.status{padding:6px 9px;border-radius:7px;font-size:12px;font-weight:bold;display:inline-block}
.pending{background:#fef3c7;color:#92400e}
.confirmed{background:#dbeafe;color:#1d4ed8}
.shipped{background:#e0e7ff;color:#4338ca}
.delivered{background:#dcfce7;color:#166534}
.cancelled{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product img{width:100%;height:180px;object-fit:cover;border-radius:10px}
.empty{background:#fff;padding:25px;text-align:center;border-radius:12px;color:#777}
.modal{display:none;position:fixed;inset:0;background:#000a;padding:20px;overflow:auto}
.modalbox{background:#fff;max-width:450px;margin:40px auto;padding:20px;border-radius:18px}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.product-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:450px){
.product-grid{grid-template-columns:1fr}
.head{gap:10px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<div class="box">
<div class="logo">JR <span class="green">Shop</span></div>
<div class="sub">لوحة تحكم الإدارة</div>

<input id="email" type="email"
value="ilyesdida@hotmail.fr"
placeholder="البريد الإلكتروني">

<input id="password" type="password"
placeholder="كلمة المرور">

<button class="btn btn-green full" onclick="login()">
🔐 تسجيل الدخول
</button>

<div id="loginError" class="error"></div>
</div>
</div>


<!-- ADMIN -->
<div id="admin">

<header>
<div class="head">
<div class="logo">JR <span class="green">Shop</span></div>
<button class="btn btn-red" onclick="logout()">خروج</button>
</div>
</header>

<main>

<h1>لوحة التحكم</h1>
<div class="muted">إدارة الطلبات والمنتجات</div>

<div class="stats">
<div class="stat">
<div class="muted">كل الطلبات</div>
<b id="allOrders">0</b>
</div>

<div class="stat">
<div class="muted">معلقة</div>
<b id="pendingOrders">0</b>
</div>

<div class="stat">
<div class="muted">مكتملة</div>
<b id="doneOrders">0</b>
</div>

<div class="stat">
<div class="muted">المبيعات</div>
<b id="sales">0 دج</b>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="tab('orders',this)">📦 الطلبات</button>
<button class="tab" onclick="tab('products',this)">🛍️ المنتجات</button>
</div>


<!-- ORDERS -->
<section id="orders" class="section active">

<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="search" placeholder="🔎 بحث بالاسم أو الهاتف أو الولاية"
oninput="showOrders()">

<button class="btn btn-dark" onclick="loadOrders()">🔄 تحديث</button>
</div>

<div id="ordersList">جاري التحميل...</div>

</section>


<!-- PRODUCTS -->
<section id="products" class="section">

<button class="btn btn-green" onclick="openProduct()">
➕ إضافة منتج
</button>

<div id="productsList" class="product-grid">
جاري التحميل...
</div>

</section>

</main>
</div>


<!-- PRODUCT MODAL -->
<div id="modal" class="modal">
<div class="modalbox">

<h2 id="modalTitle">إضافة منتج</h2>

<input id="pid" type="hidden">
<input id="pname" placeholder="اسم المنتج">
<input id="pprice" type="number" placeholder="السعر">
<input id="pold" type="number" placeholder="السعر القديم">
<input id="pstock" type="number" placeholder="المخزون">
<input id="pimage" placeholder="رابط الصورة">

<textarea id="pdesc" rows="4"
placeholder="وصف المنتج"></textarea>

<div class="actions">
<button class="btn btn-green" onclick="saveProduct()">💾 حفظ</button>
<button class="btn btn-gray" onclick="closeProduct()">إلغاء</button>
</div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const URL="https://cstjgsuehmqcolajspqh.supabase.co";
const KEY="sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

const db=window.supabase.createClient(URL,KEY);

let orders=[];
let products=[];


/* LOGIN */
async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const err=document.getElementById("loginError");

err.textContent="";

if(!email||!password){
err.textContent="أدخل البريد وكلمة المرور";
return;
}

const {data,error}=await db.auth.signInWithPassword({
email,password
});

if(error){
err.textContent=error.message;
return;
}

if(data.session) showAdmin();
}


/* SESSION */
async function check(){

const {data}=await db.auth.getSession();

if(data.session) showAdmin();
else document.getElementById("loginPage").style.display="flex";
}


/* SHOW ADMIN */
async function showAdmin(){

document.getElementById("loginPage").style.display="none";
document.getElementById("admin").style.display="block";

await loadOrders();
await loadProducts();
}


/* LOGOUT */
async function logout(){

await db.auth.signOut();

document.getElementById("admin").style.display="none";
document.getElementById("loginPage").style.display="flex";
}


/* TABS */
function tab(id,btn){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");
btn.classList.add("active");
}


/* LOAD ORDERS */
async function loadOrders(){

const box=document.getElementById("ordersList");
box.innerHTML="<div class='empty'>جاري تحميل الطلبات...</div>";

const {data,error}=await db
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){

box.innerHTML=
"<div class='empty' style='color:#dc2626'>❌ خطأ: "+
esc(error.message)+"</div>";

return;
}

orders=data||[];
updateStats();
showOrders();
}


/* STATS */
function updateStats(){

document.getElementById("allOrders").textContent=orders.length;

document.getElementById("pendingOrders").textContent=
orders.filter(x=>x.status==="pending").length;

document.getElementById("doneOrders").textContent=
orders.filter(x=>x.status==="delivered").length;

let total=0;

orders.forEach(x=>{
if(x.status!=="cancelled")
total+=Number(x.total||0);
});

document.getElementById("sales").textContent=
total.toLocaleString("fr-FR")+" دج";
}


/* SHOW ORDERS */
function showOrders(){

const box=document.getElementById("ordersList");
const q=(document.getElementById("search").value||"").toLowerCase();

let list=orders.filter(o=>{

const text=JSON.stringify(o).toLowerCase();
return text.includes(q);
});

if(!list.length){
box.innerHTML="<div class='empty'>لا توجد طلبات</div>";
return;
}

box.innerHTML=list.map(o=>{

const status=o.status||"pending";

return `
<div class="order">

<h3>📦 طلب ${esc(o.id||"")}</h3>

<div class="muted">
${esc(o.name||o.customer_name||"بدون اسم")}
</div>

<p>📞 ${esc(o.phone||o.customer_phone||"")}</p>

<p>📍 ${esc(o.wilaya||o.address||o.city||"")}</p>

<p>💰 <b>${Number(o.total||0).toLocaleString("fr-FR")} دج</b></p>

<p class="muted">${esc(o.created_at||"")}</p>

<span class="status ${status}">
${statusText(status)}
</span>

<div class="actions">

<select onchange="changeStatus('${esc(o.id)}',this.value)">
<option value="pending" ${status==="pending"?"selected":""}>معلق</option>
<option value="confirmed" ${status==="confirmed"?"selected":""}>مؤكد</option>
<option value="shipped" ${status==="shipped"?"selected":""}>تم الشحن</option>
<option value="delivered" ${status==="delivered"?"selected":""}>تم التسليم</option>
<option value="cancelled" ${status==="cancelled"?"selected":""}>ملغى</option>
</select>

<button class="btn btn-red"
onclick="deleteOrder('${esc(o.id)}')">
🗑️ حذف
</button>

</div>
</div>
`;

}).join("");
}


/* STATUS */
function statusText(s){

return {
pending:"معلق",
confirmed:"مؤكد",
shipped:"تم الشحن",
delivered:"تم التسليم",
cancelled:"ملغى"
}[s]||s;
}


async function changeStatus(id,status){

const {error}=await db
.from("orders")
.update({status:status})
.eq("id",id);

if(error){
alert("خطأ: "+error.message);
return;
}

await loadOrders();
}


/* DELETE ORDER */
async function deleteOrder(id){

if(!confirm("هل تريد حذف هذا الطلب؟")) return;

const {error}=await db
.from("orders")
.delete()
.eq("id",id);

if(error){
alert("خطأ: "+error.message);
return;
}

await loadOrders();
}


/* LOAD PRODUCTS */
async function loadProducts(){

const box=document.getElementById("productsList");
box.innerHTML="<div class='empty'>جاري تحميل المنتجات...</div>";

const {data,error}=await db
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){

box.innerHTML=
"<div class='empty'>❌ خطأ: "+
esc(error.message)+"</div>";

return;
}

products=data||[];
showProducts();
}


/* SHOW PRODUCTS */
function showProducts(){

const box=document.getElementById("productsList");

if(!products.length){
box.innerHTML="<div class='empty'>لا توجد منتجات</div>";
return;
}

box.innerHTML=products.map(p=>`

<div class="product">

${p.image_url||p.image?
`<img src="${esc(p.image_url||p.image)}">`
:""}

<h3>${esc(p.name||"بدون اسم")}</h3>

<div class="muted">
${esc(p.description||"")}
</div>

<p class="green">
<b>${Number(p.price||0).toLocaleString("fr-FR")} دج</b>
</p>

<p>المخزون: ${Number(p.stock||0)}</p>

<div class="actions">

<button class="btn btn-dark"
onclick="editProduct('${esc(p.id)}')">
✏️ تعديل
</button>

<button class="btn btn-red"
onclick="deleteProduct('${esc(p.id)}')">
🗑️ حذف
</button>

</div>

</div>

`).join("");
}


/* OPEN PRODUCT */
function openProduct(){

document.getElementById("modal").style.display="block";

document.getElementById("modalTitle").textContent="➕ إضافة منتج";

["pid","pname","pprice","pold","pstock","pimage","pdesc"]
.forEach(id=>document.getElementById(id).value="");
}


/* CLOSE */
function closeProduct(){
document.getElementById("modal").style.display="none";
}


/* EDIT */
function editProduct(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

document.getElementById("modal").style.display="block";
document.getElementById("modalTitle").textContent="✏️ تعديل المنتج";

document.getElementById("pid").value=p.id||"";
document.getElementById("pname").value=p.name||"";
document.getElementById("pprice").value=p.price||"";
document.getElementById("pold").value=p.old_price||"";
document.getElementById("pstock").value=p.stock||"";
document.getElementById("pimage").value=p.image_url||p.image||"";
document.getElementById("pdesc").value=p.description||"";
}


/* SAVE PRODUCT */
async function saveProduct(){

const id=document.getElementById("pid").value;

const product={
name:document.getElementById("pname").value.trim(),
price:Number(document.getElementById("pprice").value||0),
old_price:Number(document.getElementById("pold").value||0),
stock:Number(document.getElementById("pstock").value||0),
image_url:document.getElementById("pimage").value.trim(),
description:document.getElementById("pdesc").value.trim()
};

if(!product.name){
alert("أدخل اسم المنتج");
return;
}

let result;

if(id){

result=await db
.from("products")
.update(product)
.eq("id",id);

}else{

result=await db
.from("products")
.insert(product);
}

if(result.error){

alert("خطأ: "+result.error.message);
return;
}

closeProduct();
await loadProducts();
}


/* DELETE PRODUCT */
async function deleteProduct(id){

if(!confirm("هل تريد حذف المنتج؟"))return;

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert("خطأ: "+error.message);
return;
}

await loadProducts();
}


/* ESCAPE */
function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* START */
check();

</script>
</body>
  </html>
