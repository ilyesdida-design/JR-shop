<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f8;
  color:#111;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
  background:#111;
  color:#fff;
  padding:16px;
  position:sticky;
  top:0;
  z-index:100;
}
.top{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.logo{font-size:27px;font-weight:900}
.logo span{color:#16a34a}
.cart{
  border:0;
  background:#16a34a;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-weight:bold;
}
.cart:hover{background:#15803d}

.hero{
  background:#111;
  color:#fff;
  text-align:center;
  padding:34px 15px 42px;
}
.hero h1{margin:0 0 10px;font-size:32px}
.hero h1 span{color:#22c55e}
.hero p{color:#ccc;margin:0;font-size:15px}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

/* ASOS STYLE CATEGORIES */
.categories-section{
  background:#fff;
  border-radius:18px;
  padding:18px 16px 20px;
  margin-bottom:24px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}
.categories-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}
.categories-head h2{
  margin:0;
  font-size:23px;
}
.categories-hint{
  color:#777;
  font-size:12px;
}
.categories-scroll{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 2px 10px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
}
.categories-scroll::-webkit-scrollbar{height:5px}
.categories-scroll::-webkit-scrollbar-thumb{
  background:#ccc;
  border-radius:20px;
}
.category-card{
  flex:0 0 125px;
  border:0;
  background:transparent;
  padding:0;
  text-align:center;
  scroll-snap-align:start;
}
.category-card-image-wrap{
  width:125px;
  height:150px;
  border-radius:12px;
  overflow:hidden;
  background:#eee;
  position:relative;
  border:2px solid transparent;
  transition:.2s;
}
.category-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.25s;
}
.category-card:hover img{transform:scale(1.04)}
.category-card-name{
  display:block;
  margin-top:9px;
  font-size:14px;
  font-weight:bold;
  line-height:1.3;
}
.category-card.active .category-card-image-wrap{
  border-color:#16a34a;
  box-shadow:0 0 0 2px #dcfce7;
}
.category-card.active .category-card-name{color:#16a34a}
.all-card .category-card-image-wrap{
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}
.all-card-icon{
  color:#fff;
  font-size:42px;
}
.category-loading{
  width:100%;
  text-align:center;
  padding:25px 10px;
  color:#777;
}
.category-error{
  width:100%;
  text-align:center;
  padding:20px 10px;
  color:#dc2626;
}

/* PRODUCTS */
.products-area{min-width:0}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}
.section-title h2{margin:0;font-size:24px}
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.product{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}
.product-img{
  height:220px;
  background:#e5e7eb;
  overflow:hidden;
}
.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.product-info{padding:13px}
.product h3{font-size:16px;margin:0 0 8px}
.description{
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin-bottom:8px;
}
.price{
  color:#16a34a;
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}
.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:13px;
  margin-right:5px;
}
.stock{color:#666;font-size:13px;margin-bottom:10px}
.buy{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
}
.buy:hover{background:#16a34a}
.buy:disabled{background:#999;cursor:not-allowed}

.loading,.error{
  text-align:center;
  padding:30px;
  grid-column:1/-1;
}
.error{color:#dc2626}

/* MODALS */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:999;
  padding:15px;
  overflow-y:auto;
}
.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-box{
  width:100%;
  max-width:550px;
  background:#fff;
  border-radius:18px;
  padding:20px;
  max-height:92vh;
  overflow-y:auto;
}
.modal-box h2{margin-top:0}

/* CART */
.cart-item{
  display:flex;
  gap:10px;
  padding:12px;
  margin-bottom:10px;
  background:#f6f7f8;
  border-radius:12px;
  align-items:center;
}
.cart-item-img{
  width:65px;
  height:65px;
  border-radius:10px;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-weight:bold;margin-bottom:5px}
.cart-item-price{color:#16a34a;font-weight:bold}
.quantity-controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}
.quantity-btn{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
}
.remove-btn{
  border:0;
  background:#dc2626;
  color:#fff;
  padding:7px 9px;
  border-radius:8px;
}
.empty-cart{text-align:center;color:#777;padding:30px 10px}

/* FORM */
.form-group{margin-bottom:11px}
.form-label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  font-size:14px;
}
.form-input,.form-select,.form-textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  font-family:Arial,sans-serif;
}
.form-textarea{min-height:90px;resize:vertical}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;
  border-color:#16a34a;
}

/* BUTTONS */
.green-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}
.green-btn:hover{background:#15803d}
.black-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-weight:bold;
}
.whatsapp-button{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#25D366;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  left:20px;
  max-width:400px;
  margin:auto;
  background:#111;
  color:#fff;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  z-index:9999;
  display:none;
}

/* FOOTER */
footer{
  background:#111;
  color:#aaa;
  text-align:center;
  padding:25px;
}
footer strong{color:#22c55e}

/* MOBILE */
@media(max-width:699px){
  .top{gap:10px}
  .logo{font-size:24px}
  .cart{padding:10px 12px;font-size:14px}
  .hero{padding:28px 15px 34px}
  .hero h1{font-size:27px}
  .categories-section{
    border-radius:16px;
    padding:15px 10px 16px;
  }
  .categories-head h2{font-size:21px}
  .categories-hint{display:none}
  .category-card{flex-basis:105px}
  .category-card-image-wrap{
    width:105px;
    height:125px;
    border-radius:10px;
  }
  .category-card-name{font-size:13px}
  .products{grid-template-columns:repeat(2,1fr);gap:10px}
  .product-img{height:165px}
  .product-info{padding:10px}
  .product h3{font-size:14px}
  .price{font-size:16px}
}

@media(max-width:380px){
  .category-card{flex-basis:92px}
  .category-card-image-wrap{width:92px;height:112px}
  .product-img{height:145px}
}
</style>
</head>

<body>

<header>

<script>
/* =====================================================
   SUPABASE
   IMPORTANT:
   Put your REAL Supabase Publishable/Anon key below.
   The key in the old file was incomplete, which causes
   "Invalid API key".
===================================================== */
const SUPABASE_URL = "https://cstjgsuehmqcolajspqh.supabase.co";

/*
  IMPORTANT:
  Replace this value with the complete key from:
  Supabase Dashboard > Project Settings > API
*/
const SUPABASE_KEY = "sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

let supabaseClient = null;

if(
  SUPABASE_KEY &&
  SUPABASE_KEY !== "PASTE_YOUR_REAL_SUPABASE_KEY_HERE"
){
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
}

/* =====================================================
   WHATSAPP
===================================================== */
const WHATSAPP_NUMBER = "213697005313";

/* =====================================================
   VARIABLES
===================================================== */
let allProducts = [];
let categories = [];
let selectedCategory = "all";
let cart = [];

/* =====================================================
   HELPERS
===================================================== */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(window.jrToastTimer);
  window.jrToastTimer = setTimeout(()=>{
    toast.style.display = "none";
  },2500);
}

function formatPrice(value){
  return Number(value || 0).toLocaleString("fr-FR") + " دج";
}

function getImage(value,fallback="https://placehold.co/500x500?text=JR+Shop"){
  return value || fallback;
}

/* =====================================================
   CART STORAGE
===================================================== */
function saveCart(){
  localStorage.setItem("jr_shop_cart",JSON.stringify(cart));
}

function loadCartFromStorage(){
  try{
    const saved = localStorage.getItem("jr_shop_cart");
    cart = saved ? JSON.parse(saved) : [];
    if(!Array.isArray(cart)) cart=[];
  }catch{
    cart=[];
  }
  updateCartCount();
  renderCart();
}

/* =====================================================
   CATEGORIES
===================================================== */
async function loadCategories(){

  const container = document.getElementById("categoriesList");

  if(!supabaseClient){
    container.innerHTML = `
      <div class="category-error">
        مفتاح Supabase غير موجود.<br><br>
        ضع المفتاح الكامل في SUPABASE_KEY داخل الكود.
      </div>
    `;
    return;
  }

  try{
    const {data,error} = await supabaseClient
      .from("categories")
      .select("id,name,slug,sort_order,active")
      .order("name",{ascending:true});

    if(error) throw error;

    categories = data || [];
    renderCategories();

  }catch(error){
    console.error("Categories:",error);

    container.innerHTML = `
      <div class="category-error">
        فشل تحميل الفئات
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

function renderCategories(){

  const container = document.getElementById("categoriesList");

  let html = `
    <button
      type="button"
      class="category-card all-card ${
        selectedCategory === "all" ? "active" : ""
      }"
      data-category="all"
    >
      <div class="category-card-image-wrap">
        <span class="all-card-icon">🛍️</span>
      </div>
      <span class="category-card-name">جميع المنتجات</span>
    </button>
  `;

  categories.forEach(category=>{

    const image = "https://placehold.co/300x400?text=" + encodeURIComponent(category.name || "JR");

    html += `
      <button
        type="button"
        class="category-card ${
          String(selectedCategory) === String(category.id)
            ? "active"
            : ""
        }"
        data-category="${escapeHtml(category.id)}"
      >
        <div class="category-card-image-wrap">
          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(category.name)}"
            loading="lazy"
            onerror="this.src='https://placehold.co/300x400?text=JR'"
          >
        </div>

        <span class="category-card-name">
          ${escapeHtml(category.name)}
        </span>
      </button>
    `;
  });

  container.innerHTML = html;

  container.querySelectorAll(".category-card").forEach(button=>{
    button.addEventListener("click",()=>{
      selectCategory(button.dataset.category);
    });
  });
}

function selectCategory(categoryId){

  selectedCategory = categoryId;

  const title = document.getElementById("productsTitle");

  if(categoryId === "all"){
    title.textContent = "🛍️ جميع المنتجات";
  }else{
    const category = categories.find(item =>
      String(item.id) === String(categoryId)
    );

    title.textContent =
      category
        ? "🛍️ " + category.name
        : "🛍️ المنتجات";
  }

  renderCategories();
  filterProducts();

  document.querySelector(".products-area")
    ?.scrollIntoView({behavior:"smooth",block:"start"});
}

/* =====================================================
   PRODUCTS
===================================================== */
async function loadProducts(){

  const container = document.getElementById("products");

  if(!supabaseClient){
    container.innerHTML = `
      <div class="error">
        مفتاح Supabase غير موجود.<br><br>
        ضع المفتاح الكامل في SUPABASE_KEY داخل الكود.
      </div>
    `;
    return;
  }

  try{
    const {data,error} = await supabaseClient
      .from("products")
      .select("*")
      .order("id",{ascending:false});

    if(error) throw error;

    allProducts = data || [];
    filterProducts();

  }catch(error){
    console.error("Products:",error);

    container.innerHTML = `
      <div class="error">
        فشل تحميل المنتجات
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

function filterProducts(){

  let products = allProducts;

  if(selectedCategory !== "all"){
    products = allProducts.filter(product =>
      String(product.category_id) === String(selectedCategory)
    );
  }

  renderProducts(products);
}

function renderProducts(products){

  const container = document.getElementById("products");

  if(!products || products.length === 0){
    container.innerHTML = `
      <div class="loading">
        لا توجد منتجات في هذه الفئة.
      </div>
    `;
    return;
  }

  let html = "";

  products.forEach(product=>{

    const image =
      product.image_url ||
      product.image ||
      "https://placehold.co/500x500?text=JR+Shop";

    const name = product.name || "منتج";
    const description = product.description || "";
    const price = Number(product.price || 0);
    const oldPrice = Number(product.old_price || 0);
    const stock = Number(product.stock ?? 0);

    const unavailable = stock <= 0;

    html += `
      <article class="product">

        <div class="product-img">
          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(name)}"
            loading="lazy"
            onerror="this.src='https://placehold.co/500x500?text=JR+Shop'"
          >
        </div>

        <div class="product-info">

          <h3>${escapeHtml(name)}</h3>

          ${
            description
              ? `<div class="description">${escapeHtml(description)}</div>`
              : ""
          }

          <div class="price">
            ${formatPrice(price)}
            ${
              oldPrice > price
                ? `<span class="old-price">${formatPrice(oldPrice)}</span>`
                : ""
            }
          </div>

          <div class="stock">
            ${
              unavailable
                ? "غير متوفر حاليًا"
                : "المخزون: " + stock
            }
          </div>

          <button
            type="button"
            class="buy"
            data-product-id="${escapeHtml(product.id)}"
            ${unavailable ? "disabled" : ""}
          >
            ${unavailable ? "غير متوفر" : "🛒 أضف للسلة"}
          </button>

        </div>
      </article>
    `;
  });

  container.innerHTML = html;

  container.querySelectorAll(".buy").forEach(button=>{
    button.addEventListener("click",()=>{
      addToCart(button.dataset.productId);
    });
  });
}

/* =====================================================
   CART
===================================================== */
function addToCart(productId){

  const product = allProducts.find(item =>
    String(item.id) === String(productId)
  );

  if(!product){
    showToast("المنتج غير موجود");
    return;
  }

  const stock = Number(product.stock ?? 0);

  if(stock <= 0){
    showToast("هذا المنتج غير متوفر");
    return;
  }

  const existing = cart.find(item =>
    String(item.id) === String(product.id)
  );

  if(existing){
    if(existing.quantity >= stock){
      showToast("وصلت للكمية المتوفرة");
      return;
    }
    existing.quantity += 1;
  }else{
    cart.push({
      id:product.id,
      name:product.name || "منتج",
      price:Number(product.price || 0),
      image:product.image_url || product.image || "",
      quantity:1
    });
  }

  saveCart();
  updateCartCount();
  renderCart();

  showToast("تمت إضافة المنتج للسلة ✅");
}

function updateCartCount(){

  const count = cart.reduce(
    (sum,item)=>sum + Number(item.quantity || 0),
    0
  );

  document.getElementById("cartCount").textContent = count;
}

function getCartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum +
      Number(item.price || 0) *
      Number(item.quantity || 0),
    0
  );
}

function renderCart(){

  const container = document.getElementById("cartItems");
  const total = getCartTotal();

  document.getElementById("cartTotal").textContent =
    "المجموع: " + formatPrice(total);

  document.getElementById("checkoutTotal").textContent =
    "المجموع: " + formatPrice(total);

  if(cart.length === 0){
    container.innerHTML = `
      <div class="empty-cart">
        🛒 السلة فارغة
      </div>
    `;
    return;
  }

  let html = "";

  cart.forEach(item=>{

    html += `
      <div class="cart-item">

        <img
          class="cart-item-img"
          src="${escapeHtml(
            getImage(item.image,"https://placehold.co/100x100?text=JR")
          )}"
          alt="${escapeHtml(item.name)}"
          onerror="this.src='https://placehold.co/100x100?text=JR'"
        >

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="cart-item-price">
            ${formatPrice(item.price)}
          </div>

          <div class="quantity-controls">

            <button
              type="button"
              class="quantity-btn"
              data-action="plus"
              data-id="${escapeHtml(item.id)}"
            >+</button>

            <strong>${item.quantity}</strong>

            <button
              type="button"
              class="quantity-btn"
              data-action="minus"
              data-id="${escapeHtml(item.id)}"
            >−</button>

            <button
              type="button"
              class="remove-btn"
              data-action="remove"
              data-id="${escapeHtml(item.id)}"
            >حذف</button>

          </div>

        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  container.querySelectorAll("[data-action]").forEach(button=>{
    button.addEventListener("click",()=>{
      changeCartQuantity(
        button.dataset.id,
        button.dataset.action
      );
    });
  });
}

function changeCartQuantity(id,action){

  const item = cart.find(
    product => String(product.id) === String(id)
  );

  if(!item) return;

  if(action === "plus"){
    const product = allProducts.find(
      p => String(p.id) === String(id)
    );

    const stock = Number(product?.stock ?? 999999);

    if(item.quantity < stock){
      item.quantity += 1;
    }else{
      showToast("لا توجد كمية إضافية");
    }
  }

  if(action === "minus"){
    item.quantity -= 1;
    if(item.quantity <= 0){
      cart = cart.filter(
        product => String(product.id) !== String(id)
      );
    }
  }

  if(action === "remove"){
    cart = cart.filter(
      product => String(product.id) !== String(id)
    );
  }

  saveCart();
  updateCartCount();
  renderCart();
}

/* =====================================================
   MODALS
===================================================== */
function openModal(id){
  document.getElementById(id).classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

document.getElementById("openCartBtn").addEventListener("click",()=>{
  renderCart();
  openModal("cartModal");
});

document.getElementById("closeCartBtn").addEventListener("click",()=>{
  closeModal("cartModal");
});

document.getElementById("checkoutBtn").addEventListener("click",()=>{

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  closeModal("cartModal");
  renderCart();
  openModal("checkoutModal");
});

document.getElementById("backToCartBtn").addEventListener("click",()=>{
  closeModal("checkoutModal");
  openModal("cartModal");
});

document.querySelectorAll(".modal").forEach(modal=>{
  modal.addEventListener("click",event=>{
    if(event.target === modal){
      modal.classList.remove("show");
    }
  });
});

   WHATSAPP ORDER
===================================================== */
function buildWhatsAppMessage(){

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const wilaya = document.getElementById("customerWilaya").value;
  const commune = document.getElementById("customerCommune").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  let message = "🛍️ *طلب جديد - JR Shop*%0A%0A";

  message += "👤 الاسم: " + encodeURIComponent(name) + "%0A";
  message += "📞 الهاتف: " + encodeURIComponent(phone) + "%0A";
  message += "📍 الولاية: " + encodeURIComponent(wilaya) + "%0A";
  message += "🏘️ البلدية: " + encodeURIComponent(commune) + "%0A";
  message += "🏠 العنوان: " + encodeURIComponent(address) + "%0A%0A";

  message += "🛒 *المنتجات:*%0A";

  cart.forEach(item=>{
    message +=
      "• " +
      encodeURIComponent(item.name) +
      " × " +
      item.quantity +
      " = " +
      encodeURIComponent(formatPrice(item.price * item.quantity)) +
      "%0A";
  });

  message +=
    "%0A💰 المجموع: " +
    encodeURIComponent(formatPrice(getCartTotal()));

  return message;
}

document.getElementById("whatsappOrderBtn").addEventListener("click",()=>{

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();

});

/* =====================================================
   SUBMIT ORDER
   NOTE:
   This expects a table named "orders" with the common
   columns used by the JR Shop project.
===================================================== */
document.getElementById("submitOrderBtn").addEventListener("click",async()=>{

  if(cart.length === 0){
    showToast("السلة فارغة");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const wilaya = document.getElementById("customerWilaya").value;
  const commune = document.getElementById("customerCommune").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !wilaya || !commune || !address){
    showToast("أكمل جميع معلومات الطلب");
    return;
  }

  if(!supabaseClient){
    showToast("Supabase غير مهيأ");
    return;
  }

  const button = document.getElementById("submitOrderBtn");
  const oldText = button.textContent;

  button.disabled = true;
  button.textContent = "جاري إرسال الطلب...";

  try{

    const orderData = {
      customer_name:name,
      customer_phone:phone,
      wilaya:wilaya,
      commune:commune,
      address:address,
      total:getCartTotal(),
      status:"pending",
      items:cart
    };

    const {error} = await supabaseClient
      .from("orders")
      .insert([orderData]);

    if(error) throw error;

    cart = [];
    saveCart();
    updateCartCount();
    renderCart();

    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";
    document.getElementById("customerWilaya").value = "";
    document.getElementById("customerCommune").value = "";
    document.getElementById("customerAddress").value = "";

    closeModal("checkoutModal");

    showToast("تم إرسال الطلب بنجاح ✅");

  }catch(error){

    console.error("Order:",error);

    showToast(
      "تعذر إرسال الطلب: " +
      error.message
    );

  }finally{
    button.disabled = false;
    button.textContent = oldText;
  }
});
