<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Shop — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#111}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{background:#111;color:#fff;padding:15px;position:sticky;top:0;z-index:20}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:25px;font-weight:900}.logo span{color:#22c55e}
.logout{border:0;background:#dc2626;color:#fff;padding:10px 15px;border-radius:10px;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:20px 15px 50px}
.login{max-width:420px;margin:70px auto;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px #00000012}
.login h1{text-align:center;margin-top:0}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:bold;font-size:14px;margin:0 0 6px}
.field{margin-bottom:12px}
.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:bold}
.green{background:#16a34a;color:#fff}.dark{background:#111;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#e5e7eb}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}
.tab{border:0;background:#fff;padding:12px 18px;border-radius:10px;font-weight:bold}
.tab.active{background:#16a34a;color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:18px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #0000000b;margin-bottom:18px}
.card h2{margin-top:0}
.products,.orders{display:grid;gap:12px}
.item{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 3px 12px #0000000a}
.item img{width:75px;height:75px;object-fit:cover;border-radius:10px;background:#eee}
.item-main{flex:1;min-width:0}.item-main h3{margin:0 0 6px;font-size:16px}.muted{color:#777;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold;background:#dcfce7;color:#166534}
.badge.off{background:#fee2e2;color:#991b1b}
.order{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 12px #0000000a}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order-items{background:#f6f7f8;border-radius:10px;padding:10px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;padding:18px;border-radius:14px}.stat b{display:block;font-size:25px;margin-top:5px;color:#16a34a}
.toast{position:fixed;bottom:20px;left:20px;right:20px;max-width:420px;margin:auto;background:#111;color:#fff;padding:13px;border-radius:10px;text-align:center;display:none;z-index:100}
.hidden{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.item{align-items:flex-start}.actions{margin-top:8px}}
</style>
</head>
<body>
<header id="header" class="hidden">
<div class="top"><div class="logo">JR <span>Shop</span> — Admin</div><button id="logoutBtn" class="logout">خروج</button></div>
</header>

<section id="loginBox" class="login">
<h1>🔐 JR Shop Admin</h1>
<p style="text-align:center;color:#777">دخول لوحة التحكم</p>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@email.com"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" placeholder="••••••••"></div>
<button id="loginBtn" class="btn green" style="width:100%">دخول</button>
<p id="loginError" style="color:#dc2626;text-align:center"></p>
</section>

<main id="app" class="container hidden">
<div class="stats">
<div class="stat">المنتجات <b id="statProducts">0</b></div>
<div class="stat">الفئات <b id="statCategories">0</b></div>
<div class="stat">الطلبات <b id="statOrders">0</b></div>
</div>

<div class="tabs">
<button class="tab active" data-tab="productsTab">📦 المنتجات</button>
<button class="tab" data-tab="categoriesTab">🗂️ الفئات</button>
<button class="tab" data-tab="ordersTab">📋 الطلبات</button>
</div>

<section id="productsTab" class="panel active">
<div class="grid">
<div class="card">
<h2 id="productFormTitle">➕ إضافة منتج</h2>
<input type="hidden" id="productId">
<div class="field"><label>اسم المنتج</label><input id="pName"></div>
<div class="field"><label>الوصف</label><textarea id="pDescription"></textarea></div>
<div class="field"><label>السعر</label><input id="pPrice" type="number" min="0"></div>
<div class="field"><label>السعر القديم</label><input id="pOldPrice" type="number" min="0"></div>
<div class="field"><label>المخزون</label><input id="pStock" type="number" min="0" value="0"></div>
<div class="field"><label>الفئة</label><select id="pCategory"><option value="">بدون فئة</option></select></div>
<div class="field"><label>رابط الصورة</label><input id="pImage" placeholder="https://..."></div>
<div class="field"><label><input id="pActive" type="checkbox" checked style="width:auto"> المنتج نشط</label></div>
<button id="saveProduct" class="btn green">حفظ المنتج</button>
<button id="cancelProduct" class="btn gray">إلغاء</button>
</div>
<div>
<div class="card"><h2>🔎 المنتجات</h2><input id="productSearch" placeholder="ابحث باسم المنتج..."></div>
<div id="productsList" class="products"></div>
</div>
</div>
</section>

<section id="categoriesTab" class="panel">
<div class="grid">
<div class="card">
<h2 id="categoryFormTitle">➕ إضافة فئة</h2>
<input type="hidden" id="categoryId">
<div class="field"><label>اسم الفئة</label><input id="cName"></div>
<div class="field"><label>Slug</label><input id="cSlug" placeholder="women"></div>
<div class="field"><label>رابط الصورة</label><input id="cImage" placeholder="https://..."></div>
<div class="field"><label>ترتيب</label><input id="cOrder" type="number" value="0"></div>
<div class="field"><label><input id="cActive" type="checkbox" checked style="width:auto"> الفئة نشطة</label></div>
<button id="saveCategory" class="btn green">حفظ الفئة</button>
<button id="cancelCategory" class="btn gray">إلغاء</button>
</div>
<div class="card"><h2>🗂️ الفئات</h2><div id="categoriesList"></div></div>
</div>
</section>

<section id="ordersTab" class="panel">
<div class="card">
<h2>📋 الطلبات</h2>
<button id="refreshOrders" class="btn green">تحديث</button>
</div>
<div id="ordersList" class="orders"></div>
</section>
</main>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="https://cstjgsuehmqcolajspqh.supabase.co";
const SUPABASE_KEY="sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[],categories=[],orders=[];

const $=id=>document.getElementById(id);
function toast(msg){$("toast").textContent=msg;$("toast").style.display="block";clearTimeout(window.t);window.t=setTimeout(()=>$("toast").style.display="none",2500)}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function price(v){return Number(v||0).toLocaleString("fr-FR")+" دج"}

const ADMIN_EMAIL="ilyesdida@hotmail.fr";

async function boot(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(session) await handleAdminSession(session); else showLogin();
 supabaseClient.auth.onAuthStateChange(async (_e,s)=>s?await handleAdminSession(s):showLogin());
}

async function handleAdminSession(session){
 const email=(session.user?.email||"").toLowerCase();
 if(email!==ADMIN_EMAIL.toLowerCase()){
   await supabaseClient.auth.signOut();
   showLogin();
   $("loginError").textContent="هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة.";
   return;
 }
 showApp();
}
function showLogin(){$("loginBox").classList.remove("hidden");$("app").classList.add("hidden");$("header").classList.add("hidden")}
function showApp(){$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");$("header").classList.remove("hidden");loadAll()}

$("loginBtn").onclick=async()=>{
 $("loginError").textContent="";
 const {error}=await supabaseClient.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error)$("loginError").textContent=error.message;
};
$("logoutBtn").onclick=()=>supabaseClient.auth.signOut();

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");$(b.dataset.tab).classList.add("active");
});

async function loadAll(){await Promise.all([loadCategories(),loadProducts(),loadOrders()])}

async function loadCategories(){
 const {data,error}=await supabaseClient.from("categories").select("*").order("sort_order",{ascending:true});
 if(error){toast(error.message);return}
 categories=data||[];$("statCategories").textContent=categories.length;
 $("pCategory").innerHTML='<option value="">بدون فئة</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
 $("categoriesList").innerHTML=categories.map(c=>`
 <div class="item" style="margin-bottom:10px">
 <img src="${esc(c.image_url||"https://placehold.co/100x100?text=JR")}" onerror="this.src='https://placehold.co/100x100?text=JR'">
 <div class="item-main"><h3>${esc(c.name)}</h3><div class="muted">${esc(c.slug)} · ترتيب ${c.sort_order}</div>
 <span class="badge ${c.active?'':'off'}">${c.active?'نشطة':'موقوفة'}</span></div>
 <div class="actions"><button class="btn dark" onclick="editCategory('${c.id}')">تعديل</button><button class="btn red" onclick="deleteCategory('${c.id}')">حذف</button></div>
 </div>`).join("")||"<p>لا توجد فئات.</p>";
}
async function loadProducts(){
 const {data,error}=await supabaseClient.from("products").select("*").order("created_at",{ascending:false});
 if(error){toast(error.message);return}
 products=data||[];$("statProducts").textContent=products.length;renderProducts();
}
function renderProducts(){
 const q=$("productSearch").value.trim().toLowerCase();
 const list=products.filter(p=>(p.name||"").toLowerCase().includes(q));
 $("productsList").innerHTML=list.map(p=>`
 <div class="item">
 <img src="${esc(p.image_url||p.image||"https://placehold.co/100x100?text=JR")}" onerror="this.src='https://placehold.co/100x100?text=JR'">
 <div class="item-main"><h3>${esc(p.name)}</h3><div class="muted">${price(p.price)} · المخزون: ${p.stock??0}</div>
 <span class="badge ${p.active===false||p.is_active===false?'off':''}">${p.active===false||p.is_active===false?'غير نشط':'نشط'}</span></div>
 <div class="actions"><button class="btn dark" onclick="editProduct('${p.id}')">تعديل</button><button class="btn red" onclick="deleteProduct('${p.id}')">حذف</button></div>
 </div>`).join("")||"<p>لا توجد منتجات.</p>";
}
$("productSearch").oninput=renderProducts;

function resetProduct(){
 $("productId").value="";$("pName").value="";$("pDescription").value="";$("pPrice").value="";$("pOldPrice").value="";$("pStock").value=0;$("pCategory").value="";$("pImage").value="";$("pActive").checked=true;$("productFormTitle").textContent="➕ إضافة منتج";
}
$("cancelProduct").onclick=resetProduct;
$("saveProduct").onclick=async()=>{
 const id=$("productId").value;
 const obj={name:$("pName").value.trim(),description:$("pDescription").value.trim(),price:Number($("pPrice").value||0),old_price:Number($("pOldPrice").value||0),stock:Number($("pStock").value||0),category_id:$("pCategory").value||null,image_url:$("pImage").value.trim()||null,active:$("pActive").checked,is_active:$("pActive").checked,updated_at:new Date().toISOString()};
 if(!obj.name){toast("اكتب اسم المنتج");return}
 let res=id?await supabaseClient.from("products").update(obj).eq("id",id):await supabaseClient.from("products").insert(obj);
 if(res.error){toast(res.error.message);return}
 toast(id?"تم تعديل المنتج ✅":"تمت إضافة المنتج ✅");resetProduct();loadProducts();
};
window.editProduct=id=>{
 const p=products.find(x=>x.id===id);if(!p)return;
 $("productId").value=p.id;$("pName").value=p.name||"";$("pDescription").value=p.description||"";$("pPrice").value=p.price||0;$("pOldPrice").value=p.old_price||0;$("pStock").value=p.stock||0;$("pCategory").value=p.category_id||"";$("pImage").value=p.image_url||p.image||"";$("pActive").checked=p.active!==false&&p.is_active!==false;$("productFormTitle").textContent="✏️ تعديل المنتج";window.scrollTo({top:0,behavior:"smooth"});
};
window.deleteProduct=async id=>{if(!confirm("حذف هذا المنتج؟"))return;const {error}=await supabaseClient.from("products").delete().eq("id",id);if(error)toast(error.message);else{toast("تم الحذف");loadProducts()}};

function resetCategory(){$("categoryId").value="";$("cName").value="";$("cSlug").value="";$("cImage").value="";$("cOrder").value=0;$("cActive").checked=true;$("categoryFormTitle").textContent="➕ إضافة فئة"}
$("cancelCategory").onclick=resetCategory;
$("saveCategory").onclick=async()=>{
 const id=$("categoryId").value;
 const obj={name:$("cName").value.trim(),slug:$("cSlug").value.trim(),image_url:$("cImage").value.trim()||null,sort_order:Number($("cOrder").value||0),active:$("cActive").checked};
 if(!obj.name||!obj.slug){toast("أدخل اسم وSlug الفئة");return}
 const res=id?await supabaseClient.from("categories").update(obj).eq("id",id):await supabaseClient.from("categories").insert(obj);
 if(res.error){toast(res.error.message);return}toast(id?"تم تعديل الفئة ✅":"تمت إضافة الفئة ✅");resetCategory();loadCategories();
};
window.editCategory=id=>{const c=categories.find(x=>x.id===id);if(!c)return;$("categoryId").value=c.id;$("cName").value=c.name||"";$("cSlug").value=c.slug||"";$("cImage").value=c.image_url||"";$("cOrder").value=c.sort_order||0;$("cActive").checked=c.active!==false;$("categoryFormTitle").textContent="✏️ تعديل الفئة";window.scrollTo({top:0,behavior:"smooth"})};
window.deleteCategory=async id=>{if(!confirm("حذف الفئة؟ المنتجات المرتبطة بها ستصبح بدون فئة."))return;const {error}=await supabaseClient.from("categories").delete().eq("id",id);if(error)toast(error.message);else{toast("تم الحذف");loadCategories();loadProducts()}};

async function loadOrders(){
 const {data,error}=await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});
 if(error){toast(error.message);return}
 orders=data||[];$("statOrders").textContent=orders.length;
 $("ordersList").innerHTML=orders.map(o=>`
 <article class="order">
 <div class="order-head"><div><b>#${esc(o.id)}</b><br><span class="muted">${new Date(o.created_at).toLocaleString("ar-DZ")}</span></div>
 <select onchange="changeStatus('${o.id}',this.value)">
 ${["pending","confirmed","shipped","delivered","cancelled"].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join("")}
 </select></div>
 <hr>
 <b>👤 ${esc(o.customer_name||"—")}</b><br>
 📞 ${esc(o.phone||"—")}<br>
 📍 ${esc(o.wilaya||"—")}<br>
 🏠 ${esc(o.address||"—")}
 <div class="order-items"><b>المنتجات:</b><br>${renderOrderItems(o.items)}</div>
 <b>💰 ${price(o.total)}</b>
 </article>`).join("")||"<p>لا توجد طلبات.</p>";
}
function renderOrderItems(items){
 if(!Array.isArray(items))return esc(JSON.stringify(items||{}));
 return items.map(i=>`• ${esc(i.name||"منتج")} × ${i.quantity||1} = ${price((i.price||0)*(i.quantity||1))}`).join("<br>");
}
window.changeStatus=async(id,status)=>{const {error}=await supabaseClient.from("orders").update({status}).eq("id",id);if(error)toast(error.message);else toast("تم تحديث الحالة ✅")};
$("refreshOrders").onclick=loadOrders;
boot();
</script>
</body>
</html>
