<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>JR Shop — Admin V8</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:#f5f5f3;
      color:#151515;
    }

    button,input,select,textarea{font:inherit}

    .layout{
      min-height:100vh;
      display:flex;
    }

    /* SIDEBAR */
    .sidebar{
      width:250px;
      background:#111;
      color:#fff;
      padding:28px 18px;
      position:fixed;
      inset:0 auto 0 0;
      z-index:20;
    }

    .brand{
      padding:8px 12px 35px;
      font-size:24px;
      font-weight:800;
      letter-spacing:2px;
    }

    .brand span{
      color:#c9a45c;
    }

    .nav-title{
      color:#777;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1.5px;
      padding:0 12px 10px;
    }

    .nav-btn{
      width:100%;
      border:0;
      background:transparent;
      color:#aaa;
      padding:14px 12px;
      border-radius:10px;
      text-align:left;
      cursor:pointer;
      margin-bottom:5px;
      transition:.2s;
    }

    .nav-btn:hover,
    .nav-btn.active{
      background:#242424;
      color:#fff;
    }

    .nav-btn.active{
      border-left:3px solid #c9a45c;
    }

    /* MAIN */
    .main{
      margin-left:250px;
      width:calc(100% - 250px);
      padding:30px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:28px;
    }

    .topbar h1{
      margin:0;
      font-size:30px;
    }

    .topbar p{
      color:#777;
      margin:6px 0 0;
    }

    .primary{
      border:0;
      background:#111;
      color:#fff;
      padding:13px 20px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
    }

    .primary:hover{
      background:#c9a45c;
      color:#111;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
      margin-bottom:25px;
    }

    .stat{
      background:#fff;
      border:1px solid #e8e8e5;
      border-radius:16px;
      padding:20px;
    }

    .stat-label{
      color:#777;
      font-size:13px;
    }

    .stat-value{
      font-size:29px;
      font-weight:800;
      margin-top:10px;
    }

    /* PANEL */
    .panel{
      background:#fff;
      border:1px solid #e8e8e5;
      border-radius:18px;
      overflow:hidden;
    }

    .panel-head{
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #eee;
    }

    .panel-head h2{
      margin:0;
      font-size:19px;
    }

    .search{
      width:280px;
      padding:11px 14px;
      border:1px solid #ddd;
      border-radius:9px;
      outline:none;
    }

    /* TABLE */
    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:800px;
    }

    th,td{
      padding:15px 18px;
      text-align:left;
      border-bottom:1px solid #eee;
    }

    th{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.7px;
      color:#777;
      background:#fafafa;
    }

    .product-cell{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .product-img{
      width:48px;
      height:58px;
      border-radius:8px;
      object-fit:cover;
      background:#eee;
    }

    .product-name{
      font-weight:700;
    }

    .product-id{
      color:#999;
      font-size:11px;
      margin-top:3px;
    }

    .badge{
      display:inline-flex;
      padding:5px 9px;
      border-radius:20px;
      font-size:11px;
      font-weight:700;
    }

    .badge.on{
      background:#e8f7ed;
      color:#218344;
    }

    .badge.off{
      background:#f9eaea;
      color:#b63a3a;
    }

    .actions{
      display:flex;
      gap:7px;
    }

    .icon-btn{
      border:1px solid #ddd;
      background:#fff;
      width:35px;
      height:35px;
      border-radius:8px;
      cursor:pointer;
    }

    .icon-btn:hover{
      background:#f4f4f2;
    }

    .icon-btn.delete:hover{
      background:#ffeaea;
      color:#c33;
    }

    /* MODAL */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.58);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding:20px;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      background:#fff;
      width:min(1050px,100%);
      max-height:94vh;
      overflow:auto;
      border-radius:20px;
      padding:28px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .modal-head h2{
      margin:0;
      font-size:25px;
    }

    .close{
      border:0;
      background:#f1f1ef;
      width:38px;
      height:38px;
      border-radius:50%;
      cursor:pointer;
      font-size:20px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .full{
      grid-column:1/-1;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
    }

    input,select,textarea{
      width:100%;
      border:1px solid #ddd;
      background:#fff;
      border-radius:9px;
      padding:12px;
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#c9a45c;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    /* IMAGE UPLOAD */
    .upload-box{
      border:2px dashed #d5d5d2;
      border-radius:15px;
      padding:22px;
      text-align:center;
      cursor:pointer;
      background:#fafaf8;
    }

    .upload-box:hover{
      border-color:#c9a45c;
    }

    .upload-box input{
      display:none;
    }

    .preview{
      display:none;
      width:150px;
      height:170px;
      object-fit:cover;
      border-radius:12px;
      margin:0 auto 12px;
    }

    .upload-title{
      font-weight:800;
    }

    .upload-sub{
      color:#888;
      font-size:12px;
      margin-top:5px;
    }

    /* VARIANTS */
    .variants-section{
      margin-top:25px;
      border-top:1px solid #eee;
      padding-top:25px;
    }

    .variants-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    .variants-head h3{
      margin:0;
    }

    .variant{
      display:grid;
      grid-template-columns:1.2fr 1fr .8fr .8fr auto;
      gap:9px;
      align-items:end;
      padding:12px;
      background:#fafaf8;
      border:1px solid #e9e9e5;
      border-radius:12px;
      margin-bottom:9px;
    }

    .variant small{
      display:block;
      color:#777;
      font-size:10px;
      margin-bottom:5px;
    }

    .remove-variant{
      border:0;
      background:#ffeaea;
      color:#b33;
      height:42px;
      width:42px;
      border-radius:8px;
      cursor:pointer;
    }

    .stock-summary{
      background:#111;
      color:#fff;
      border-radius:12px;
      padding:15px 18px;
      display:flex;
      justify-content:space-between;
      margin-top:12px;
    }

    .stock-summary strong{
      color:#c9a45c;
      font-size:20px;
    }

    .modal-footer{
      margin-top:25px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
      border-top:1px solid #eee;
      padding-top:20px;
    }

    .secondary{
      border:1px solid #ddd;
      background:#fff;
      padding:12px 18px;
      border-radius:9px;
      cursor:pointer;
    }

    /* TOAST */
    .toast{
      position:fixed;
      right:25px;
      bottom:25px;
      background:#111;
      color:#fff;
      padding:14px 18px;
      border-radius:10px;
      opacity:0;
      transform:translateY(15px);
      pointer-events:none;
      transition:.25s;
      z-index:300;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    .loading{
      text-align:center;
      padding:40px;
      color:#777;
    }

    @media(max-width:900px){
      .sidebar{
        width:70px;
        padding:20px 10px;
      }

      .brand{
        font-size:16px;
        padding-left:5px;
      }

      .nav-title{
        display:none;
      }

      .nav-btn{
        font-size:0;
        text-align:center;
      }

      .nav-btn:first-letter{
        font-size:18px;
      }

      .main{
        margin-left:70px;
        width:calc(100% - 70px);
        padding:18px;
      }

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .variant{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:600px){
      .topbar{
        align-items:flex-start;
        gap:12px;
        flex-direction:column;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .search{
        width:100%;
      }

      .modal-box{
        padding:18px;
      }
    }
  </style>

</head>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const BUCKET = "product-images";

let products = [];
let categories = [];
let currentVariants = [];


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function toast(message){

  const box = $("toast");

  box.textContent = message;
  box.classList.add("show");

  setTimeout(() => {
    box.classList.remove("show");
  }, 2800);
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   LOAD
========================================================= */

async function loadCategories(){

  const { data, error } = await supabaseClient
    .from("categories")
    .select("id,name")
    .order("name");

  if(error){

    console.error(error);
    toast("Erreur chargement categories");

    return;
  }

  categories = data || [];

  const select = $("productCategory");

  select.innerHTML =
    `<option value="">Sans catégorie</option>` +
    categories.map(c =>
      `<option value="${c.id}">
        ${escapeHtml(c.name)}
      </option>`
    ).join("");
}


async function loadProducts(){

  $("productsTable").innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        Chargement...
      </td>
    </tr>
  `;

  const { data, error } = await supabaseClient
    .from("products")
    .select(`
      id,
      name,
      description,
      price,
      old_price,
      stock,
      category_id,
      image_url,
      is_active,
      active,
      image,
      colors,
      sizes,
      variant_stock,
      created_at
    `)
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    $("productsTable").innerHTML = `
      <tr>
        <td colspan="7" class="loading">
          Impossible de charger les produits
        </td>
      </tr>
    `;

    toast("Erreur produits");

    return;
  }

  products = data || [];

  await loadVariantStats();

  renderProducts();
  updateStats();
}


let variantStats = {};


async function loadVariantStats(){

  variantStats = {};

  const { data, error } = await supabaseClient
    .from("product_variants")
    .select("id,product_id,color,size,stock,is_active");

  if(error){

    console.error(error);
    return;
  }

  (data || []).forEach(v => {

    if(!variantStats[v.product_id]){

      variantStats[v.product_id] = {
        count:0,
        stock:0
      };
    }

    variantStats[v.product_id].count++;

    if(v.is_active){
      variantStats[v.product_id].stock += Number(v.stock || 0);
    }
  });
}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function getCategoryName(id){

  const cat = categories.find(c => c.id === id);

  return cat ? cat.name : "Sans catégorie";
}


function getProductStock(product){

  if(variantStats[product.id]){
    return variantStats[product.id].stock;
  }

  return Number(product.stock || 0);
}


function renderProducts(){

  const query =
    $("searchInput").value.trim().toLowerCase();

  const filtered = products.filter(p =>
    String(p.name || "")
      .toLowerCase()
      .includes(query)
  );

  if(!filtered.length){

    $("productsTable").innerHTML = `
      <tr>
        <td colspan="7" class="loading">
          Aucun produit trouvé
        </td>
      </tr>
    `;

    return;
  }

  $("productsTable").innerHTML =
    filtered.map(product => {

      const image =
        product.image_url ||
        product.image ||
        "";

      const stats =
        variantStats[product.id] ||
        {count:0,stock:Number(product.stock || 0)};

      const active =
        product.is_active !== false &&
        product.active !== false;

      return `
        <tr>

          <td>

            <div class="product-cell">

              ${
                image
                ?
                `<img
                  class="product-img"
                  src="${escapeHtml(image)}"
                  onerror="this.style.display='none'"
                >`
                :
                `<div class="product-img"></div>`
              }

              <div>
                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="product-id">
                  ${product.id.slice(0,8)}...
                </div>
              </div>

            </div>

          </td>

          <td>
            ${escapeHtml(getCategoryName(product.category_id))}
          </td>

          <td>
            ${Number(product.price || 0).toFixed(2)}
          </td>

          <td>
            <strong>${stats.stock}</strong>
          </td>

          <td>
            ${stats.count}
          </td>

          <td>

            <span class="badge ${active ? "on":"off"}">
              ${active ? "Active":"Inactive"}
            </span>

          </td>

          <td>

            <div class="actions">

              <button
                class="icon-btn"
                title="Modifier"
                onclick="editProduct('${product.id}')"
              >
                ✏️
              </button>

              <button
                class="icon-btn"
                title="Activer / Désactiver"
                onclick="toggleProduct('${product.id}',${active})"
              >
                ${active ? "⏸️":"▶️"}
              </button>

              <button
                class="icon-btn delete"
                title="Supprimer"
                onclick="deleteProduct('${product.id}')"
              >
                🗑️
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  const active =
    products.filter(p =>
      p.is_active !== false &&
      p.active !== false
    ).length;

  let stock = 0;
  let variants = 0;

  products.forEach(p => {

    const stat =
      variantStats[p.id];

    if(stat){

      stock += stat.stock;
      variants += stat.count;

    }else{

      stock += Number(p.stock || 0);

    }

  });

  $("statProducts").textContent = products.length;
  $("statActive").textContent = active;
  $("statStock").textContent = stock;
  $("statVariants").textContent = variants;
}


/* =========================================================
   MODAL
========================================================= */

function openProductModal(product = null){

  $("productModal").classList.add("show");

  if(product){

    $("modalTitle").textContent = "Modifier produit";

    $("productId").value = product.id;

    $("productName").value = product.name || "";

    $("productCategory").value =
      product.category_id || "";

    $("productPrice").value =
      product.price ?? "";

    $("productOldPrice").value =
      product.old_price ?? "";

    $("productDescription").value =
      product.description || "";

    $("productActive").value =
      product.is_active !== false &&
      product.active !== false
        ? "true"
        : "false";

    const image =
      product.image_url ||
      product.image ||
      "";

    if(image){

      $("imagePreview").src = image;
      $("imagePreview").style.display = "block";

    }else{

      $("imagePreview").style.display = "none";

    }

    loadProductVariants(product.id);

  }else{

    $("modalTitle").textContent = "Ajouter produit";

    $("productId").value = "";

    $("productForm").reset();

    $("productActive").value = "true";

    $("imagePreview").style.display = "none";

    currentVariants = [];

    renderVariants();

  }
}


function closeProductModal(){

  $("productModal").classList.remove("show");
}


async function editProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  openProductModal(product);
}


/* =========================================================
   IMAGE
========================================================= */

function previewImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    toast("Veuillez choisir une image");

    event.target.value = "";

    return;
  }

  const url =
    URL.createObjectURL(file);

  $("imagePreview").src = url;
  $("imagePreview").style.display = "block";
}


async function uploadImage(file){

  if(!file) return null;

  const extension =
    file.name.split(".").pop().toLowerCase();

  const filename =
    `${crypto.randomUUID()}.${extension}`;

  const path =
    `products/${filename}`;

  const { error } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(path,file,{
        cacheControl:"3600",
        upsert:false
      });

  if(error){

    console.error(error);

    throw new Error(
      "Upload image impossible: " +
      error.message
    );
  }

  const { data } =
    supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(path);

  return data.publicUrl;
}


/* =========================================================
   VARIANTS
========================================================= */

async function loadProductVariants(productId){

  const { data, error } =
    await supabaseClient
      .from("product_variants")
      .select("*")
      .eq("product_id",productId)
      .order("created_at");

  if(error){

    console.error(error);

    toast("Erreur variantes");

    currentVariants = [];

    renderVariants();

    return;
  }

  currentVariants =
    data || [];

  renderVariants();
}


function addVariant(){

  currentVariants.push({

    id:null,
    color:"",
    size:"",
    stock:0,
    price:"",
    image_url:"",
    is_active:true

  });

  renderVariants();
}


function removeVariant(index){

  currentVariants.splice(index,1);

  renderVariants();
}


function renderVariants(){

  const box =
    $("variantsList");

  if(!currentVariants.length){

    box.innerHTML = `
      <div class="loading">
        Aucune variante.
        Cliquez sur « Ajouter variante ».
      </div>
    `;

    $("totalStock").textContent = "0";

    return;
  }

  box.innerHTML =
    currentVariants.map((variant,index) => {

      return `
        <div class="variant">

          <div>
            <small>Couleur</small>

            <input
              value="${escapeHtml(variant.color || "")}"
              placeholder="Noir"
              oninput="updateVariant(${index},'color',this.value)"
            >
          </div>

          <div>
            <small>Taille</small>

            <input
              value="${escapeHtml(variant.size || "")}"
              placeholder="M"
              oninput="updateVariant(${index},'size',this.value)"
            >
          </div>

          <div>
            <small>Stock</small>

            <input
              type="number"
              min="0"
              value="${Number(variant.stock || 0)}"
              oninput="updateVariant(${index},'stock',this.value)"
            >
          </div>

          <div>
            <small>Prix variant</small>

            <input
              type="number"
              min="0"
              step="0.01"
              value="${variant.price ?? ""}"
              placeholder="Prix"
              oninput="updateVariant(${index},'price',this.value)"
            >
          </div>

          <button
            type="button"
            class="remove-variant"
            onclick="removeVariant(${index})"
          >
            ×
          </button>

        </div>
      `;

    }).join("");

  updateTotalStock();
}


function updateVariant(index,key,value){

  if(key === "stock"){
    value = Math.max(0,Number(value || 0));
  }

  if(key === "price"){
    value =
      value === ""
        ? null
        : Number(value);
  }

  currentVariants[index][key] = value;

  if(key === "stock"){
    updateTotalStock();
  }
}


function updateTotalStock(){

  const total =
    currentVariants.reduce(
      (sum,v) =>
        sum + Math.max(0,Number(v.stock || 0)),
      0
    );

  $("totalStock").textContent = total;
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

$("productForm").addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const id =
      $("productId").value.trim();

    const name =
      $("productName").value.trim();

    const price =
      Number($("productPrice").value || 0);

    const oldPriceValue =
      $("productOldPrice").value;

    const oldPrice =
      oldPriceValue === ""
        ? null
        : Number(oldPriceValue);

    const description =
      $("productDescription").value.trim();

    const categoryId =
      $("productCategory").value || null;

    const isActive =
      $("productActive").value === "true";

    const imageFile =
      $("imageFile").files[0];

    if(!name){

      toast("Nom du produit obligatoire");

      return;
    }

    const saveButton =
      $("productForm")
        .querySelector("button[type='submit']");

    saveButton.disabled = true;
    saveButton.textContent = "Enregistrement...";

    try{

      let imageUrl = null;

      if(imageFile){

        toast("Upload de l'image...");

        imageUrl =
          await uploadImage(imageFile);
      }

      const totalStock =
        currentVariants.reduce(
          (sum,v) =>
            sum + Math.max(0,Number(v.stock || 0)),
          0
        );

      /* -----------------------------------------
         Compatible avec les colonnes anciennes
      ----------------------------------------- */

      const colors = [
        ...new Set(
          currentVariants
            .map(v => String(v.color || "").trim())
            .filter(Boolean)
        )
      ];

      const sizes = [
        ...new Set(
          currentVariants
            .map(v => String(v.size || "").trim())
            .filter(Boolean)
        )
      ];

      const variantStock = {};

      currentVariants.forEach(v => {

        const key =
          `${v.color || ""}_${v.size || ""}`;

        variantStock[key] =
          Number(v.stock || 0);

      });

      const productPayload = {

        name,

        description,

        price,

        old_price:oldPrice,

        stock:totalStock,

        category_id:categoryId,

        is_active:isActive,

        active:isActive,

        colors,

        sizes,

        variant_stock:variantStock

      };

      if(imageUrl){

        productPayload.image_url =
          imageUrl;

        productPayload.image =
          imageUrl;
      }


      let productId = id;


      /* CREATE */
      if(!id){

        const { data,error } =
          await supabaseClient
            .from("products")
            .insert(productPayload)
            .select("id")
            .single();

        if(error) throw error;

        productId =
          data.id;

      }

      /* UPDATE */
      else{

        const { error } =
          await supabaseClient
            .from("products")
            .update(productPayload)
            .eq("id",id);

        if(error) throw error;
      }


      /* -----------------------------------------
         SAVE VARIANTS
      ----------------------------------------- */

      const cleanVariants =
        currentVariants.filter(v =>
          String(v.color || "").trim() ||
          String(v.size || "").trim()
        );


      /* Delete old variants on update.
         Then recreate them.
         This keeps the UI simple and avoids
         duplicate color/size combinations.
      */

      if(id){

        const { error } =
          await supabaseClient
            .from("product_variants")
            .delete()
            .eq("product_id",productId);

        if(error) throw error;
      }


      if(cleanVariants.length){

        const rows =
          cleanVariants.map(v => ({

            product_id:productId,

            color:
              String(v.color || "").trim() || null,

            size:
              String(v.size || "").trim() || null,

            price:
              v.price === "" ||
              v.price === null
                ? price
                : Number(v.price),

            stock:
              Math.max(0,Number(v.stock || 0)),

            image_url:
              imageUrl ||
              v.image_url ||
              null,

            is_active:
              v.is_active !== false

          }));

        const { error } =
          await supabaseClient
            .from("product_variants")
            .insert(rows);

        if(error) throw error;
      }


      toast(
        id
          ? "Produit modifié avec succès ✅"
          : "Produit ajouté avec succès ✅"
      );

      closeProductModal();

      await loadProducts();

    }catch(error){

      console.error(error);

      toast(
        error.message ||
        "Une erreur est survenue"
      );

    }finally{

      saveButton.disabled = false;
      saveButton.textContent = "💾 Enregistrer";

    }

  }
);


/* =========================================================
   DELETE
========================================================= */

async function deleteProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const confirmed =
    confirm(
      `Supprimer "${product.name}" ?\n\nCette action supprimera aussi ses variantes.`
    );

  if(!confirmed) return;

  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);

  if(error){

    console.error(error);

    toast("Suppression impossible");

    return;
  }

  toast("Produit supprimé 🗑️");

  await loadProducts();
}


/* =========================================================
   TOGGLE
========================================================= */

async function toggleProduct(id,current){

  const newValue =
    !current;

  const { error } =
    await supabaseClient
      .from("products")
      .update({
        is_active:newValue,
        active:newValue
      })
      .eq("id",id);

  if(error){

    console.error(error);

    toast("Impossible de modifier le status");

    return;
  }

  toast(
    newValue
      ? "Produit activé ✅"
      : "Produit désactivé"
  );

  await loadProducts();
}

   NAV
========================================================= */

function showProducts(){

  document.querySelectorAll(".nav-btn")
    .forEach(b => b.classList.remove("active"));

  event?.currentTarget?.classList.add("active");
}


function showOrders(){

  toast("Orders — section déjà disponible dans votre Admin");

}

========================================================= */

async function init(){

  try{

    await loadCategories();

    await loadProducts();

  }catch(error){

    console.error(error);

    toast("Erreur initialisation Admin");

  }

}

init();
