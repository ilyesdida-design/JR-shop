<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JR Shop — Admin V7.1</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #111;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      background: #111;
      color: #fff;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
    }

    .logo span {
      color: #22c55e;
    }

    .logout {
      border: 0;
      background: #dc2626;
      color: #fff;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .login {
      max-width: 420px;
      margin: 70px auto;
      background: #fff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }

    .login h1 {
      text-align: center;
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 0 0 6px;
    }

    .field {
      margin-bottom: 12px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      font-weight: bold;
    }

    .green {
      background: #16a34a;
      color: #fff;
    }

    .dark {
      background: #111;
      color: #fff;
    }

    .red {
      background: #dc2626;
      color: #fff;
    }

    .gray {
      background: #e5e7eb;
      color: #111;
    }

    .blue {
      background: #2563eb;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      margin-bottom: 18px;
    }

    .tab {
      border: 0;
      background: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .tab.active {
      background: #16a34a;
      color: #fff;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px #0000000b;
      margin-bottom: 18px;
    }

    .card h2 {
      margin-top: 0;
    }

    .products,
    .orders {
      display: grid;
      gap: 12px;
    }

    .item {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 3px 12px #0000000a;
    }

    .item img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-main h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #dcfce7;
      color: #166534;
    }

    .badge.off {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    .stat b {
      display: block;
      font-size: 25px;
      margin-top: 5px;
      color: #16a34a;
    }

    /* =========================
       ORDERS V7.1
    ========================= */

    .orders-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .order-summary-card {
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000008;
      text-align: center;
    }

    .order-summary-card strong {
      display: block;
      font-size: 22px;
      color: #16a34a;
      margin-top: 5px;
    }

    .order {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 3px 14px #0000000a;
    }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .order-title {
      font-size: 18px;
      font-weight: 900;
    }

    .order-date {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .order-status {
      min-width: 145px;
    }

    .order-status select {
      font-weight: bold;
    }

    .status-pending {
      border-right: 4px solid #f59e0b;
    }

    .status-confirmed {
      border-right: 4px solid #2563eb;
    }

    .status-shipped {
      border-right: 4px solid #8b5cf6;
    }

    .status-delivered {
      border-right: 4px solid #16a34a;
    }

    .status-cancelled {
      border-right: 4px solid #dc2626;
    }

    .order hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }

    .order-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin: 10px 0;
    }

    .order-meta div {
      background: #f8fafc;
      padding: 11px;
      border-radius: 10px;
      line-height: 1.7;
    }

    .order-meta .full {
      grid-column: 1 / -1;
    }

    .order-items {
      background: #f6f7f8;
      border-radius: 11px;
      padding: 13px;
      margin: 12px 0;
      line-height: 1.9;
    }

    .order-item-line {
      border-bottom: 1px solid #e5e7eb;
      padding: 5px 0;
    }

    .order-item-line:last-child {
      border-bottom: 0;
    }

    .order-total {
      background: #ecfdf5;
      color: #166534;
      border-radius: 11px;
      padding: 13px;
      font-size: 19px;
      font-weight: 900;
      text-align: center;
      margin-top: 10px;
    }

    .notes-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      border-radius: 10px;
      padding: 11px;
      margin-top: 10px;
      line-height: 1.7;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .empty {
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      color: #777;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 420px;
      margin: auto;
      background: #111;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 100;
    }

    .hidden {
      display: none !important;
    }

    @media(max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .orders-summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 800px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .order-meta {
        grid-template-columns: 1fr;
      }

      .order-meta .full {
        grid-column: auto;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .item {
        align-items: flex-start;
      }
    }

    @media(max-width: 550px) {
      .orders-summary {
        grid-template-columns: 1fr 1fr;
      }

      .order-head {
        flex-direction: column;
      }

      .order-status {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header id="header" class="hidden">
  <div class="top">
    <div class="logo">
      JR <span>Shop</span> — Admin V7.1
    </div>

    <button id="logoutBtn" class="logout">
      خروج
    </button>
  </div>
</header>


<!-- =========================
     LOGIN
========================= -->

<section id="loginBox" class="login">

  <h1>🔐 JR Shop Admin</h1>

  <p style="text-align:center;color:#777">
    دخول لوحة التحكم
  </p>

  <div class="field">
    <label>Email</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="admin@email.com"
    >
  </div>

  <div class="field">
    <label>كلمة المرور</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••"
    >
  </div>

  <button
    id="loginBtn"
    class="btn green"
    style="width:100%"
  >
    دخول
  </button>

  <p
    id="loginError"
    style="color:#dc2626;text-align:center;line-height:1.6"
  ></p>

</section>


<!-- =========================
     APP
========================= -->

<main id="app" class="container hidden">

  <!-- DASHBOARD STATS -->

  <div class="stats">

    <div class="stat">
      المنتجات
      <b id="statProducts">0</b>
    </div>

    <div class="stat">
      الفئات
      <b id="statCategories">0</b>
    </div>

    <div class="stat">
      الطلبات
      <b id="statOrders">0</b>
    </div>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      data-tab="productsTab"
    >
      📦 المنتجات
    </button>

    <button
      class="tab"
      data-tab="categoriesTab"
    >
      🗂️ الفئات
    </button>

    <button
      class="tab"
      data-tab="ordersTab"
    >
      📋 الطلبات
    </button>

  </div>


  <!-- =========================
       PRODUCTS
       نفس المنطق السابق
  ========================= -->

  <section id="productsTab" class="panel active">

    <div class="grid">

      <div class="card">

        <h2 id="productFormTitle">
          ➕ إضافة منتج
        </h2>

        <input
          type="hidden"
          id="productId"
        >

        <div class="field">
          <label>اسم المنتج</label>
          <input id="pName">
        </div>

        <div class="field">
          <label>الوصف</label>
          <textarea id="pDescription"></textarea>
        </div>

        <div class="field">
          <label>السعر</label>
          <input
            id="pPrice"
            type="number"
            min="0"
          >
        </div>

        <div class="field">
          <label>السعر القديم</label>
          <input
            id="pOldPrice"
            type="number"
            min="0"
          >
        </div>

        <div class="field">
          <label>المخزون</label>
          <input
            id="pStock"
            type="number"
            min="0"
            value="0"
          >
        </div>

        <div class="field">
          <label>الفئة</label>

          <select id="pCategory">
            <option value="">
              بدون فئة
            </option>
          </select>
        </div>

        <div class="field">

          <label>
            صورة المنتج
          </label>

          <input
            id="pImageFile"
            type="file"
            accept="image/*"
          >

          <small style="color:#777">
            اختار صورة من الكمبيوتر، أو استعمل رابط الصورة بالأسفل.
          </small>

        </div>

        <div class="field">

          <label>
            رابط الصورة (اختياري)
          </label>

          <input
            id="pImage"
            placeholder="https://..."
          >

        </div>

        <div class="field">

          <label>
            <input
              id="pActive"
              type="checkbox"
              checked
              style="width:auto"
            >
            المنتج نشط
          </label>

        </div>

        <button
          id="saveProduct"
          class="btn green"
        >
          حفظ المنتج
        </button>

        <button
          id="cancelProduct"
          class="btn gray"
        >
          إلغاء
        </button>

      </div>


      <div>

        <div class="card">

          <h2>
            🔎 المنتجات
          </h2>

          <input
            id="productSearch"
            placeholder="ابحث باسم المنتج..."
          >

        </div>

        <div
          id="productsList"
          class="products"
        ></div>

      </div>

    </div>

  </section>


  <!-- =========================
       CATEGORIES
       نفس المنطق السابق
  ========================= -->

  <section
    id="categoriesTab"
    class="panel"
  >

    <div class="grid">

      <div class="card">

        <h2 id="categoryFormTitle">
          ➕ إضافة فئة
        </h2>

        <input
          type="hidden"
          id="categoryId"
        >

        <div class="field">

          <label>
            اسم الفئة
          </label>

          <input id="cName">

        </div>

        <div class="field">

          <label>
            Slug
          </label>

          <input
            id="cSlug"
            placeholder="women"
          >

        </div>

        <div class="field">

          <label>
            رابط الصورة
          </label>

          <input
            id="cImage"
            placeholder="https://..."
          >

        </div>

        <div class="field">

          <label>
            ترتيب
          </label>

          <input
            id="cOrder"
            type="number"
            value="0"
          >

        </div>

        <div class="field">

          <label>

            <input
              id="cActive"
              type="checkbox"
              checked
              style="width:auto"
            >

            الفئة نشطة

          </label>

        </div>

        <button
          id="saveCategory"
          class="btn green"
        >
          حفظ الفئة
        </button>

        <button
          id="cancelCategory"
          class="btn gray"
        >
          إلغاء
        </button>

      </div>


      <div class="card">

        <h2>
          🗂️ الفئات
        </h2>

        <div id="categoriesList"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       ORDERS V7.1
  ========================= -->

  <section
    id="ordersTab"
    class="panel"
  >

    <!-- SUMMARY -->

    <div class="orders-summary">

      <div class="order-summary-card">
        إجمالي الطلبات
        <strong id="ordersTotalCount">
          0
        </strong>
      </div>

      <div class="order-summary-card">
        Pending
        <strong id="ordersPendingCount">
          0
        </strong>
      </div>

      <div class="order-summary-card">
        Delivered
        <strong id="ordersDeliveredCount">
          0
        </strong>
      </div>

      <div class="order-summary-card">
        المبيعات
        <strong id="ordersTotalMoney">
          0 دج
        </strong>
      </div>

    </div>


    <!-- FILTERS -->

    <div class="card">

      <h2>
        📋 الطلبات
      </h2>

      <p class="muted">
        عرض وإدارة الطلبات الموجودة في Supabase
      </p>

      <div class="filters">

        <input
          id="orderSearch"
          placeholder="ابحث بالاسم، الهاتف، الولاية، البلدية..."
        >

        <select id="orderStatusFilter">

          <option value="">
            كل الحالات
          </option>

          <option value="pending">
            Pending
          </option>

          <option value="confirmed">
            Confirmed
          </option>

          <option value="shipped">
            Shipped
          </option>

          <option value="delivered">
            Delivered
          </option>

          <option value="cancelled">
            Cancelled
          </option>

        </select>


        <select id="orderSort">

          <option value="newest">
            الأحدث أولاً
          </option>

          <option value="oldest">
            الأقدم أولاً
          </option>

          <option value="highest">
            الأعلى سعراً
          </option>

          <option value="lowest">
            الأقل سعراً
          </option>

        </select>

      </div>


      <div class="filter-buttons">

        <button
          id="refreshOrders"
          class="btn green"
        >
          🔄 تحديث
        </button>

        <button
          id="clearOrderFilters"
          class="btn gray"
        >
          مسح الفلاتر
        </button>

      </div>

    </div>


    <!-- ORDERS LIST -->

    <div
      id="ordersList"
      class="orders"
    ></div>

  </section>

</main>


<div
  id="toast"
  class="toast"
></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://cstjgsuehmqcolajspqh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
  "ilyesdida@hotmail.fr";


let products = [];
let categories = [];
let orders = [];

let appLoaded = false;


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


function toast(msg) {

  $("toast").textContent = msg;

  $("toast").style.display = "block";

  clearTimeout(window.jrToastTimer);

  window.jrToastTimer =
    setTimeout(() => {

      $("toast").style.display = "none";

    }, 3000);

}


function esc(v) {

  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

}


function price(v) {

  return Number(v || 0)
    .toLocaleString("fr-FR") + " دج";

}


function showLogin(msg = "") {

  $("loginBox").classList.remove("hidden");

  $("app").classList.add("hidden");

  $("header").classList.add("hidden");

  $("loginError").textContent = msg;

}


function showApp() {

  $("loginBox").classList.add("hidden");

  $("app").classList.remove("hidden");

  $("header").classList.remove("hidden");

  if (!appLoaded) {

    appLoaded = true;

    loadAll();

  }

}


/* =====================================================
   AUTH
===================================================== */

async function checkSession() {

  try {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {

      showLogin(
        "تعذر الاتصال بـ Supabase: " +
        error.message
      );

      return;
    }

    const session = data?.session;

    if (!session) {

      showLogin();

      return;
    }

    const email =
      (session.user?.email || "")
        .trim()
        .toLowerCase();

    if (
      email !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await supabaseClient.auth.signOut();

      showLogin(
        "هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة."
      );

      return;
    }

    showApp();

  } catch (e) {

    console.error(e);

    showLogin(
      "حدث خطأ أثناء التحقق من الدخول."
    );

  }

}


supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    setTimeout(async () => {

      if (event === "SIGNED_OUT") {

        appLoaded = false;

        showLogin();

        return;
      }

      if (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION"
      ) {

        if (session) {

          const email =
            (session.user?.email || "")
              .trim()
              .toLowerCase();

          if (
            email ===
            ADMIN_EMAIL.toLowerCase()
          ) {

            showApp();

          } else {

            await supabaseClient.auth.signOut();

            showLogin(
              "هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة."
            );

          }

        } else {

          showLogin();

        }

      }

    }, 0);

  }
);


/* =====================================================
   LOGIN
===================================================== */

$("loginBtn").onclick =
  async () => {

    $("loginError").textContent = "";

    const email =
      $("email").value
        .trim()
        .toLowerCase();

    const password =
      $("password").value;

    if (!email || !password) {

      $("loginError").textContent =
        "دخل Email وكلمة المرور.";

      return;
    }

    $("loginBtn").disabled = true;

    $("loginBtn").textContent =
      "جاري الدخول...";

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        let msg =
          error.message ||
          "فشل تسجيل الدخول";

        if (
          /invalid login credentials/i.test(msg)
        ) {

          msg =
            "Email أو كلمة المرور غير صحيحة.";

        }

        if (
          /email not confirmed/i.test(msg)
        ) {

          msg =
            "لازم تأكد Email الحساب من Supabase أولًا.";

        }

        $("loginError").textContent =
          msg;

        return;
      }

      const loggedEmail =
        (data?.user?.email || email)
          .trim()
          .toLowerCase();

      if (
        loggedEmail !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        await supabaseClient.auth.signOut();

        $("loginError").textContent =
          "هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة.";

        return;
      }

      showApp();

    } catch (e) {

      console.error(e);

      $("loginError").textContent =
        "تعذر تسجيل الدخول: " +
        (e.message || e);

    } finally {

      $("loginBtn").disabled = false;

      $("loginBtn").textContent =
        "دخول";

    }

  };

/* =====================================================

===================================================== */

$("saveProduct").onclick =
  async () => {

    const id =
      $("productId").value;

    const file =
      $("pImageFile").files[0];

    if (
      !$("pName").value.trim()
    ) {

      toast(
        "اكتب اسم المنتج"
      );

      return;
    }

    let imageUrl =
      $("pImage").value.trim() ||
      null;


    if (file) {

      if (
        file.size >
        5 * 1024 * 1024
      ) {

        toast(
          "الصورة لازم تكون أقل من 5MB"
        );

        return;
      }

      if (
        !file.type.startsWith("image/")
      ) {

        toast(
          "اختار ملف صورة فقط"
        );

        return;
      }

      const ext =
        (
          file.name
            .split(".")
            .pop() ||
          "jpg"
        )
          .toLowerCase()
          .replace(
            /[^a-z0-9]/gi,
            ""
          ) ||
        "jpg";


      const fileName =
        `${crypto.randomUUID()}.${ext}`;


      $("saveProduct").disabled =
        true;

      $("saveProduct").textContent =
        "جاري رفع الصورة...";


      const upload =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            fileName,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (upload.error) {

        $("saveProduct").disabled =
          false;

        $("saveProduct").textContent =
          "حفظ المنتج";

        toast(
          "فشل رفع الصورة: " +
          upload.error.message
        );

        return;
      }


      imageUrl =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(fileName)
          .data
          .publicUrl;

    }


    const obj = {

      name:
        $("pName")
          .value
          .trim(),

      description:
        $("pDescription")
          .value
          .trim(),

      price:
        Number(
          $("pPrice").value || 0
        ),

      old_price:
        Number(
          $("pOldPrice").value || 0
        ),

      stock:
        Number(
          $("pStock").value || 0
        ),

      category_id:
        $("pCategory").value ||
        null,

      image_url:
        imageUrl,

      active:
        $("pActive").checked,

      is_active:
        $("pActive").checked,

      updated_at:
        new Date().toISOString()

    };


    const res = id

      ? await supabaseClient
          .from("products")
          .update(obj)
          .eq("id", id)

      : await supabaseClient
          .from("products")
          .insert(obj);


    $("saveProduct").disabled =
      false;

    $("saveProduct").textContent =
      "حفظ المنتج";


    if (res.error) {

      toast(
        res.error.message
      );

      return;
    }


    toast(
      id
        ? "تم تعديل المنتج مع الصورة ✅"
        : "تمت إضافة المنتج مع الصورة ✅"
    );


    resetProduct();

    loadProducts();

  };

/* =====================================================
   ORDER SUMMARY
===================================================== */

function updateOrderSummary() {

  const total =
    orders.length;


  const pending =
    orders.filter(
      o =>
        String(
          o.status || "pending"
        ).toLowerCase() ===
        "pending"
    ).length;


  const delivered =
    orders.filter(
      o =>
        String(
          o.status || ""
        ).toLowerCase() ===
        "delivered"
    ).length;


  const money =
    orders.reduce(
      (sum, o) =>
        sum +
        Number(
          o.total || 0
        ),
      0
    );


  $("ordersTotalCount")
    .textContent = total;

  $("ordersPendingCount")
    .textContent = pending;

  $("ordersDeliveredCount")
    .textContent = delivered;

  $("ordersTotalMoney")
    .textContent = price(money);

}


/* =====================================================
   ORDER STATUS
===================================================== */

function orderStatusClass(status) {

  const s =
    String(
      status || "pending"
    ).toLowerCase();


  if (
    [
      "pending",
      "confirmed",
      "shipped",
      "delivered",
      "cancelled"
    ].includes(s)
  ) {

    return "status-" + s;

  }


  return "status-pending";

}


/* =====================================================
   ORDER STATUS LABEL
===================================================== */

function statusLabel(status) {

  const s =
    String(
      status || "pending"
    ).toLowerCase();


  const labels = {

    pending:
      "⏳ Pending",

    confirmed:
      "✅ Confirmed",

    shipped:
      "🚚 Shipped",

    delivered:
      "📦 Delivered",

    cancelled:
      "❌ Cancelled"

  };


  return labels[s] ||
    status ||
    "Pending";

}


/* =====================================================
   ORDER ID
===================================================== */

function orderShortId(id) {

  const value =
    String(id || "");


  if (!value) {

    return "—";

  }


  return value.slice(0, 8);

}


/* =====================================================
   ORDER ITEMS
   Handles:
   - JSON array
   - JSON string
   - object
   - null
===================================================== */

function normalizeOrderItems(items) {

  if (!items) {

    return [];

  }


  if (Array.isArray(items)) {

    return items;

  }


  if (typeof items === "string") {

    try {

      const parsed =
        JSON.parse(items);

      if (Array.isArray(parsed)) {

        return parsed;

      }

      if (
        parsed &&
        typeof parsed === "object"
      ) {

        return Object.values(
          parsed
        );

      }

    } catch (e) {

      return [];

    }

  }


  if (
    typeof items === "object"
  ) {

    if (
      Array.isArray(
        items.items
      )
    ) {

      return items.items;

    }

    return Object.values(
      items
    );

  }


  return [];

}


/* =====================================================
   RENDER ORDER ITEMS
===================================================== */

function renderOrderItems(items) {

  const list =
    normalizeOrderItems(items);


  if (!list.length) {

    return `
      <div class="muted">
        لا توجد تفاصيل منتجات داخل هذا الطلب.
      </div>
    `;

  }


  return list
    .map((item, index) => {

      const name =
        item?.name ||
        item?.product_name ||
        item?.title ||
        "منتج";


      const quantity =
        Number(
          item?.quantity ??
          item?.qty ??
          1
        );


      const itemPrice =
        Number(
          item?.price ??
          item?.unit_price ??
          0
        );


      const lineTotal =
        itemPrice *
        quantity;


      return `

        <div class="order-item-line">

          <b>
            ${index + 1}.
            ${esc(name)}
          </b>

          <br>

          الكمية:
          <b>
            ${quantity}
          </b>

          ${
            itemPrice
              ? `
                · السعر:
                ${price(itemPrice)}
              `
              : ""
          }

          ${
            lineTotal
              ? `
                · المجموع:
                <b>
                  ${price(lineTotal)}
                </b>
              `
              : ""
          }

        </div>

      `;

    })
    .join("");

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders() {

  const q =
    $("orderSearch")
      .value
      .trim()
      .toLowerCase();


  const status =
    $("orderStatusFilter")
      .value;


  const sort =
    $("orderSort")
      .value;


  let filtered =
    orders.filter(o => {

      const haystack = [

        o.id,

        o.customer_id,

        o.customer_name,

        o.phone,

        o.wilaya,

        o.commune,

        o.address,

        o.notes,

        o.status

      ]
        .map(
          x =>
            String(
              x ?? ""
            ).toLowerCase()
        )
        .join(" ");


      if (
        q &&
        !haystack.includes(q)
      ) {

        return false;

      }


      if (
        status &&
        String(
          o.status ||
          "pending"
        ).toLowerCase() !==
        status
      ) {

        return false;

      }


      return true;

    });


  /* SORT */

  filtered.sort(
    (a, b) => {

      if (
        sort === "oldest"
      ) {

        return (
          new Date(
            a.created_at || 0
          ) -
          new Date(
            b.created_at || 0
          )
        );

      }


      if (
        sort === "highest"
      ) {

        return (
          Number(
            b.total || 0
          ) -
          Number(
            a.total || 0
          )
        );

      }


      if (
        sort === "lowest"
      ) {

        return (
          Number(
            a.total || 0
          ) -
          Number(
            b.total || 0
          )
        );

      }


      return (
        new Date(

                  "
                >

                  <option
                    value="pending"
                    ${
                      statusValue ===
                      "pending"
                        ? "selected"
                        : ""
                    }
                  >
                    ⏳ Pending
                  </option>

                  <option
                    value="confirmed"
                    ${
                      statusValue ===

                    }

                    }

                    }

                    }
                  >

                  </option>

                </select>

            </div>


            <hr>

                      >
                        ${esc(
                          o.phone
                        )}
                      </a>
                    `
                    : "—"
                }

              </div>


              <div>

                📍

                <b>
                  الولاية
                </b>

                <br>

                ${esc(
                  o.wilaya ||
                  "—"
                )}

              </div>


              <div>

                🏙️

                <b>
                  البلدية
                </b>

                <br>

                ${esc(
                  o.commune ||
                  "—"
                )}

              </div>


              <div class="full">

                🏠

                <b>
                  العنوان
                </b>

                <br>

                ${esc(
                  o.address ||
                  "—"
                )}

              </div>

            </div>


            <!-- NOTES -->

            ${
              o.notes
                ? `
                  <div class="notes-box">

                    📝

                    <b>
                      ملاحظات:
                    </b>

                    <br>

                    ${esc(
                      o.notes
                    )}

                  </div>
                `
                : ""
            }


            <!-- PRODUCTS -->

            <div class="order-items">

              <b>
                🛒 المنتجات
              </b>

              <br><br>

              ${renderOrderItems(
                o.items
              )}

            </div>


            <!-- TOTAL -->

            <div class="order-total">

              💰

              المجموع:

              ${price(
                o.total
              )}

            </div>


            <!-- CUSTOMER ID -->

            ${
              o.customer_id
                ? `
                  <div
                    class="muted"
                    style="
                      margin-top:10px;
                      direction:ltr;
                      text-align:left;
                    "
                  >
                    Customer ID:
                    ${esc(
                      o.customer_id
                    )}
                  </div>
                `
                : ""
            }

          </article>

        `;

      })
      .join("");

}


/* =====================================================
   CHANGE ORDER STATUS
===================================================== */

window.changeStatus =
  async (
    id,
    status
  ) => {

    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .update({
          status
        })
        .eq(
          "id",
          id
        );


    if (error) {

      toast(
        "فشل تحديث الحالة: " +
        error.message
      );

      return;
    }


    toast(
      "تم تحديث حالة الطلب ✅"
    );


    await loadOrders();

  };


/* =====================================================
   ORDER EVENTS
===================================================== */

$("refreshOrders").onclick =
  loadOrders;


$("orderSearch").oninput =
  renderOrders;


$("orderStatusFilter").onchange =
  renderOrders;


$("orderSort").onchange =
  renderOrders;


$("clearOrderFilters").onclick =
  () => {

    $("orderSearch").value =
      "";

    $("orderStatusFilter").value =
      "";

    $("orderSort").value =
      "newest";

    renderOrders();

  };


/* =====================================================
   START
===================================================== */

checkSession();

</script>
