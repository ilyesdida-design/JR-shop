<!doctype html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Produit - JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       PAGE
    ========================= */

    .details-page {
      padding: 25px 0 80px;
    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 20px;

      color: #111;
      text-decoration: none;

      font-weight: 700;
      font-size: 15px;

      transition: .2s ease;
    }

    .back-link:hover {
      transform: translateX(-3px);
    }


    /* =========================
       MAIN CARD
    ========================= */

    .product-details {

      display: grid;

      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(0, .95fr);

      gap: 45px;

      background: #fff;

      border-radius: 26px;

      padding: 28px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);

      overflow: hidden;
    }


    /* =========================
       IMAGE AREA
    ========================= */

    .details-image-area {
      position: relative;
    }

    .details-image-wrapper {

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 22px;

      background: #f4f4f4;

    }

    .details-image {

      display: block;

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      transition:
        transform .45s ease;

    }

    .details-image-wrapper:hover
    .details-image {

      transform: scale(1.04);

    }


    /* =========================
       SALE BADGE
    ========================= */

    .sale-badge {

      position: absolute;

      top: 18px;
      left: 18px;

      z-index: 3;

      background: #111;

      color: #fff;

      padding: 8px 13px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 800;

    }


    /* =========================
       IMAGE ZOOM
    ========================= */

    .image-hint {

      position: absolute;

      right: 15px;
      bottom: 15px;

      background: rgba(255,255,255,.9);

      color: #111;

      padding: 8px 12px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;

      opacity: .9;

    }


    /* =========================
       PRODUCT INFO
    ========================= */

    .details-info {

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 10px 15px;

    }


    .product-category-label {

      color: #888;

      font-size: 13px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .5px;

      margin-bottom: 8px;

    }


    .details-info h1 {

      margin: 0 0 14px;

      color: #111;

      font-size: 40px;

      line-height: 1.15;

      font-weight: 850;

    }


    /* =========================
       PRICE
    ========================= */

    .price-row {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 12px;

      margin: 5px 0 10px;

    }


    .details-price {

      font-size: 30px;

      font-weight: 900;

      color: #111;

    }


    .details-old-price {

      color: #999;

      text-decoration: line-through;

      font-size: 19px;

      font-weight: 600;

    }


    .discount-badge {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 5px 9px;

      border-radius: 7px;

      background: #f1f1f1;

      color: #111;

      font-size: 12px;

      font-weight: 800;

    }


    /* =========================
       STOCK
    ========================= */

    .stock-box {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      width: fit-content;

      margin: 10px 0 25px;

      padding: 9px 13px;

      border-radius: 9px;

      background: #f6f6f6;

      font-size: 14px;

      font-weight: 700;

    }


    .stock-dot {

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #111;

    }


    .stock-box.out {

      color: #777;

    }

    .stock-box.out .stock-dot {

      background: #999;

    }


    /* =========================
       DESCRIPTION
    ========================= */

    .details-description {

      color: #666;

      font-size: 16px;

      line-height: 1.85;

      margin-bottom: 25px;

      white-space: pre-line;

    }


    .description-title {

      color: #111;

      font-size: 16px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity-section {

      margin-bottom: 18px;

    }


    .quantity-title {

      display: block;

      margin-bottom: 8px;

      color: #111;

      font-size: 14px;

      font-weight: 800;

    }


    .quantity-control {

      display: flex;

      align-items: center;

      width: fit-content;

      height: 48px;

      border: 1px solid #ddd;

      border-radius: 12px;

      overflow: hidden;

      background: #fff;

    }


    .quantity-btn {

      width: 48px;

      height: 48px;

      border: 0;

      background: #f7f7f7;

      color: #111;

      font-size: 22px;

      font-weight: 700;

      cursor: pointer;

      transition: .2s ease;

    }


    .quantity-btn:hover {

      background: #eaeaea;

    }


    .quantity-value {

      min-width: 50px;

      text-align: center;

      font-size: 17px;

      font-weight: 800;

    }


    /* =========================
       TOTAL
    ========================= */

    .total-box {

      display: flex;

      align-items: center;

      justify-content: space-between;

      max-width: 400px;

      padding: 14px 0;

      margin-bottom: 15px;

      border-top: 1px solid #eee;

      border-bottom: 1px solid #eee;

    }


    .total-label {

      color: #777;

      font-size: 14px;

      font-weight: 600;

    }


    .total-value {

      color: #111;

      font-size: 19px;

      font-weight: 900;

    }


    /* =========================
       BUTTONS
    ========================= */

    .actions-row {

      display: flex;

      align-items: center;

      gap: 10px;

      max-width: 400px;

    }


    .details-add {

      flex: 1;

      min-height: 52px;

      padding: 15px 20px;

      border: 0;

      border-radius: 13px;

      background: #111;

      color: #fff;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;

    }


    .details-add:hover:not(:disabled) {

      background: #292929;

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(0,0,0,.15);

    }


    .details-add:active:not(:disabled) {

      transform: translateY(0);

    }


    .details-add:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .favorite-btn {

      width: 52px;
      height: 52px;

      border: 1px solid #ddd;

      border-radius: 13px;

      background: #fff;

      color: #111;

      font-size: 23px;

      cursor: pointer;

      transition: .2s ease;

    }


    .favorite-btn:hover {

      background: #f5f5f5;

      transform: translateY(-2px);

    }


    /* =========================
       TRUST BOXES
    ========================= */

    .trust-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      max-width: 500px;

      margin-top: 22px;

    }


    .trust-item {

      padding: 12px 8px;

      text-align: center;

      border-radius: 12px;

      background: #f7f7f7;

      color: #555;

      font-size: 11px;

      line-height: 1.4;

    }


    .trust-icon {

      display: block;

      margin-bottom: 4px;

      font-size: 17px;

    }


    /* =========================
       LOADING
    ========================= */

    .loading-details {

      text-align: center;

      padding: 90px 20px;

      font-size: 20px;

      color: #666;

    }


    /* =========================
       ERROR
    ========================= */

    .error-details {

      text-align: center;

      background: #fff;

      border-radius: 22px;

      padding: 60px 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,.08);

    }


    .error-details h2 {

      margin-top: 0;

      color: #111;

    }


    .error-details a {

      display: inline-block;

      margin-top: 15px;

      padding: 12px 20px;

      background: #111;

      color: #fff;

      text-decoration: none;

      border-radius: 10px;

      font-weight: 700;

    }


    /* =========================
       TOAST
    ========================= */

    .toast {

      position: fixed;

      bottom: 25px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #111;

      color: #fff;

      padding: 14px 22px;

      border-radius: 12px;

      font-weight: 700;

      opacity: 0;

      pointer-events: none;

      transition: .25s ease;

      z-index: 9999;

      box-shadow:
        0 10px 25px rgba(0,0,0,.2);

    }


    .toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .details-page {

        padding:
          18px
          0
          50px;

      }


      .back-link {

        margin-left: 5px;

      }


      .product-details {

        grid-template-columns: 1fr;

        gap: 22px;

        padding: 12px;

        border-radius: 18px;

      }


      .details-image-wrapper {

        border-radius: 15px;

      }


      .details-info {

        padding:
          5px
          6px
          15px;

      }


      .details-info h1 {

        font-size: 28px;

      }


      .details-price {

        font-size: 25px;

      }


      .details-old-price {

        font-size: 17px;

      }


      .details-description {

        font-size: 15px;

      }


      .actions-row {

        max-width: none;

      }


      .details-add {

        min-height: 50px;

      }


      .trust-grid {

        max-width: none;

      }


      .trust-item {

        font-size: 10px;

      }

    }


    @media (max-width: 430px) {

      .product-details {

        margin:
          0 2px;

      }


      .details-info h1 {

        font-size: 25px;

      }


      .details-price {

        font-size: 23px;

      }


      .trust-grid {

        grid-template-columns:
          repeat(3, 1fr);

        gap: 6px;

      }


      .trust-item {

        padding: 10px 4px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="wrap nav">

      <a
        class="logo"
        href="index.html"
      >
        JR <span>Shop</span>
      </a>


      <a
        class="cart-link"
        href="cart.html"
      >

        🛒 Panier

        <b id="cartCount">0</b>

      </a>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="wrap details-page">


    <a
      href="index.html"
      class="back-link"
    >

      ← Retour aux produits

    </a>


    <div id="productDetails">

      <div class="loading-details">

        Chargement du produit...

      </div>

    </div>


  </main>


  <!-- =========================
       TOAST
  ========================= -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    /* =========================
       CART
    ========================= */

    function getCart() {

      try {

        return JSON.parse(
          localStorage.getItem("jr_cart") || "[]"
        );

      } catch (error) {

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "jr_cart",
        JSON.stringify(cart)
      );

      updateCartCount();

    }


    function updateCartCount() {

      const cartCount =
        document.querySelector("#cartCount");

      if (!cartCount) return;

      const cart = getCart();

      const count =
        cart.reduce(
          (total, item) =>
            total + Number(item.qty || 0),
          0
        );

      cartCount.textContent = count;

    }


    /* =========================
       TOAST
    ========================= */

    function toast(message) {

      const box =
        document.querySelector("#toast");

      if (!box) return;

      box.textContent = message;

      box.classList.add("show");

      setTimeout(() => {

        box.classList.remove("show");

      }, 2500);

    }


    /* =========================
       MONEY
    ========================= */

    function money(value) {

      return (
        new Intl.NumberFormat("fr-DZ")
          .format(Number(value || 0))
        + " DA"
      );

    }


    /* =========================
       ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]
      );

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart(product, quantity) {

      if (!product) return;

      const stock =
        Number(product.stock || 0);

      let qty =
        Number(quantity || 1);

      if (stock <= 0) {

        toast(
          "Produit en rupture de stock"
        );

        return;

      }


      if (qty > stock) {

        qty = stock;

        toast(
          "Quantité limitée au stock disponible"
        );

      }


      const cart = getCart();


      const existing =
        cart.find(
          item =>
            String(item.id) ===
            String(product.id)
        );


      if (existing) {

        const newQty =
          Number(existing.qty || 0) + qty;


        if (newQty > stock) {

          toast("Stock insuffisant");

          return;

        }


        existing.qty = newQty;

      } else {

        cart.push({

          id: product.id,

          name: product.name,

          price:
            Number(product.price || 0),

          image_url:
            product.image_url || "",

          qty: qty,

          stock: stock

        });

      }


      saveCart(cart);

      toast(
        `${qty} article(s) ajouté(s) au panier`
      );

    }


    /* =========================
       LOAD PRODUCT
    ========================= */

    async function loadProduct() {

      const box =
        document.querySelector(
          "#productDetails"
        );


      if (!box) return;


      /* URL */

      const params =
        new URLSearchParams(
          window.location.search
        );


      const productId =
        params.get("id");


      /* NO ID */

      if (!productId) {

        box.innerHTML = `

          <div class="error-details">

            <h2>
              Produit introuvable
            </h2>

            <p>
              Aucun produit n'a été sélectionné.
            </p>

            <a href="index.html">
              Retour aux produits
            </a>

          </div>

        `;

        return;

      }


      try {


        /* =========================
           SUPABASE
        ========================= */

        const { data, error } =
          await supabaseClient

            .from("products")

            .select("*")

            .eq("id", productId)

            .eq("is_active", true)

            .single();


        if (error || !data) {

          console.error(
            "Product details error:",
            error
          );


          box.innerHTML = `

            <div class="error-details">

              <h2>
                Produit introuvable
              </h2>

              <p>
                Ce produit n'existe pas
                ou n'est plus disponible.
              </p>

              <a href="index.html">
                Retour aux produits
              </a>

            </div>

          `;

          return;

        }


        const product = data;


        /* =========================
           DATA
        ========================= */

        const image =
          product.image_url ||
          "https://placehold.co/800x800?text=JR+Shop";


        const stock =
          Number(product.stock || 0);


        const price =
          Number(product.price || 0);


        const oldPrice =
          Number(product.old_price || 0);


        let discount = 0;


        if (
          oldPrice > price &&
          oldPrice > 0
        ) {

          discount =
            Math.round(
              ((oldPrice - price) /
                oldPrice) * 100
            );

        }


        /* =========================
           DESCRIPTION
        ========================= */

        const description =
          product.description
            ? `

              <div class="description-title">
                Description
              </div>

              <div class="details-description">

                ${escapeHtml(
                  product.description
                )}

              </div>

            `
            : `

              <div class="description-title">
                Description
              </div>

              <div class="details-description">

                Aucun description disponible
                pour ce produit.

              </div>

            `;


        /* =========================
           SALE
        ========================= */

        const saleBadge =
          discount > 0

            ? `

              <div class="sale-badge">
                -${discount}%
              </div>

            `

            : "";


        /* =========================
           PRICE
        ========================= */

        const oldPriceHtml =
          oldPrice > price

            ? `

              <span class="details-old-price">

                ${money(oldPrice)}

              </span>

              <span class="discount-badge">

                -${discount}%

              </span>

            `

            : "";


        /* =========================
           STOCK
        ========================= */

        const stockHtml =
          stock > 0

            ? `

              <div class="stock-box">

                <span class="stock-dot"></span>

                Stock disponible :
                ${stock}

              </div>

            `

            : `

              <div class="stock-box out">

                <span class="stock-dot"></span>

                Rupture de stock

              </div>

            `;


        /* =========================
           DISPLAY
        ========================= */

        box.innerHTML = `

          <section class="product-details">


            <!-- IMAGE -->

            <div class="details-image-area">

              ${saleBadge}


              <div class="details-image-wrapper">

                <img
                  id="mainProductImage"
                  class="details-image"
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(product.name)}"
                >


                <div class="image-hint">

                  🔍 Survolez pour zoomer

                </div>

              </div>

            </div>


            <!-- INFO -->

            <div class="details-info">


              <div class="product-category-label">

                JR SHOP • PRODUIT

              </div>


              <h1>

                ${escapeHtml(
                  product.name
                )}

              </h1>


              <div class="price-row">


                <span class="details-price">

                  ${money(price)}

                </span>


                ${oldPriceHtml}


              </div>


              ${stockHtml}


              ${description}


              <!-- QUANTITY -->

              <div class="quantity-section">


                <span class="quantity-title">

                  Quantité

                </span>


                <div class="quantity-control">


                  <button
                    type="button"
                    id="minusBtn"
                    class="quantity-btn"
                  >
                    −
                  </button>


                  <span
                    id="quantityValue"
                    class="quantity-value"
                  >
                    1
                  </span>


                  <button
                    type="button"
                    id="plusBtn"
                    class="quantity-btn"
                  >
                    +
                  </button>


                </div>

              </div>


              <!-- TOTAL -->

              <div class="total-box">

                <span class="total-label">

                  Total

                </span>


                <span
                  id="totalValue"
                  class="total-value"
                >

                  ${money(price)}

                </span>

              </div>


              <!-- ACTIONS -->

              <div class="actions-row">


                <button
                  id="detailsAdd"
                  class="details-add"
                  ${stock <= 0 ? "disabled" : ""}
                >

                  ${
                    stock > 0
                      ? "🛒 Ajouter au panier"
                      : "Rupture de stock"
                  }

                </button>


                <button
                  id="favoriteBtn"
                  class="favorite-btn"
                  type="button"
                  aria-label="Ajouter aux favoris"
                >

                  ♡

                </button>


              </div>


              <!-- TRUST -->

              <div class="trust-grid">


                <div class="trust-item">

                  <span class="trust-icon">
                    🚚
                  </span>

                  Livraison disponible

                </div>


                <div class="trust-item">

                  <span class="trust-icon">
                    🔒
                  </span>

                  Paiement sécurisé

                </div>


                <div class="trust-item">

                  <span class="trust-icon">
                    ⭐
                  </span>

                  Qualité JR Shop

                </div>


              </div>


            </div>

          </section>

        `;


        /* =========================
           QUANTITY
        ========================= */

        let quantity = 1;


        const quantityValue =
          document.querySelector(
            "#quantityValue"
          );


        const totalValue =
          document.querySelector(
            "#totalValue"
          );


        const minusBtn =
          document.querySelector(
            "#minusBtn"
          );


        const plusBtn =
          document.querySelector(
            "#plusBtn"
          );


        function updateQuantity() {

          if (quantityValue) {

            quantityValue.textContent =
              quantity;

          }


          if (totalValue) {

            totalValue.textContent =
              money(price * quantity);

          }

        }


        if (minusBtn) {

          minusBtn.addEventListener(
            "click",
            () => {

              if (quantity > 1) {

                quantity--;

                updateQuantity();

              }

            }
          );

        }


        if (plusBtn) {

          plusBtn.addEventListener(
            "click",
            () => {

              if (quantity < stock) {

                quantity++;

                updateQuantity();

              } else {

                toast(
                  "Vous avez atteint le stock disponible"
                );

              }

            }
          );

        }


        /* =========================
           ADD
        ========================= */

        const addButton =
          document.querySelector(
            "#detailsAdd"
          );


        if (addButton) {

          addButton.addEventListener(
            "click",
            () => {

              addToCart(
                product,
                quantity
              );

            }
          );

        }


        /* =========================
           FAVORITE
        ========================= */

        const favoriteBtn =
          document.querySelector(
            "#favoriteBtn"
          );


        if (favoriteBtn) {

          const favorites =
            JSON.parse(
              localStorage.getItem(
                "jr_favorites"
              ) || "[]"
            );


          let favorite =
            favorites.includes(
              String(product.id)
            );


          if (favorite) {

            favoriteBtn.textContent =
              "♥";

          }


          favoriteBtn.addEventListener(
            "click",
            () => {

              let current =
                JSON.parse(
                  localStorage.getItem(
                    "jr_favorites"
                  ) || "[]"
                );


              if (
                current.includes(
                  String(product.id)
                )
              ) {

                current =
                  current.filter(
                    id =>
                      id !==
                      String(product.id)
                  );

                favoriteBtn.textContent =
                  "♡";

                toast(
                  "Retiré des favoris"
                );

              } else {

                current.push(
                  String(product.id)
                );

                favoriteBtn.textContent =
                  "♥";

                toast(
                  "Ajouté aux favoris"
                );

              }


              localStorage.setItem(
                "jr_favorites",
                JSON.stringify(current)
              );

            }
          );

        }


      } catch (error) {

        console.error(
          "Product details JavaScript error:",
          error
        );


        box.innerHTML = `

          <div class="error-details">

            <h2>
              Erreur
            </h2>

            <p>
              Une erreur est survenue
              lors du chargement du produit.
            </p>

            <a href="index.html">
              Retour aux produits
            </a>

          </div>

        `;

      }

    }


    /* =========================
       START
    ========================= */

    updateCartCount();

    loadProduct();

  </script>
