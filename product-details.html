<!doctype html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Produit - JR Shop</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   PRODUCT DETAILS PREMIUM
===================================================== */

.details-page{
  padding:30px 0 80px;
}

/* BACK */

.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px;
  color:#111;
  text-decoration:none;
  font-weight:700;
  font-size:15px;
}

.back-link:hover{
  opacity:.65;
}

/* MAIN */

.product-details{
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:45px;
  background:#fff;
  border-radius:24px;
  padding:25px;
  box-shadow:0 10px 40px rgba(0,0,0,.08);
}

/* IMAGE AREA */

.image-area{
  position:relative;
}

.details-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  overflow:hidden;
  border-radius:20px;
  background:#f3f3f3;
  cursor:zoom-in;
}

.details-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s ease;
}

.details-image-wrap:hover .details-image{
  transform:scale(1.035);
}

/* SALE BADGE */

.sale-badge{
  position:absolute;
  top:16px;
  left:16px;
  z-index:3;
  background:#e53935;
  color:white;
  padding:8px 12px;
  border-radius:10px;
  font-weight:800;
  font-size:14px;
}

/* ZOOM */

.zoom-button{
  position:absolute;
  right:16px;
  bottom:16px;
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
  font-size:20px;
  cursor:pointer;
}

/* INFO */

.details-info{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:5px 15px;
}

.details-category{
  color:#777;
  font-size:14px;
  font-weight:600;
  margin-bottom:10px;
}

.details-info h1{
  font-size:40px;
  line-height:1.15;
  margin:0 0 14px;
  color:#111;
}

/* RATING */

.rating{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
}

.stars{
  color:#f5a900;
  letter-spacing:2px;
  font-size:18px;
}

.rating-text{
  color:#777;
  font-size:14px;
}

/* PRICE */

.details-price-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:15px;
}

.details-price{
  font-size:32px;
  font-weight:900;
  color:#111;
}

.details-old-price{
  color:#999;
  text-decoration:line-through;
  font-size:19px;
  font-weight:600;
}

.discount-percent{
  background:#ffe7e7;
  color:#d32f2f;
  padding:5px 9px;
  border-radius:7px;
  font-size:13px;
  font-weight:800;
}

/* STOCK */

.details-stock{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0 22px;
  font-weight:700;
}

.stock-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#22b14c;
}

.stock-dot.out{
  background:#e53935;
}

/* DESCRIPTION */

.details-description{
  color:#555;
  line-height:1.8;
  margin-bottom:22px;
  white-space:pre-line;
  font-size:15px;
}

/* DIVIDER */

.details-divider{
  height:1px;
  background:#eee;
  margin:4px 0 20px;
}

/* QUANTITY */

.buy-row{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:12px;
  margin-bottom:12px;
}

.quantity-box{
  height:54px;
  border:1px solid #ddd;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}

.quantity-box button{
  width:50px;
  height:100%;
  border:0;
  background:white;
  font-size:22px;
  cursor:pointer;
}

.quantity-box button:hover{
  background:#f5f5f5;
}

.quantity-value{
  font-size:18px;
  font-weight:800;
}

/* TOTAL */

.total-box{
  margin:10px 0 18px;
  padding:14px 17px;
  background:#f7f7f7;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total-box span{
  color:#666;
}

.total-box strong{
  font-size:20px;
}

/* ADD */

.details-add{
  width:100%;
  min-height:55px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.details-add:hover{
  background:#292929;
  transform:translateY(-1px);
}

.details-add:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* FAVORITE */

.favorite-button{
  width:100%;
  min-height:52px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.favorite-button.active{
  border-color:#e53935;
  color:#e53935;
}

/* BENEFITS */

.benefits{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:#e8e8e8;
  margin-top:25px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.benefit{
  background:#fff;
  padding:20px 14px;
  text-align:center;
}

.benefit-icon{
  font-size:24px;
  margin-bottom:8px;
}

.benefit strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.benefit span{
  color:#777;
  font-size:12px;
}

/* DESCRIPTION CARD */

.product-description-card{
  margin-top:25px;
  background:white;
  border-radius:20px;
  padding:28px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.product-description-card h2{
  margin:0 0 15px;
  font-size:23px;
}

.description-content{
  color:#555;
  line-height:1.9;
  white-space:pre-line;
}

/* RELATED */

.related-section{
  margin-top:35px;
}

.related-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.related-head h2{
  margin:0;
  font-size:25px;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.related-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.07);
  transition:.2s;
}

.related-card:hover{
  transform:translateY(-4px);
}

.related-card a{
  text-decoration:none;
  color:inherit;
}

.related-image{
  width:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  display:block;
  background:#f3f3f3;
}

.related-body{
  padding:14px;
}

.related-body h3{
  margin:0 0 8px;
  font-size:16px;
}

.related-price{
  font-size:18px;
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
  font-weight:600;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* IMAGE MODAL */

.image-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
  padding:20px;
}

.image-modal.show{
  display:flex;
}

.image-modal img{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain;
  border-radius:12px;
}

.close-modal{
  position:absolute;
  top:20px;
  right:25px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:25px;
  cursor:pointer;
}

/* LOADING */

.loading-details{
  text-align:center;
  padding:100px 20px;
  font-size:20px;
}

/* MOBILE */

@media(max-width:900px){

  .product-details{
    grid-template-columns:1fr;
    gap:25px;
    padding:15px;
  }

  .details-info{
    padding:5px;
  }

  .details-info h1{
    font-size:30px;
  }

  .details-price{
    font-size:27px;
  }

  .benefits{
    grid-template-columns:repeat(2,1fr);
  }

  .related-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:520px){

  .details-page{
    padding:20px 0 50px;
  }

  .product-details{
    border-radius:16px;
  }

  .details-image-wrap{
    border-radius:14px;
  }

  .details-info h1{
    font-size:27px;
  }

  .details-price{
    font-size:25px;
  }

  .buy-row{
    grid-template-columns:1fr;
  }

  .quantity-box{
    width:100%;
  }

  .benefits{
    grid-template-columns:1fr 1fr;
    border-radius:14px;
  }

  .benefit{
    padding:15px 8px;
  }

  .related-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .related-body{
    padding:10px;
  }

  .related-body h3{
    font-size:14px;
  }

}

/* SMALL MOBILE */

@media(max-width:360px){

  .related-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="site-header">

  <div class="wrap nav">

    <a
      class="logo"
      href="index.html"
    >
      JR <span>Shop</span>
    </a>

    <a
      class="cart-link"
      href="cart.html"
    >
      🛒 Panier
      <b id="cartCount">0</b>
    </a>

  </div>

</header>


<!-- MAIN -->

<main class="wrap details-page">


  <a
    href="index.html"
    class="back-link"
  >
    ← Retour aux produits
  </a>


  <!-- PRODUCT -->

  <div id="productDetails">

    <div class="loading-details">
      Chargement du produit...
    </div>

  </div>


  <!-- RELATED -->

  <section
    id="relatedSection"
    class="related-section"
    style="display:none"
  >

    <div class="related-head">

      <h2>
        Produits similaires
      </h2>

    </div>

    <div
      id="relatedProducts"
      class="related-grid"
    ></div>

  </section>


</main>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>


<!-- IMAGE MODAL -->

<div
  id="imageModal"
  class="image-modal"
>

  <button
    id="closeModal"
    class="close-modal"
  >
    ×
  </button>

  <img
    id="modalImage"
    src=""
    alt="Produit"
  >

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =====================================================
   CART
===================================================== */

function getCart(){

  try{

    return JSON.parse(
      localStorage.getItem("jr_cart") || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "jr_cart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount(){

  const cartCount =
    document.querySelector("#cartCount");

  if(!cartCount) return;

  const cart = getCart();

  const count = cart.reduce(
    (total,item) =>
      total + Number(item.qty || 0),
    0
  );

  cartCount.textContent = count;

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const box =
    document.querySelector("#toast");

  if(!box) return;

  box.textContent = message;

  box.classList.add("show");

  setTimeout(()=>{

    box.classList.remove("show");

  },2500);

}


/* =====================================================
   MONEY
===================================================== */

function money(value){

  return new Intl.NumberFormat(
    "fr-DZ"
  ).format(
    Number(value || 0)
  ) + " DA";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[character]
  );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(product,quantity = 1){

  if(!product) return;

  const stock =
    Number(product.stock || 0);

  if(stock <= 0){

    toast(
      "Produit en rupture de stock"
    );

    return;

  }

  const qty =
    Math.max(
      1,
      Math.min(
        Number(quantity) || 1,
        stock
      )
    );

  const cart = getCart();

  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(product.id)
    );

  if(existing){

    if(
      existing.qty + qty >
      stock
    ){

      toast("Stock insuffisant");

      return;

    }

    existing.qty += qty;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(
        product.price || 0
      ),

      image_url:
        product.image_url || "",

      qty:qty,

      stock:stock

    });

  }

  saveCart(cart);

  toast(
    "Produit ajouté au panier ✓"
  );

}


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "jr_favorites"
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveFavorites(list){

  localStorage.setItem(
    "jr_favorites",
    JSON.stringify(list)
  );

}


function toggleFavorite(productId){

  let favorites =
    getFavorites();

  const id =
    String(productId);

  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        item => item !== id
      );

    saveFavorites(favorites);

    return false;

  }

  favorites.push(id);

  saveFavorites(favorites);

  return true;

}


/* =====================================================
   DISCOUNT
===================================================== */

function calculateDiscount(
  price,
  oldPrice
){

  const p =
    Number(price || 0);

  const old =
    Number(oldPrice || 0);

  if(
    old <= 0 ||
    p <= 0 ||
    old <= p
  ){

    return 0;

  }

  return Math.round(
    ((old - p) / old) * 100
  );

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

  const box =
    document.querySelector(
      "#productDetails"
    );

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");

  if(!productId){

    box.innerHTML = `
      <div class="loading-details">
        Produit introuvable.
      </div>
    `;

    return;

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient

        .from("products")

        .select("*")

        .eq("id",productId)

        .eq("is_active",true)

        .single();


    if(error || !data){

      console.error(
        "Product details error:",
        error
      );

      box.innerHTML = `
        <div class="loading-details">
          Produit introuvable.
        </div>
      `;

      return;

    }


    const product = data;


    const image =
      product.image_url ||
      "https://placehold.co/900x900?text=JR+Shop";


    const price =
      Number(product.price || 0);


    const oldPrice =
      Number(product.old_price || 0);


    const stock =
      Number(product.stock || 0);


    const discount =
      calculateDiscount(
        price,
        oldPrice
      );


    const favorites =
      getFavorites();


    const isFavorite =
      favorites.includes(
        String(product.id)
      );


    const description =
      product.description ||
      "Aucune description disponible pour ce produit.";


    box.innerHTML = `

      <section class="product-details">


        <!-- IMAGE -->

        <div class="image-area">

          ${
            discount > 0
              ? `
                <div class="sale-badge">
                  -${discount}%
                </div>
              `
              : ""
          }


          <div
            id="imageWrap"
            class="details-image-wrap"
          >

            <img
              id="mainProductImage"
              class="details-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
            >

            <button
              id="zoomButton"
              class="zoom-button"
              type="button"
              aria-label="Agrandir"
            >
              🔍
            </button>

          </div>

        </div>


        <!-- INFO -->

        <div class="details-info">


          <div class="details-category">
            JR Shop
          </div>


          <h1>
            ${escapeHtml(product.name)}
          </h1>


          <div class="rating">

            <span class="stars">
              ★★★★★
            </span>

            <span class="rating-text">
              Produit disponible
            </span>

          </div>


          <!-- PRICE -->

          <div class="details-price-row">

            <span class="details-price">
              ${money(price)}
            </span>


            ${
              oldPrice > price
                ? `
                  <span class="details-old-price">
                    ${money(oldPrice)}
                  </span>

                  <span class="discount-percent">
                    -${discount}%
                  </span>
                `
                : ""
            }

          </div>


          <!-- STOCK -->

          <div class="details-stock">

            <span
              class="stock-dot ${
                stock <= 0 ? "out" : ""
              }"
            ></span>

            ${
              stock > 0
                ? `En stock : ${stock} disponible${stock > 1 ? "s" : ""}`
                : "Rupture de stock"
            }

          </div>


          <!-- DESCRIPTION -->

          <div class="details-description">
            ${escapeHtml(description)}
          </div>


          <div class="details-divider"></div>


          <!-- QUANTITY -->

          <div class="buy-row">

            <div class="quantity-box">

              <button
                id="minusBtn"
                type="button"
              >
                −
              </button>

              <span
                id="quantityValue"
                class="quantity-value"
              >
                1
              </span>

              <button
                id="plusBtn"
                type="button"
              >
                +
              </button>

            </div>

          </div>


          <!-- TOTAL -->

          <div class="total-box">

            <span>
              Total
            </span>

            <strong
              id="totalPrice"
            >
              ${money(price)}
            </strong>

          </div>


          <!-- ADD -->

          <button
            id="detailsAdd"
            class="details-add"
            type="button"
            ${stock <= 0 ? "disabled" : ""}
          >

            ${
              stock > 0
                ? "🛒 Ajouter au panier"
                : "Rupture de stock"
            }

          </button>


          <!-- FAVORITE -->

          <button
            id="favoriteButton"
            class="favorite-button ${
              isFavorite ? "active" : ""
            }"
            type="button"
          >

            ${
              isFavorite
                ? "❤️ Retirer des favoris"
                : "♡ Ajouter aux favoris"
            }

          </button>


        </div>

      </section>


      <!-- BENEFITS -->

      <section class="benefits">

        <div class="benefit">

          <div class="benefit-icon">
            🚚
          </div>

          <strong>
            Livraison rapide
          </strong>

          <span>
            Partout en Algérie
          </span>

        </div>


        <div class="benefit">

          <div class="benefit-icon">
            🔒
          </div>

          <strong>
            Paiement sécurisé
          </strong>

          <span>
            Commande protégée
          </span>

        </div>


        <div class="benefit">

          <div class="benefit-icon">
            ⭐
          </div>

          <strong>
            Qualité
          </strong>

          <span>
            Produits sélectionnés
          </span>

        </div>


        <div class="benefit">

          <div class="benefit-icon">
            💬
          </div>

          <strong>
            Support
          </strong>

          <span>
            Assistance dédiée
          </span>

        </div>

      </section>


      <!-- DESCRIPTION CARD -->

      <section class="product-description-card">

        <h2>
          Description du produit
        </h2>

        <div class="description-content">
          ${escapeHtml(description)}
        </div>

      </section>

    `;


    /* =================================================
       QUANTITY
    ================================================= */

    let quantity = 1;


    const quantityValue =
      document.querySelector(
        "#quantityValue"
      );


    const totalPrice =
      document.querySelector(
        "#totalPrice"
      );


    function updateQuantity(){

      quantityValue.textContent =
        quantity;

      totalPrice.textContent =
        money(
          price * quantity
        );

    }


    document
      .querySelector("#minusBtn")
      .addEventListener(
        "click",
        () => {

          if(quantity > 1){

            quantity--;

            updateQuantity();

          }

        }
      );


    document
      .querySelector("#plusBtn")
      .addEventListener(
        "click",
        () => {

          if(quantity < stock){

            quantity++;

            updateQuantity();

          }else{

            toast(
              "Vous avez atteint le stock disponible"
            );

          }

        }
      );


    /* =================================================
       ADD TO CART
    ================================================= */

    const addButton =
      document.querySelector(
        "#detailsAdd"
      );


    if(addButton){

      addButton.addEventListener(
        "click",
        () => {

          addToCart(
            product,
            quantity
          );

        }
      );

    }


    /* =================================================
       FAVORITE
    ================================================= */

    const favoriteButton =
      document.querySelector(
        "#favoriteButton"
      );


    if(favoriteButton){

      favoriteButton.addEventListener(
        "click",
        () => {

          const active =
            toggleFavorite(
              product.id
            );


          favoriteButton.classList.toggle(
            "active",
            active
          );


          favoriteButton.textContent =
            active
              ? "❤️ Retirer des favoris"
              : "♡ Ajouter aux favoris";


          toast(
            active
              ? "Ajouté aux favoris ❤️"
              : "Retiré des favoris"
          );

        }
      );

    }


    /* =================================================
       ZOOM
    ================================================= */

    const imageWrap =
      document.querySelector(
        "#imageWrap"
      );


    const zoomButton =
      document.querySelector(
        "#zoomButton"
      );


    const imageModal =
      document.querySelector(
        "#imageModal"
      );


    const modalImage =
      document.querySelector(
        "#modalImage"
      );


    function openImage(){

      modalImage.src = image;

      imageModal.classList.add(
        "show"
      );

    }


    imageWrap.addEventListener(
      "click",
      openImage
    );


    zoomButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        openImage();

      }
    );


    document
      .querySelector("#closeModal")
      .addEventListener(
        "click",
        () => {

          imageModal.classList.remove(
            "show"
          );

        }
      );


    imageModal.addEventListener(
      "click",
      event => {

        if(
          event.target === imageModal
        ){

          imageModal.classList.remove(
            "show"
          );

        }

      }
    );


    /* =================================================
       RELATED PRODUCTS
    ================================================= */

    loadRelatedProducts(
      product
    );


  }catch(error){

    console.error(
      "Product details JavaScript error:",
      error
    );


    box.innerHTML = `
      <div class="loading-details">
        Erreur lors du chargement du produit.
      </div>
    `;

  }

}


/* =====================================================
   RELATED PRODUCTS
===================================================== */

async function loadRelatedProducts(
  currentProduct
){

  const section =
    document.querySelector(
      "#relatedSection"
    );


  const box =
    document.querySelector(
      "#relatedProducts"
    );


  if(!section || !box) return;


  try{

    let query =
      supabaseClient
        .from("products")
        .select("*")
        .eq("is_active",true)
        .neq("id",currentProduct.id)
        .order("created_at",{
          ascending:false
        })
        .limit(4);


    if(
      currentProduct.category_id
    ){

      query =
        supabaseClient
          .from("products")
          .select("*")
          .eq("is_active",true)
          .eq(
            "category_id",
            currentProduct.category_id
          )
          .neq(
            "id",
            currentProduct.id
          )
          .order("created_at",{
            ascending:false
          })
          .limit(4);

    }


    const {
      data,
      error
    } = await query;


    if(
      error ||
      !data ||
      !data.length
    ){

      return;

    }


    box.innerHTML =
      data.map(product => {

        const image =
          product.image_url ||
          "https://placehold.co/600x600?text=JR+Shop";


        return `

          <article class="related-card">

            <a
              href="product-details.html?id=${encodeURIComponent(product.id)}"
            >

              <img
                class="related-image"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
                loading="lazy"
              >

              <div class="related-body">

                <h3>
                  ${escapeHtml(product.name)}
                </h3>

                <div class="related-price">
                  ${money(product.price)}
                </div>

              </div>

            </a>

          </article>

        `;

      }).join("");


    section.style.display =
      "block";


  }catch(error){

    console.error(
      "Related products error:",
      error
    );

  }

}


/* =====================================================
   START
===================================================== */

updateCartCount();

loadProduct();

</script>
