<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit — JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .product-details {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 40px;
      margin: 35px 0 60px;
    }

    .product-gallery,
    .product-info {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .main-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 14px;
      background: #f5f5f5;
    }

    .main-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumbs {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .thumb {
      width: 75px;
      height: 75px;
      flex: 0 0 75px;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      background: #f5f5f5;
      cursor: pointer;
    }

    .thumb.active {
      border-color: #111;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .price-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
    }

    .current-price {
      font-size: 28px;
      font-weight: 800;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
    }

    .stock {
      margin: 15px 0;
      font-weight: 600;
    }

    .stock.ok {
      color: #16803c;
    }

    .stock.out {
      color: #c62828;
    }

    .option-group {
      margin: 22px 0;
    }

    .option-group h3 {
      margin-bottom: 10px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
    }

    .option-btn.active {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .quantity-box button {
      width: 40px;
      height: 40px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
    }

    #quantity {
      min-width: 35px;
      text-align: center;
      font-weight: 700;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .actions .btn {
      width: 100%;
    }

    .description {
      margin-top: 25px;
      line-height: 1.7;
      color: #555;
      white-space: pre-line;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: inherit;
    }

    .loading,
    .error-box {
      text-align: center;
      padding: 50px 20px;
    }

    @media (max-width: 800px) {
      .product-details {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .product-info h1 {
        font-size: 25px;
      }
    }
  </style>

</head>

<body>

<header class="site-header">
  <div class="wrap nav">

```
<a class="logo" href="index.html">
  JR <span>Shop</span>
</a>

<a class="cart-link" href="cart.html">
  🛒 Panier
  <b id="cartCount">0</b>
</a>
```

  </div>
</header>

<main class="wrap">

  <a class="back-link" href="index.html">
    ← Retour aux produits
  </a>

  <div id="productContainer">

```
<div class="card loading">
  <h2>Chargement du produit...</h2>
</div>
```

  </div>

</main>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="config.js"></script>

<script src="product-details.js"></script>

</body>
</html>
