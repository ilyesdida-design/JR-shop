<!doctype html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Produit - JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       PRODUCT DETAILS PREMIUM
    ========================= */

    .details-page {
      padding: 35px 0 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      transition: .2s;
    }

    .back-link:hover {
      transform: translateX(-4px);
    }


    /* =========================
       MAIN CARD
    ========================= */

    .product-details {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      gap: 55px;

      background: #fff;

      border-radius: 28px;

      padding: 28px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);

      overflow: hidden;
    }


    /* =========================
       IMAGE
    ========================= */

    .details-image-box {
      position: relative;

      border-radius: 22px;

      overflow: hidden;

      background: #f4f4f4;

      min-height: 520px;
    }

    .details-image {
      width: 100%;
      height: 100%;
      min-height: 520px;

      display: block;

      object-fit: cover;

      transition: transform .45s ease;
    }

    .details-image-box:hover .details-image {
      transform: scale(1.025);
    }


    /* =========================
       BADGE
    ========================= */

    .product-badge {
      position: absolute;

      top: 18px;
      left: 18px;

      z-index: 2;

      background: #111;
      color: #fff;

      padding: 9px 15px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 700;

      box-shadow:
        0 6px 18px rgba(0,0,0,.18);
    }


    /* =========================
       INFO
    ========================= */

    .details-info {
      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 15px 10px;
    }


    .details-category {
      display: inline-flex;

      width: fit-content;

      padding: 7px 12px;

      border-radius: 999px;

      background: #f3f3f3;

      color: #666;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 15px;
    }


    .details-info h1 {
      font-size: 42px;

      line-height: 1.15;

      margin: 0 0 18px;

      color: #111;
    }


    /* =========================
       PRICE
    ========================= */

    .details-price {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 12px;

      font-size: 32px;

      font-weight: 900;

      margin: 5px 0 18px;

      color: #111;
    }

    .details-old-price {
      color: #999;

      text-decoration: line-through;

      font-size: 21px;

      font-weight: 600;
    }


    .discount-badge {
      background: #111;

      color: white;

      padding: 5px 9px;

      border-radius: 7px;

      font-size: 12px;

      font-weight: 800;
    }


    /* =========================
       STOCK
    ========================= */

    .details-stock {
      display: flex;

      align-items: center;

      gap: 9px;

      margin: 4px 0 25px;

      font-weight: 700;

      font-size: 15px;
    }

    .stock-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #16a34a;
    }

    .stock-dot.out {
      background: #dc2626;
    }


    /* =========================
       DIVIDER
    ========================= */

    .details-divider {
      width: 100%;
      height: 1px;

      background: #eee;

      margin: 3px 0 23px;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .details-description-title {
      font-size: 15px;

      font-weight: 800;

      margin-bottom: 8px;
    }

    .details-description {
      color: #666;

      line-height: 1.8;

      margin-bottom: 25px;

      white-space: pre-line;

      font-size: 15px;
    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity-title {
      font-size: 14px;

      font-weight: 800;

      margin-bottom: 9px;
    }

    .quantity-box {
      display: flex;

      align-items: center;

      width: fit-content;

      border: 1px solid #ddd;

      border-radius: 12px;

      overflow: hidden;

      margin-bottom: 18px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;

      border: 0;

      background: #f7f7f7;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }

    .quantity-btn:hover {
      background: #eaeaea;
    }

    .quantity-value {
      min-width: 48px;

      text-align: center;

      font-size: 16px;

      font-weight: 800;
    }


    /* =========================
       ADD BUTTON
    ========================= */

    .details-add {
      width: 100%;

      min-height: 56px;

      padding: 15px 20px;

      border: 0;

      border-radius: 14px;

      background: #111;

      color: white;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .2s,
        background .2s,
        box-shadow .2s;
    }

    .details-add:hover:not(:disabled) {
      transform: translateY(-2px);

      background: #222;

      box-shadow:
        0 10px 25px rgba(0,0,0,.15);
    }

    .details-add:active:not(:disabled) {
      transform: scale(.98);
    }

    .details-add:disabled {
      opacity: .5;

      cursor: not-allowed;
    }


    /* =========================
       TRUST INFO
    ========================= */

    .trust-box {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 18px;
    }

    .trust-item {
      background: #f7f7f7;

      border-radius: 12px;

      padding: 12px 8px;

      text-align: center;

      font-size: 12px;

      font-weight: 700;

      color: #444;
    }

    .trust-item span {
      display: block;

      font-size: 18px;

      margin-bottom: 4px;
    }


    /* =========================
       LOADING
    ========================= */

    .loading-details {
      text-align: center;

      padding: 100px 20px;

      font-size: 20px;

      font-weight: 700;
    }


    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      bottom: 25px;
      left: 50%;

      transform:
        translate(-50%, 20px);

      background: #111;

      color: white;

      padding: 13px 20px;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 700;

      opacity: 0;

      pointer-events: none;

      transition: .3s;

      z-index: 9999;

      box-shadow:
        0 10px 30px rgba(0,0,0,.2);
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .details-page {
        padding:
          20px 12px 50px;
      }

      .product-details {
        grid-template-columns: 1fr;

        gap: 22px;

        padding: 12px;

        border-radius: 20px;
      }

      .details-image-box {
        min-height: 360px;

        border-radius: 17px;
      }

      .details-image {
        min-height: 360px;
      }

      .details-info {
        padding: 8px 5px 15px;
      }

      .details-info h1 {
        font-size: 29px;

        margin-bottom: 12px;
      }

      .details-price {
        font-size: 26px;
      }

      .details-old-price {
        font-size: 17px;
      }

      .trust-box {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .trust-item {
        padding: 10px 4px;

        font-size: 10px;
      }

      .trust-item span {
        font-size: 16px;
      }

    }


    @media (max-width: 430px) {

      .details-image-box {
        min-height: 320px;
      }

      .details-image {
        min-height: 320px;
      }

      .details-info h1 {
        font-size: 26px;
      }

      .details-price {
        font-size: 24px;
      }

      .details-add {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<header class="site-header">

  <div class="wrap nav">

    <a
      class="logo"
      href="index.html"
    >
      JR <span>Shop</span>
    </a>

    <a
      class="cart-link"
      href="cart.html"
    >
      🛒 Panier
      <b id="cartCount">0</b>
    </a>

  </div>

</header>


<main class="wrap details-page">

  <a
    href="index.html"
    class="back-link"
  >
    ← Retour aux produits
  </a>


  <div id="productDetails">

    <div class="loading-details">
      Chargement du produit...
    </div>

  </div>

</main>


<div
  id="toast"
  class="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

  /* =========================
     CART
  ========================= */

  function getCart() {

    try {

      return JSON.parse(
        localStorage.getItem("jr_cart") || "[]"
      );

    } catch (error) {

      return [];

    }

  }


  function saveCart(cart) {

    localStorage.setItem(
      "jr_cart",
      JSON.stringify(cart)
    );

    updateCartCount();

  }


  function updateCartCount() {

    const cartCount =
      document.querySelector("#cartCount");

    if (!cartCount) return;

    const cart = getCart();

    const count = cart.reduce(
      (total, item) =>
        total + Number(item.qty || 0),
      0
    );

    cartCount.textContent = count;

  }


  /* =========================
     TOAST
  ========================= */

  function toast(message) {

    const box =
      document.querySelector("#toast");

    if (!box) return;

    box.textContent = message;

    box.classList.add("show");

    setTimeout(() => {

      box.classList.remove("show");

    }, 2500);

  }


  /* =========================
     MONEY
  ========================= */

  function money(value) {

    return (
      new Intl.NumberFormat("fr-DZ").format(
        Number(value || 0)
      ) + " DA"
    );

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "").replace(
      /[&<>"']/g,
      (character) => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      })[character]
    );

  }


  /* =========================
     ADD TO CART
  ========================= */

  function addToCart(product, quantity) {

    if (!product) return;

    const stock =
      Number(product.stock || 0);

    const qty =
      Number(quantity || 1);

    if (stock <= 0) {

      toast(
        "Produit en rupture de stock"
      );

      return;

    }

    if (qty > stock) {

      toast("Stock insuffisant");

      return;

    }

    const cart = getCart();

    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(product.id)
      );

    if (existing) {

      if (
        Number(existing.qty || 0) + qty >
        stock
      ) {

        toast("Stock insuffisant");

        return;

      }

      existing.qty =
        Number(existing.qty || 0) + qty;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price:
          Number(product.price || 0),

        image_url:
          product.image_url || "",

        qty: qty,

        stock: stock

      });

    }

    saveCart(cart);

    toast(
      "✓ Produit ajouté au panier"
    );

  }


  /* =========================
     LOAD PRODUCT
  ========================= */

  async function loadProduct() {

    const box =
      document.querySelector(
        "#productDetails"
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const productId =
      params.get("id");

    if (!productId) {

      box.innerHTML = `
        <div class="loading-details">
          Produit introuvable.
        </div>
      `;

      return;

    }


    try {

      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .eq("id", productId)
          .eq("is_active", true)
          .single();


      if (error || !data) {

        console.error(
          "Product details error:",
          error
        );

        box.innerHTML = `
          <div class="loading-details">
            Produit introuvable.
          </div>
        `;

        return;

      }


      const product = data;


      const image =
        product.image_url ||
        "https://placehold.co/800x800?text=JR+Shop";


      const stock =
        Number(product.stock || 0);


      const price =
        Number(product.price || 0);


      const oldPrice =
        Number(product.old_price || 0);


      /* DISCOUNT */

      let discount = 0;

      if (
        oldPrice > 0 &&
        oldPrice > price
      ) {

        discount =
          Math.round(
            ((oldPrice - price) /
              oldPrice) * 100
          );

      }


      /* CATEGORY */

      let categoryName =
        "Produit JR Shop";

      if (product.category_id) {

        try {

          const {
            data: category
          } = await supabaseClient
            .from("categories")
            .select("name")
            .eq(
              "id",
              product.category_id
            )
            .single();

          if (category?.name) {

            categoryName =
              category.name;

          }

        } catch (categoryError) {

          console.log(
            "Category not loaded"
          );

        }

      }


      box.innerHTML = `

        <section class="product-details">


          <!-- IMAGE -->

          <div class="details-image-box">

            ${
              discount > 0
                ? `
                  <div class="product-badge">
                    -${discount}%
                  </div>
                `
                : ""
            }

            <img
              class="details-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
            >

          </div>


          <!-- INFO -->

          <div class="details-info">


            <div class="details-category">
              ${escapeHtml(categoryName)}
            </div>


            <h1>
              ${escapeHtml(product.name)}
            </h1>


            <!-- PRICE -->

            <div class="details-price">

              <span>
                ${money(price)}
              </span>

              ${
                oldPrice > price
                  ? `
                    <span class="details-old-price">
                      ${money(oldPrice)}
                    </span>

                    <span class="discount-badge">
                      -${discount}%
                    </span>
                  `
                  : ""
              }

            </div>


            <!-- STOCK -->

            <div class="details-stock">

              <span
                class="stock-dot ${
                  stock <= 0 ? "out" : ""
                }"
              ></span>

              ${
                stock > 0
                  ? `Stock disponible : ${stock}`
                  : "Rupture de stock"
              }

            </div>


            <div class="details-divider"></div>


            <!-- DESCRIPTION -->

            <div class="details-description-title">
              Description
            </div>


            <div class="details-description">

              ${
                product.description
                  ? escapeHtml(
                      product.description
                    )
                  : "Aucune description disponible pour ce produit."
              }

            </div>


            ${
              stock > 0
                ? `

                  <!-- QUANTITY -->

                  <div class="quantity-title">
                    Quantité
                  </div>

                  <div class="quantity-box">

                    <button
                      type="button"
                      class="quantity-btn"
                      id="minusBtn"
                    >
                      −
                    </button>

                    <div
                      class="quantity-value"
                      id="quantityValue"
                    >
                      1
                    </div>

                    <button
                      type="button"
                      class="quantity-btn"
                      id="plusBtn"
                    >
                      +
                    </button>

                  </div>

                `
                : ""
            }


            <!-- ADD -->

            <button
              id="detailsAdd"
              class="details-add"
              ${stock <= 0 ? "disabled" : ""}
            >

              ${
                stock > 0
                  ? "🛒 Ajouter au panier"
                  : "Rupture de stock"
              }

            </button>


            <!-- TRUST -->

            <div class="trust-box">

              <div class="trust-item">
                <span>🚚</span>
                Livraison
              </div>

              <div class="trust-item">
                <span>🔒</span>
                Paiement sécurisé
              </div>

              <div class="trust-item">
                <span>✓</span>
                Produit disponible
              </div>

            </div>


          </div>

        </section>

      `;


      /* =========================
         QUANTITY
      ========================= */

      let quantity = 1;


      const quantityValue =
        document.querySelector(
          "#quantityValue"
        );


      const minusBtn =
        document.querySelector(
          "#minusBtn"
        );


      const plusBtn =
        document.querySelector(
          "#plusBtn"
        );


      function updateQuantity() {

        if (quantityValue) {

          quantityValue.textContent =
            quantity;

        }

      }


      if (minusBtn) {

        minusBtn.addEventListener(
          "click",
          () => {

            if (quantity > 1) {

              quantity--;

              updateQuantity();

            }

          }
        );

      }


      if (plusBtn) {

        plusBtn.addEventListener(
          "click",
          () => {

            if (quantity < stock) {

              quantity++;

              updateQuantity();

            } else {

              toast(
                "Stock maximum atteint"
              );

            }

          }
        );

      }


      /* =========================
         ADD BUTTON
      ========================= */

      const addButton =
        document.querySelector(
          "#detailsAdd"
        );


      if (addButton) {

        addButton.addEventListener(
          "click",
          () => {

            addToCart(
              product,
              quantity
            );

          }
        );

      }

    } catch (error) {

      console.error(
        "Product details JavaScript error:",
        error
      );

      box.innerHTML = `
        <div class="loading-details">
          Erreur lors du chargement du produit.
        </div>
      `;

    }

  }


  /* =========================
     START
  ========================= */

  updateCartCount();

  loadProduct();

</script>


</body>

</html>
