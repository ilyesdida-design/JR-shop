<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit — JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #2d2d2d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .product-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .breadcrumbs {
      margin: 10px 0 25px;
      color: #777;
      font-size: 13px;
    }

    .breadcrumbs a {
      color: inherit;
      text-decoration: none;
    }

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(360px, .8fr);
      gap: 45px;
      align-items: start;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 15px;
    }

    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumb {
      width: 90px;
      height: 110px;
      border: 1px solid #ddd;
      background: #f7f7f7;
      padding: 0;
      cursor: pointer;
      overflow: hidden;
    }

    .thumb.active {
      border: 2px solid #111;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .main-image-box {
      background: #f6f6f6;
      width: 100%;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: 100%;
      max-height: 800px;
      object-fit: contain;
      display: block;
    }

    /* INFO */

    .product-info {
      position: sticky;
      top: 20px;
    }

    .product-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 27px;
      font-weight: 500;
      line-height: 1.25;
      margin: 0 0 15px;
    }

    .price-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
    }

    .old-price {
      color: #777;
      text-decoration: line-through;
      font-size: 15px;
    }

    .sale {
      color: #d01345;
      font-size: 14px;
      font-weight: 700;
    }

    .rating {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .rating span {
      letter-spacing: 2px;
    }

    .option-section {
      padding: 22px 0;
      border-bottom: 1px solid #eee;
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .option-header strong {
      font-size: 14px;
    }

    .size-guide-btn {
      border: 0;
      background: transparent;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option {
      min-width: 52px;
      min-height: 44px;
      padding: 10px 15px;
      background: #fff;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 14px;
    }

    .option:hover {
      border-color: #111;
    }

    .option.active {
      border: 2px solid #111;
      background: #111;
      color: #fff;
    }

    .option.disabled {
      opacity: .35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .color-option {
      min-width: 100px;
    }

    .stock {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .stock.ok {
      color: #287a3e;
    }

    .stock.out {
      color: #d01345;
    }

    .quantity {
      display: flex;
      align-items: center;
      margin-top: 20px;
      border: 1px solid #ccc;
      width: fit-content;
    }

    .quantity button {
      width: 44px;
      height: 44px;
      border: 0;
      background: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity input {
      width: 55px;
      height: 44px;
      border: 0;
      text-align: center;
      font-size: 15px;
      outline: none;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: .2s;
    }

    .add-btn {
      background: #018849;
      color: #fff;
    }

    .add-btn:hover {
      background: #006d3a;
    }

    .buy-btn {
      background: #111;
      color: #fff;
    }

    .buy-btn:hover {
      background: #333;
    }

    .action-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .delivery-box {
      margin-top: 22px;
      border: 1px solid #ddd;
    }

    .delivery-row {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 12px;
      font-size: 13px;
    }

    .delivery-row:last-child {
      border-bottom: 0;
    }

    .delivery-row strong {
      display: block;
      margin-bottom: 4px;
    }

    /* DESCRIPTION */

    .details-section {
      margin-top: 70px;
      border-top: 1px solid #ddd;
    }

    .details-block {
      padding: 28px 0;
      border-bottom: 1px solid #ddd;
    }

    .details-block h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    .description {
      color: #555;
      line-height: 1.7;
      white-space: pre-line;
      max-width: 850px;
    }

    .size-table {
      width: 100%;
      max-width: 700px;
      border-collapse: collapse;
    }

    .size-table th,
    .size-table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    .size-table th {
      background: #f5f5f5;
    }

    .loading,
    .error {
      padding: 80px 20px;
      text-align: center;
    }

    .error a {
      display: inline-block;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .product-layout {
        grid-template-columns: 1fr;
      }

      .product-info {
        position: static;
      }

      .main-image-box {
        min-height: 500px;
      }
    }

    @media (max-width: 600px) {
      .product-page {
        padding: 12px;
      }

      .gallery {
        grid-template-columns: 65px minmax(0, 1fr);
      }

      .thumb {
        width: 65px;
        height: 80px;
      }

      .main-image-box {
        min-height: 400px;
      }

      .product-name {
        font-size: 23px;
      }
    }
  </style>

</head>

<body>

  <div class="wrap nav">

  </div>

  </div>

  <div id="productDetails">

  </div>

</main>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="config.js"></script>

<script src="product-details.js"></script>

</body>
</html>
