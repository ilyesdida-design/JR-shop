<!doctype html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Produit - JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       PAGE
    ========================= */

    .details-page {
      padding: 35px 0 80px;
    }


    /* =========================
       BACK
    ========================= */

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }


    /* =========================
       PRODUCT DETAILS
    ========================= */

    .product-details {

      display: grid;

      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(0, 0.95fr);

      gap: 50px;

      background: #fff;

      border-radius: 24px;

      padding: 25px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, .08);

    }


    /* =========================
       GALLERY
    ========================= */

    .details-gallery {
      min-width: 0;
    }


    .main-image-box {

      width: 100%;

      aspect-ratio: 1 / 1;

      background: #f3f3f3;

      border-radius: 20px;

      overflow: hidden;

      position: relative;

    }


    .details-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        opacity .2s ease,
        transform .25s ease;

    }


    .details-image:hover {
      transform: scale(1.01);
    }


    /* =========================
       THUMBNAILS
    ========================= */

    .thumbnails {

      display: flex;

      gap: 12px;

      margin-top: 14px;

      overflow-x: auto;

      padding-bottom: 5px;

    }


    .thumbnail {

      width: 78px;

      height: 78px;

      min-width: 78px;

      padding: 0;

      border: 2px solid transparent;

      border-radius: 12px;

      background: #f3f3f3;

      overflow: hidden;

      cursor: pointer;

      transition: .2s ease;

    }


    .thumbnail:hover {
      transform: translateY(-2px);
    }


    .thumbnail.active {
      border-color: #111;
    }


    .thumbnail img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* =========================
       PRODUCT INFO
    ========================= */

    .details-info {

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 10px 20px;

    }


    .details-info h1 {

      font-size: 38px;

      line-height: 1.2;

      margin: 0 0 18px;

      color: #111;

    }


    .details-price {

      font-size: 30px;

      font-weight: 800;

      color: #111;

      margin: 8px 0 12px;

    }


    .details-old-price {

      color: #999;

      text-decoration: line-through;

      font-size: 20px;

      margin-left: 10px;

      font-weight: 500;

    }


    /* =========================
       STOCK
    ========================= */

    .details-stock {

      margin: 12px 0 25px;

      font-weight: 700;

      font-size: 16px;

    }


    .stock-ok {
      color: #111;
    }


    .stock-out {
      color: #c62828;
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .details-description {

      color: #666;

      line-height: 1.8;

      font-size: 16px;

      margin-bottom: 30px;

      white-space: pre-line;

    }


    /* =========================
       ADD BUTTON
    ========================= */

    .details-add {

      width: 100%;

      max-width: 420px;

      padding: 17px 20px;

      border: 0;

      border-radius: 13px;

      background: #111;

      color: #fff;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .2s ease,
        opacity .2s ease;

    }


    .details-add:hover:not(:disabled) {

      transform: translateY(-2px);

      opacity: .92;

    }


    .details-add:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    /* =========================
       LOADING
    ========================= */

    .loading-details {

      text-align: center;

      padding: 80px 20px;

      font-size: 20px;

    }


    /* =========================
       TOAST
    ========================= */

    .toast {

      position: fixed;

      bottom: 25px;

      left: 50%;

      transform:
        translate(-50%, 20px);

      background: #111;

      color: #fff;

      padding: 13px 22px;

      border-radius: 10px;

      opacity: 0;

      pointer-events: none;

      transition: .25s ease;

      z-index: 9999;

      font-weight: 600;

    }


    .toast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .details-page {

        padding:
          20px 12px
          60px;

      }


      .product-details {

        grid-template-columns: 1fr;

        gap: 25px;

        padding: 12px;

        border-radius: 18px;

      }


      .details-info {

        padding:
          10px 8px
          20px;

      }


      .details-info h1 {

        font-size: 28px;

      }


      .details-price {

        font-size: 25px;

      }


      .details-old-price {

        font-size: 17px;

      }


      .details-description {

        font-size: 15px;

      }


      .details-add {

        max-width: 100%;

      }


      .thumbnail {

        width: 68px;

        height: 68px;

        min-width: 68px;

      }

    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 420px) {

      .details-info h1 {

        font-size: 25px;

      }


      .details-price {

        font-size: 23px;

      }


      .main-image-box {

        border-radius: 15px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <div class="wrap nav">

      <a
        class="logo"
        href="index.html"
      >
        JR <span>Shop</span>
      </a>


      <a
        class="cart-link"
        href="cart.html"
      >
        🛒 Panier

        <b id="cartCount">0</b>

      </a>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="wrap details-page">


    <a
      href="index.html"
      class="back-link"
    >
      ← Retour aux produits
    </a>


    <div id="productDetails">

      <div class="loading-details">

        Chargement du produit...

      </div>

    </div>


  </main>


  <!-- =========================
       TOAST
  ========================= -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- =========================
       CONFIG
  ========================= -->

  <script src="config.js"></script>


  <script>


    /* =========================
       CART
    ========================= */


    function getCart() {

      try {

        return JSON.parse(
          localStorage.getItem("jr_cart") || "[]"
        );

      } catch (error) {

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "jr_cart",
        JSON.stringify(cart)
      );

      updateCartCount();

    }


    function updateCartCount() {

      const cartCount =
        document.querySelector("#cartCount");

      if (!cartCount) return;


      const cart = getCart();


      const count = cart.reduce(
        (total, item) =>
          total + Number(item.qty || 0),
        0
      );


      cartCount.textContent = count;

    }


    /* =========================
       TOAST
    ========================= */


    function toast(message) {

      const box =
        document.querySelector("#toast");


      if (!box) return;


      box.textContent = message;


      box.classList.add("show");


      setTimeout(() => {

        box.classList.remove("show");

      }, 2500);

    }


    /* =========================
       MONEY
    ========================= */


    function money(value) {

      return (

        new Intl.NumberFormat("fr-DZ").format(
          Number(value || 0)
        )

        + " DA"

      );

    }


    /* =========================
       ESCAPE HTML
    ========================= */


    function escapeHtml(value) {

      return String(value ?? "").replace(

        /[&<>"']/g,

        (character) => ({

          "&": "&amp;",

          "<": "&lt;",

          ">": "&gt;",

          '"': "&quot;",

          "'": "&#039;"

        })[character]

      );

    }


    /* =========================
       ADD TO CART
    ========================= */


    function addToCart(product) {

      if (!product) return;


      const stock =
        Number(product.stock || 0);


      if (stock <= 0) {

        toast(
          "Produit en rupture de stock"
        );

        return;

      }


      const cart = getCart();


      const existing =
        cart.find(
          item =>
            String(item.id) ===
            String(product.id)
        );


      if (existing) {

        if (
          Number(existing.qty || 0) >=
          stock
        ) {

          toast(
            "Stock insuffisant"
          );

          return;

        }


        existing.qty++;

      } else {

        cart.push({

          id: product.id,

          name: product.name,

          price:
            Number(product.price || 0),

          image_url:
            product.image_url || "",

          qty: 1,

          stock: stock

        });

      }


      saveCart(cart);


      toast(
        "Produit ajouté au panier"
      );

    }


    /* =========================
       BUILD GALLERY
    ========================= */

    function buildGallery(product) {

      const images = [];


      /* Main image */

      if (product.image_url) {

        images.push(
          product.image_url
        );

      }


      /*
       * Optional image_urls.
       *
       * If Supabase already returns
       * an array, we use it.
       */

      if (
        Array.isArray(
          product.image_urls
        )
      ) {

        product.image_urls.forEach(
          (image) => {

            if (
              image &&
              !images.includes(image)
            ) {

              images.push(image);

            }

          }
        );

      }


      /*
       * Optional images field.
       *
       * Supports:
       * - array
       * - JSON string
       */

      if (product.images) {

        let extraImages =
          product.images;


        if (
          typeof extraImages ===
          "string"
        ) {

          try {

            extraImages =
              JSON.parse(extraImages);

          } catch (error) {

            extraImages = [];

          }

        }


        if (
          Array.isArray(extraImages)
        ) {

          extraImages.forEach(
            (image) => {

              let url = image;


              if (
                typeof image ===
                "object" &&
                image !== null
              ) {

                url =
                  image.url ||
                  image.image_url ||
                  "";

              }


              if (
                url &&
                !images.includes(url)
              ) {

                images.push(url);

              }

            }
          );

        }

      }


      /*
       * Fallback
       */

      if (!images.length) {

        images.push(
          "https://placehold.co/800x800?text=JR+Shop"
        );

      }


      return images;

    }


    /* =========================
       CHANGE MAIN IMAGE
    ========================= */

    function changeMainImage(
      image,
      button
    ) {

      const mainImage =
        document.querySelector(
          "#mainProductImage"
        );


      if (!mainImage) return;


      mainImage.style.opacity = "0";


      setTimeout(() => {

        mainImage.src = image;

        mainImage.style.opacity = "1";

      }, 120);


      document
        .querySelectorAll(".thumbnail")
        .forEach((item) => {

          item.classList.remove(
            "active"
          );

        });


      if (button) {

        button.classList.add(
          "active"
        );

      }

    }


    /* =========================
       LOAD PRODUCT
    ========================= */

    async function loadProduct() {

      const box =
        document.querySelector(
          "#productDetails"
        );


      if (!box) return;


      const params =
        new URLSearchParams(
          window.location.search
        );


      const productId =
        params.get("id");


      if (!productId) {

        box.innerHTML = `

          <div class="loading-details">

            Produit introuvable.

          </div>

        `;

        return;

      }


      try {


        const { data, error } =
          await supabaseClient

            .from("products")

            .select("*")

            .eq("id", productId)

            .eq("is_active", true)

            .single();


        if (error || !data) {

          console.error(
            "Product details error:",
            error
          );


          box.innerHTML = `

            <div class="loading-details">

              Produit introuvable.

            </div>

          `;

          return;

        }


        const product = data;


        /* =========================
           PRODUCT DATA
        ========================= */


        const images =
          buildGallery(product);


        const stock =
          Number(product.stock || 0);


        const oldPrice =
          Number(
            product.old_price || 0
          );


        const description =
          product.description ||
          "";


        const firstImage =
          images[0];


        /* =========================
           GALLERY HTML
        ========================= */


        const thumbnails =
          images.length > 1

            ? `

              <div
                class="thumbnails"
                id="thumbnails"
              >

                ${images
                  .map(
                    (image, index) => `

                      <button
                        type="button"
                        class="thumbnail ${
                          index === 0
                            ? "active"
                            : ""
                        }"
                        data-image="${escapeHtml(
                          image
                        )}"
                      >

                        <img
                          src="${escapeHtml(
                            image
                          )}"
                          alt="${escapeHtml(
                            product.name
                          )} - image ${
                            index + 1
                          }"
                          loading="lazy"
                        >

                      </button>

                    `
                  )
                  .join("")}

              </div>

            `

            : "";


        /* =========================
           PAGE
        ========================= */


        box.innerHTML = `

          <section class="product-details">


            <!-- =====================
                 GALLERY
            ====================== -->

            <div class="details-gallery">


              <div class="main-image-box">

                <img
                  id="mainProductImage"
                  class="details-image"
                  src="${escapeHtml(
                    firstImage
                  )}"
                  alt="${escapeHtml(
                    product.name
                  )}"
                >

              </div>


              ${thumbnails}


            </div>


            <!-- =====================
                 INFORMATION
            ====================== -->

            <div class="details-info">


              <h1>

                ${escapeHtml(
                  product.name
                )}

              </h1>


              <div class="details-price">

                ${money(
                  product.price
                )}

                ${
                  oldPrice > 0
                    ? `

                      <span
                        class="details-old-price"
                      >

                        ${money(
                          oldPrice
                        )}

                      </span>

                    `
                    : ""
                }

              </div>


              <div
                class="details-stock ${
                  stock > 0
                    ? "stock-ok"
                    : "stock-out"
                }"
              >

                ${
                  stock > 0
                    ? `Stock disponible : ${stock}`
                    : "Rupture de stock"
                }

              </div>


              ${
                description

                  ? `

                    <div
                      class="details-description"
                    >

                      ${escapeHtml(
                        description
                      )}

                    </div>

                  `

                  : `

                    <div
                      class="details-description"
                    >

                      Aucune description
                      disponible pour ce produit.

                    </div>

                  `
              }


              <button
                id="detailsAdd"
                class="details-add"
                ${
                  stock <= 0
                    ? "disabled"
                    : ""
                }
              >

                ${
                  stock > 0
                    ? "Ajouter au panier"
                    : "Rupture de stock"
                }

              </button>


            </div>


          </section>

        `;


        /* =========================
           THUMBNAIL EVENTS
        ========================= */


        document
          .querySelectorAll(".thumbnail")
          .forEach((button) => {

            button.addEventListener(
              "click",
              () => {

                const image =
                  button.dataset.image;


                changeMainImage(
                  image,
                  button
                );

              }
            );

          });


        /* =========================
           ADD BUTTON
        ========================= */


        const addButton =
          document.querySelector(
            "#detailsAdd"
          );


        if (addButton) {

          addButton.addEventListener(
            "click",
            () => {

              addToCart(product);

            }
          );

        }


      } catch (error) {

        console.error(
          "Product details JavaScript error:",
          error
        );


        box.innerHTML = `

          <div class="loading-details">

            Erreur lors du chargement
            du produit.

          </div>

        `;

      }

    }


    /* =========================
       START
    ========================= */


    updateCartCount();

    loadProduct();


  </script>


</body>

</html>
