<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit - JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       PRODUCT DETAILS
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .details-page {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .product-details-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: start;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery {
      width: 100%;
    }

    .main-image-box {
      width: 100%;
      height: 500px;
      background: #f5f5f5;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnail {
      width: 78px;
      height: 78px;
      min-width: 78px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #f3f3f3;
      cursor: pointer;
      padding: 0;
    }

    .thumbnail.active {
      border-color: #111;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================
       INFO
    ========================= */

    .product-info {
      padding: 5px 0;
    }

    .product-category {
      display: inline-block;
      padding: 7px 12px;
      background: #f0f0f0;
      color: #555;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .product-title {
      font-size: 32px;
      line-height: 1.2;
      margin: 0 0 15px;
      font-weight: 700;
    }

    .product-price {
      font-size: 28px;
      font-weight: 700;
      margin: 15px 0 20px;
    }

    .product-description {
      color: #666;
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-line;
      margin-bottom: 25px;
    }

    .product-stock {
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .stock-ok {
      color: #159447;
    }

    .stock-empty {
      color: #d92d20;
    }

    /* =========================
       QUANTITY
    ========================= */

    .quantity-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .quantity-box {
      display: inline-flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .quantity-btn {
      width: 42px;
      height: 42px;
      border: 0;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity-input {
      width: 55px;
      height: 42px;
      border: 0;
      text-align: center;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    /* =========================
       CART
    ========================= */

    .add-cart-btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;

      font-size: 16px;

      transition: 0.2s;

      opacity: 0.88;

    /* =========================
       LOADING / ERROR
    ========================= */

    .state-box {
      background: #fff;
      border-radius: 18px;
      padding: 50px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .loading {

    .error-box {
      color: #b42318;

    .error-box h2 {
      margin-top: 0;
    }

    .error-details {
      margin-top: 15px;

      background: #fff3f2;
      border-radius: 10px;
      text-align: left;
      word-break: break-word;
      font-size: 14px;
      color: #7a271a;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 11px 18px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

      .details-page {
        padding: 15px 12px 35px;
      }

      .product-details-card {
        padding: 14px;
        border-radius: 14px;
      }

      .product-layout {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .main-image-box {
        height: 390px;
      }

      .product-title {
        font-size: 25px;
      }

      .product-price {
        font-size: 24px;
      }
    }

    @media (max-width: 480px) {

      .main-image-box {
        height: 330px;
      }

      .product-title {
        font-size: 22px;
      }

      .product-description {
        font-size: 15px;
      }

      .thumbnail {
        width: 65px;
        height: 65px;
        min-width: 65px;
      }
    }
  </style>
</head>

<body>

  <main class="details-page">

    <a href="index.html" class="back-btn">
      ← Retour
    </a>

    <div id="loadingState" class="state-box">
      <div class="loading">
        Chargement du produit...
      </div>
    </div>

    <div id="errorState" class="state-box error-box" style="display:none;">
      <h2>Impossible de charger le produit</h2>

      <p id="errorMessage">
        Une erreur est survenue.
      </p>

      <div id="errorDetails" class="error-details" style="display:none;"></div>

      <button class="retry-btn" onclick="loadProduct()">
        Réessayer
      </button>
    </div>

    <section id="productCard" class="product-details-card" style="display:none;">

      <div class="product-layout">

        <!-- =========================
             GALLERY
        ========================= -->

        <div class="gallery">

          <div class="main-image-box">
            <img
              id="mainImage"
              class="main-image"
              src=""
              alt="Produit"
            >
          </div>

          <div id="thumbnails" class="thumbnails"></div>

        </div>

        <!-- =========================
             PRODUCT INFO
        ========================= -->

        <div class="product-info">

          <div
            id="productCategory"
            class="product-category"
            style="display:none;"
          ></div>

          <h1
            id="productTitle"
            class="product-title"
          ></h1>

          <div
            id="productPrice"
            class="product-price"
          ></div>

          <div
            id="productDescription"
            class="product-description"
          ></div>

          <div
            id="productStock"
            class="product-stock"
          ></div>

          <div class="quantity-title">
            Quantité
          </div>

          <div class="quantity-box">

            <button
              type="button"
              class="quantity-btn"
              onclick="changeQuantity(-1)"
            >
              −
            </button>

            <input
              id="quantityInput"
              class="quantity-input"
              type="number"
              min="1"
              value="1"
            >

            <button
              type="button"
              class="quantity-btn"
              onclick="changeQuantity(1)"
            >
              +
            </button>

          </div>

          <button
            id="addCartBtn"
            class="add-cart-btn"
            onclick="addToCart()"
          >
            Ajouter au panier
          </button>

          <div
            id="cartMessage"
            class="cart-info"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- TON CONFIG -->
  <script src="config.js"></script>


  <script>

    /* =====================================================
       JR SHOP - PRODUCT DETAILS
    ===================================================== */

    let currentProduct = null;

    let productImages = [];

    let currentImageIndex = 0;


    /* =====================================================
       GET PRODUCT ID
    ===================================================== */

    function getProductId() {

      const params = new URLSearchParams(window.location.search);

      return params.get("id");

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       PRICE FORMAT
    ===================================================== */

    function formatPrice(value) {

      if (value === null || value === undefined || value === "") {
        return "";
      }

      const number = Number(value);

      if (Number.isNaN(number)) {
        return escapeHtml(value);
      }

      return number.toLocaleString("fr-FR") + " DA";

    }


    /* =====================================================
       PARSE IMAGE FIELD
    ===================================================== */

    function parseImages(value) {

      if (!value) {
        return [];
      }

      if (Array.isArray(value)) {
        return value;
      }

      if (typeof value === "string") {

        const text = value.trim();

        if (!text) {
          return [];
        }

        /*
          Try JSON first.
          Example:
          ["image1.jpg","image2.jpg"]
        */

        try {

          const parsed = JSON.parse(text);

          if (Array.isArray(parsed)) {
            return parsed;
          }

        } catch (error) {
          /* Not JSON - continue */
        }


        /*
          Support comma-separated URLs.
        */

        if (text.includes(",")) {

          return text
            .split(",")
            .map(item => item.trim())
            .filter(Boolean);

        }


        /*
          Support newline-separated URLs.
        */

        if (text.includes("\n")) {

          return text
            .split("\n")
            .map(item => item.trim())
            .filter(Boolean);

        }


        return [text];

      }

      return [];

    }


    /* =====================================================
       GET ALL PRODUCT IMAGES
    ===================================================== */

    function getProductImages(product) {

      let images = [];


      /*
        1. image_urls
      */

      images = images.concat(
        parseImages(product.image_urls)
      );


      /*
        2. images
      */

      images = images.concat(
        parseImages(product.images)
      );


      /*
        3. gallery
      */

      images = images.concat(
        parseImages(product.gallery)
      );


      /*
        4. image_url
      */

      if (product.image_url) {

        images.push(product.image_url);

      }


      /*
        Remove empty values + duplicates.
      */

      images = images
        .filter(Boolean)
        .map(image => String(image).trim())
        .filter(Boolean);

      images = [...new Set(images)];


      return images;

    }


    /* =====================================================
       SHOW ERROR
    ===================================================== */

    function showError(message, details = "") {

      document.getElementById("loadingState").style.display = "none";

      document.getElementById("productCard").style.display = "none";

      document.getElementById("errorState").style.display = "block";

      document.getElementById("errorMessage").textContent = message;


      const detailsBox =
        document.getElementById("errorDetails");


      if (details) {

        detailsBox.style.display = "block";

        detailsBox.textContent = details;

      } else {

        detailsBox.style.display = "none";

      }

    }


    /* =====================================================
       SHOW PRODUCT
    ===================================================== */

    function showProduct(product) {

      currentProduct = product;


      /* =========================
         TITLE
      ========================= */

      const title =
        product.name ||
        product.title ||
        product.product_name ||
        "Produit";


      document.getElementById("productTitle")
        .textContent = title;


      /* =========================
         PRICE
      ========================= */

      const price =
        product.price ??
        product.sale_price ??
        product.product_price;


      document.getElementById("productPrice")
        .textContent = formatPrice(price);


      /* =========================
         DESCRIPTION
      ========================= */

      const description =
        product.description ||
        product.details ||
        product.content ||
        "";


      const descriptionElement =
        document.getElementById("productDescription");


      if (description) {

        descriptionElement.textContent =
          description;

      } else {

        descriptionElement.textContent =
          "Aucune description disponible.";

      }


      /* =========================
         CATEGORY
      ========================= */

      const category =
        product.category ||
        product.category_name ||
        product.category_title ||
        product.categories?.name ||
        product.categories?.title ||
        "";


      const categoryElement =
        document.getElementById("productCategory");


      if (category) {

        categoryElement.style.display = "inline-block";

        categoryElement.textContent = category;

      } else {

        categoryElement.style.display = "none";

      }


      /* =========================
         STOCK
      ========================= */

      const stock =
        product.stock ??
        product.quantity ??
        product.inventory;


      const stockElement =
        document.getElementById("productStock");


      if (
        stock !== null &&
        stock !== undefined &&
        stock !== ""
      ) {

        const stockNumber = Number(stock);


        if (
          !Number.isNaN(stockNumber) &&
          stockNumber <= 0
        ) {

          stockElement.className =
            "product-stock stock-empty";

          stockElement.textContent =
            "Produit en rupture de stock";

          document.getElementById("addCartBtn")
            .disabled = true;

        } else {

          stockElement.className =
            "product-stock stock-ok";

          stockElement.textContent =
            "En stock";

        }

      } else {

        /*
          If there is no stock field,
          don't block Add to Cart.
        */

        stockElement.textContent = "";

      }


      /* =========================
         IMAGES
      ========================= */

      productImages =
        getProductImages(product);


      if (productImages.length === 0) {

        /*
          No fake 01.jpg / 02.jpg / 03.jpg.
          We only use the actual product image.
        */

        productImages = [
          "https://via.placeholder.com/800x800?text=JR+Shop"
        ];

      }


      currentImageIndex = 0;

      renderGallery();


      /* =========================
         DISPLAY
      ========================= */

      document.getElementById("loadingState")
        .style.display = "none";

      document.getElementById("errorState")
        .style.display = "none";

      document.getElementById("productCard")
        .style.display = "block";

    }


    /* =====================================================
       RENDER GALLERY
    ===================================================== */

    function renderGallery() {

      const mainImage =
        document.getElementById("mainImage");


      const thumbnails =
        document.getElementById("thumbnails");


      if (!productImages.length) {
        return;
      }


      mainImage.src =
        productImages[currentImageIndex];


      mainImage.alt =
        currentProduct?.name ||
        currentProduct?.title ||
        "Produit";


      thumbnails.innerHTML = "";


      productImages.forEach((image, index) => {

        const button =
          document.createElement("button");


        button.type = "button";

        button.className =
          "thumbnail" +
          (
            index === currentImageIndex
              ? " active"
              : ""
          );


        button.onclick = function () {

          currentImageIndex = index;

          renderGallery();

        };


        const img =
          document.createElement("img");


        img.src = image;

        img.alt =
          "Image " + (index + 1);


        img.onerror = function () {

          this.style.display = "none";

        };


        button.appendChild(img);

        thumbnails.appendChild(button);

      });

    }


    /* =====================================================
       QUANTITY
    ===================================================== */

    function changeQuantity(amount) {

      const input =
        document.getElementById("quantityInput");


      let quantity =
        parseInt(input.value, 10) || 1;


      quantity += amount;


      if (quantity < 1) {
        quantity = 1;
      }


      /*
        Respect stock if available.
      */

      if (currentProduct) {

        const stock =
          currentProduct.stock ??
          currentProduct.quantity ??
          currentProduct.inventory;


        if (
          stock !== null &&
          stock !== undefined &&
          stock !== ""
        ) {

          const stockNumber =
            Number(stock);


          if (
            !Number.isNaN(stockNumber) &&
            stockNumber > 0 &&
            quantity > stockNumber
          ) {

            quantity = stockNumber;

          }

        }

      }


      input.value = quantity;

    }


    /* =====================================================
       CART HELPERS
    ===================================================== */

    function getCart() {

      try {

        const saved =
          localStorage.getItem("jr_cart");

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        console.error(
          "Cart read error:",
          error
        );

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "jr_cart",
        JSON.stringify(cart)
      );

    }


    /* =====================================================
       ADD TO CART
    ===================================================== */

    function addToCart() {

      if (!currentProduct) {
        return;
      }


      const input =
        document.getElementById("quantityInput");


      let quantity =
        parseInt(input.value, 10) || 1;


      if (quantity < 1) {
        quantity = 1;
      }


      const stock =
        currentProduct.stock ??
        currentProduct.quantity ??
        currentProduct.inventory;


      if (
        stock !== null &&
        stock !== undefined &&
        stock !== ""
      ) {

        const stockNumber =
          Number(stock);


        if (
          !Number.isNaN(stockNumber) &&
          stockNumber <= 0
        ) {

          showCartMessage(
            "Ce produit est en rupture de stock."
          );

          return;

        }


        if (
          !Number.isNaN(stockNumber) &&
          quantity > stockNumber
        ) {

          quantity = stockNumber;

          input.value = quantity;

        }

      }


      const productId =
        currentProduct.id;


      if (!productId) {

        showCartMessage(
          "Impossible d'ajouter ce produit : ID manquant."
        );

        return;

      }


      const cart =
        getCart();


      const existingIndex =
        cart.findIndex(item =>
          String(item.id) ===
          String(productId)
        );


      /*
        Keep the product information
        needed by the cart.
      */

      const cartProduct = {

        id: currentProduct.id,

        name:
          currentProduct.name ||
          currentProduct.title ||
          currentProduct.product_name ||
          "Produit",

        title:
          currentProduct.title ||
          currentProduct.name ||
          currentProduct.product_name ||
          "Produit",

        price:
          currentProduct.price ??
          currentProduct.sale_price ??
          currentProduct.product_price ??
          0,

        image_url:
          currentProduct.image_url ||
          productImages[0] ||
          "",

        image_urls:
          currentProduct.image_urls ||
          productImages,

        quantity: quantity

      };


      if (existingIndex !== -1) {

        cart[existingIndex].quantity =
          (
            Number(cart[existingIndex].quantity) ||
            0
          ) + quantity;

      } else {

        cart.push(cartProduct);

      }


      saveCart(cart);


      updateCartCount();


      showCartMessage(
        "Produit ajouté au panier ✓"
      );

    }


    /* =====================================================
       CART MESSAGE
    ===================================================== */

    function showCartMessage(message) {

      const element =
        document.getElementById("cartMessage");


      element.textContent = message;


      setTimeout(() => {

        if (
          element.textContent === message
        ) {

          element.textContent = "";

        }

      }, 3000);

    }


    /* =====================================================
       CART COUNT
    ===================================================== */

    function updateCartCount() {

      const cart =
        getCart();


      const count =
        cart.reduce(
          (total, item) =>
            total +
            (Number(item.quantity) || 0),
          0
        );


      /*
        Support several possible
        cart count IDs from the shop.
      */

      const ids = [

        "cartCount",

        "cart-count",

        "cartCounter",

        "cart-count-badge"

      ];


      ids.forEach(id => {

        const element =
          document.getElementById(id);


        if (element) {

          element.textContent = count;

          element.style.display =
            count > 0
              ? ""
              : "none";

        }

      });


      /*
        Also update elements using
        the data-cart-count attribute.
      */

      document
        .querySelectorAll("[data-cart-count]")
        .forEach(element => {

          element.textContent = count;

        });

    }


    /* =====================================================
       LOAD PRODUCT
    ===================================================== */

    async function loadProduct() {

      /*
        Reset UI.
      */

      document.getElementById("loadingState")
        .style.display = "block";

      document.getElementById("errorState")
        .style.display = "none";

      document.getElementById("productCard")
        .style.display = "none";


      /*
        Check Supabase client.
      */

      if (
        typeof supabaseClient === "undefined" ||
        !supabaseClient
      ) {

        showError(
          "Supabase n'est pas disponible.",
          "Vérifie que config.js est bien chargé avant ce script et que supabaseClient est correctement créé."
        );

        return;

      }


      /*
        Get ID from URL.
      */

      const productId =
        getProductId();


      if (!productId) {

        showError(
          "ID du produit manquant.",
          "L'URL doit contenir l'ID du produit, par exemple : product-details.html?id=123"
        );

        return;

      }


      console.log(
        "JR Shop - Product ID:",
        productId
      );


      try {

        /*
          IMPORTANT:
          We DO NOT use:
          .eq("is_active", true)

          The product is searched directly
          by its ID.
        */

        const result =
          await supabaseClient
            .from("products")
            .select("*")
            .eq("id", productId)
            .maybeSingle();


        const data = result.data;

        const error = result.error;


        /*
          Real Supabase error.
        */

        if (error) {

          console.error(
            "Supabase product error:",
            error
          );


          showError(
            "Erreur lors du chargement du produit.",
            JSON.stringify(
              error,
              null,
              2
            )
          );

          return;

        }


        /*
          Product not found.
        */

        if (!data) {

          showError(
            "Produit introuvable.",
            "Aucun produit ne correspond à l'ID : " +
            productId
          );

          return;

        }


        console.log(
          "JR Shop - Product loaded:",
          data
        );


        showProduct(data);

      } catch (error) {

        console.error(
          "Unexpected product error:",
          error
        );


        showError(
          "Une erreur inattendue est survenue.",
          error?.message ||
          String(error)
        );

      }

    }


    /* =====================================================
       START
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        updateCartCount();

        loadProduct();

      }
    );


    /*
      Update cart count if another
      page/tab changes localStorage.
    */

    window.addEventListener(
      "storage",
      function (event) {

        if (
          event.key === "jr_cart"
        ) {

          updateCartCount();

        }

      }
    );
