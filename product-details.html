<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produit — JR Shop</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .product-details {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 40px;
      margin: 35px 0 60px;
    }

    .product-gallery,
    .product-info {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .product-main-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 14px;
      background: #f7f7f7;
    }

    .product-info h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .product-price {
      font-size: 28px;
      font-weight: 800;
      margin: 18px 0;
    }

    .product-old-price {
      color: #999;
      text-decoration: line-through;
      margin-left: 10px;
      font-size: 18px;
    }

    .product-stock {
      display: inline-block;
      margin: 10px 0 20px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f1f1f1;
      font-size: 14px;
    }

    .product-description {
      line-height: 1.8;
      color: #555;
      white-space: pre-line;
      margin: 20px 0;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .quantity-box button {
      width: 42px;
      height: 42px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity-box input {
      width: 60px;
      height: 42px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .buy-actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
    }

    .loading-box {
      text-align: center;
      padding: 60px 20px;
    }

    @media (max-width: 800px) {
      .product-details {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .product-info h1 {
        font-size: 26px;
      }
    }
  </style>

</head>

<body>

<header class="site-header">
  <div class="wrap nav">

```
<a class="logo" href="index.html">
  JR <span>Shop</span>
</a>

<a class="cart-link" href="cart.html">
  🛒 Panier
  <b id="cartCount">0</b>
</a>
```

  </div>
</header>

<main class="wrap">

  <div id="productContainer">

```
<div class="card loading-box">
  <h2>Chargement du produit...</h2>
  <p>Veuillez patienter.</p>
</div>
```

  </div>

</main>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="config.js"></script>

<script src="product-details.js"></script>

</body>
</html>
