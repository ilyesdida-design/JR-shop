<!doctype html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Panier — JR Shop</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="site-header">

  <div class="wrap nav">

```
<a
  class="logo"
  href="index.html"
>
  JR <span>Shop</span>
</a>


<a
  class="cart-link"
  href="cart.html"
>

  🛒 Panier

  <b id="cartCount">0</b>

</a>
```

  </div>

</header>

<!-- =========================
     MAIN
========================= -->

<main class="wrap">

  <section class="hero">

```
<h1>
  Votre panier
</h1>

<p>
  Vérifiez vos produits avant de confirmer votre commande.
</p>
```

  </section>

  <!-- CART -->

  <section>

```
<div id="cart">

  <div class="card empty">

    <h2>
      Chargement...
    </h2>

  </div>

</div>
```

  </section>

  <!-- =========================
       CHECKOUT
  ========================= -->

  <section
    id="checkout"
    class="checkout card"
    hidden
  >

```
<h2>
  Passer la commande
</h2>


<p>
  Remplissez vos informations de livraison.
</p>


<form id="orderForm">


  <!-- NAME -->

  <input
    type="text"
    name="customer_name"
    placeholder="Nom et prénom"
    required
  >


  <!-- PHONE -->

  <input
    type="tel"
    name="phone"
    placeholder="Téléphone"
    required
  >


  <!-- ADDRESS -->

  <textarea
    name="address"
    placeholder="Adresse de livraison"
    required
  ></textarea>


  <!-- NOTE -->

  <textarea
    name="note"
    placeholder="Note (facultatif)"
  ></textarea>


  <!-- SUBMIT -->

  <button
    class="btn primary"
    type="submit"
  >
    Confirmer la commande
  </button>


</form>
```

  </section>

</main>

<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast"
></div>

<!-- =========================
     SUPABASE
========================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<!-- =========================
     CONFIG
========================= -->

<script src="config.js"></script>

<!-- =========================
     CART JS
========================= -->

<script src="cart.js"></script>

</body>

</html>
