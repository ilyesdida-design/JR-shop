<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:,">

<title>Panier - JR Shop</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f6f4;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px 70px;
}

/* HEADER */

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:30px;
}

.page-title{
  margin:0;
  font-size:32px;
}

.back-link{
  color:#111;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

.back-link:hover{
  text-decoration:underline;
}

/* EMPTY */

.empty-cart{
  background:#fff;
  border-radius:20px;
  padding:70px 25px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:55px;
  margin-bottom:20px;
}

.empty-cart h2{
  margin:0 0 10px;
  font-size:24px;
}

.empty-cart p{
  margin:0 0 25px;
  color:#777;
}

.shop-btn{
  display:inline-block;
  background:#111;
  color:#fff;
  text-decoration:none;
  padding:14px 25px;
  border-radius:10px;
  font-weight:700;
}

/* CART */

.cart-layout{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:25px;
  align-items:start;
}

.cart-items{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.cart-item{
  background:#fff;
  border-radius:18px;
  padding:18px;
  display:grid;
  grid-template-columns:110px 1fr auto;
  gap:18px;
  align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.product-image{
  width:110px;
  height:110px;
  border-radius:14px;
  object-fit:cover;
  background:#f3f3f1;
}

.product-info{
  min-width:0;
}

.product-name{
  margin:0 0 8px;
  font-size:18px;
  font-weight:700;
}

.variant-info{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}

.variant-tag{
  background:#f4f4f2;
  border-radius:7px;
  padding:5px 9px;
  color:#666;
  font-size:12px;
}

.unit-price{
  color:#555;
  font-size:14px;
}

.item-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:12px;
}

.item-total{
  font-size:18px;
  font-weight:700;
}

.quantity-control{
  display:flex;
  align-items:center;
  border:1px solid #ddd;
  border-radius:9px;
  overflow:hidden;
}

.quantity-control button{
  width:35px;
  height:35px;
  border:0;
  background:#f6f6f6;
  cursor:pointer;
  font-size:18px;
}

.quantity-control button:hover{
  background:#eaeaea;
}

.quantity-control span{
  width:40px;
  text-align:center;
  font-size:14px;
  font-weight:600;
}

.remove-btn{
  border:0;
  background:transparent;
  color:#c62828;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}

.remove-btn:hover{
  text-decoration:underline;
}

/* SUMMARY */

.summary{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
  position:sticky;
  top:20px;
}

.summary h2{
  margin:0 0 22px;
  font-size:21px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  color:#666;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:18px;
  color:#111;
  font-size:20px;
  font-weight:700;
}

.checkout-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:16px;
  border-radius:10px;
  margin-top:22px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.checkout-btn:hover{
  background:#292929;
}

.clear-btn{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#555;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.clear-btn:hover{
  background:#f5f5f5;
}

/* RESPONSIVE */

@media(max-width:850px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }
}

@media(max-width:600px){

  .container{
    padding:25px 14px 50px;
  }

  .page-title{
    font-size:26px;
  }

  .cart-item{
    grid-template-columns:80px 1fr;
    gap:14px;
    padding:14px;
  }

  .product-image{
    width:80px;
    height:80px;
  }

  .item-actions{
    grid-column:1 / -1;
    flex-direction:row;
    justify-content:space-between;
    align-items:center;
    width:100%;
    border-top:1px solid #eee;
    padding-top:12px;
  }

  .item-total{
    font-size:16px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="page-header">

```
<a href="index.html" class="back-link">
  ← Retour aux produits
</a>

<h1 class="page-title">
  Mon panier
</h1>
```

  </div>

  <!-- PANIER VIDE -->

  <div id="emptyCart" class="empty-cart" style="display:none;">

```
<div class="empty-icon">
  🛒
</div>

<h2>
  Votre panier est vide
</h2>

<p>
  Ajoutez des produits pour commencer votre commande.

<a href="index.html" class="shop-btn">

  </div>

  <!-- PANIER -->

  <div id="cartContent" class="cart-layout" style="display:none;">

```
<div id="cartItems" class="cart-items"></div>


<!-- SUMMARY -->

<aside class="summary">

  <h2>
    Résumé de la commande
  </h2>

  <div class="summary-row">
    <span>Articles</span>
    <span id="summaryQuantity">0</span>
  </div>

  <div class="summary-row">
    <span>Sous-total</span>
    <span id="summarySubtotal">0.00 DA</span>
  </div>

  <div class="summary-row">
    <span>Livraison</span>
    <span>À confirmer</span>
  </div>

  <div class="summary-row total">
    <span>Total</span>
    <span id="summaryTotal">0.00 DA</span>
  </div>

  <button
    type="button"
    id="checkoutBtn"
    class="checkout-btn"
  >
    Passer la commande
  </button>

  <button
    type="button"
    id="clearCartBtn"
    class="clear-btn"
  >
    Vider le panier
  </button>

</aside>
```

  </div>

</div>

<script>

/* =====================================================
   PANIER JR SHOP
===================================================== */

/*
  IMPORTANT:

  Le panier utilise cette clé :

  jr_cart

  Ton bouton "Ajouter au panier" dans
  product-details.html doit également utiliser
  cette même clé.
*/


const CART_KEY = "jr_cart";


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(value){

  const number = Number(value) || 0;

  return number.toLocaleString("fr-FR", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + " DA";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   GET CART
===================================================== */

function getCart(){

  try{

    const saved =
      localStorage.getItem(CART_KEY);

    if(!saved){
      return [];
    }

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  }catch(error){

    console.error(
      "Erreur panier:",
      error
    );

    return [];
  }
}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart(){

  const cart =
    getCart();

  const emptyCart =
    document.getElementById("emptyCart");

  const cartContent =
    document.getElementById("cartContent");

  const cartItems =
    document.getElementById("cartItems");


  /* PANIER VIDE */

  if(cart.length === 0){

    emptyCart.style.display =
      "block";

    cartContent.style.display =
      "none";

    return;
  }


  /* PANIER AVEC PRODUITS */

  emptyCart.style.display =
    "none";

  cartContent.style.display =
    "grid";


  cartItems.innerHTML = "";


  let subtotal = 0;

  let totalQuantity = 0;


  cart.forEach(
    function(item,index){

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 1;

      const total =
        price * quantity;

      subtotal += total;

      totalQuantity += quantity;


      const color =
        item.color ||
        "";

      const size =
        item.size ||
        "";

      const image =
        item.image_url ||
        "https://via.placeholder.com/500x500?text=JR+Shop";


      const variantHtml = `

        ${
          color
          ? `<span class="variant-tag">
               Couleur : ${escapeHtml(color)}
             </span>`
          : ""
        }

        ${
          size
          ? `<span class="variant-tag">
               Taille : ${escapeHtml(size)}
             </span>`
          : ""
        }

      `;


      const article =
        document.createElement("article");

      article.className =
        "cart-item";


      article.innerHTML = `

        <img
          class="product-image"
          src="${escapeHtml(image)}"
          alt="${escapeHtml(item.name || "Produit")}"
          onerror="this.src='https://via.placeholder.com/500x500?text=JR+Shop'"
        >


        <div class="product-info">

          <h3 class="product-name">
            ${escapeHtml(item.name || "Produit")}
          </h3>


          <div class="variant-info">

            ${variantHtml}

          </div>


          <div class="unit-price">
            ${formatPrice(price)} / unité
          </div>

        </div>


        <div class="item-actions">

          <div class="item-total">
            ${formatPrice(total)}
          </div>


          <div class="quantity-control">

            <button
              type="button"
              data-action="minus"
              data-index="${index}"
            >
              −
            </button>


            <span>
              ${quantity}
            </span>


            <button
              type="button"
              data-action="plus"
              data-index="${index}"
            >
              +
            </button>

          </div>


          <button
            type="button"
            class="remove-btn"
            data-action="remove"
            data-index="${index}"
          >
            Supprimer
          </button>

        </div>

      `;


      cartItems.appendChild(article);

    }
  );


  /* SUMMARY */

  document.getElementById(
    "summaryQuantity"
  ).textContent =
    totalQuantity;


  document.getElementById(
    "summarySubtotal"
  ).textContent =
    formatPrice(subtotal);


  document.getElementById(
    "summaryTotal"
  ).textContent =
    formatPrice(subtotal);

}


/* =====================================================
   CART ACTIONS
===================================================== */

document.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        "[data-action]"
      );

    if(!button){
      return;
    }


    const action =
      button.dataset.action;

    const index =
      Number(button.dataset.index);


    const cart =
      getCart();


    if(!cart[index]){
      return;
    }


    /* PLUS */

    if(action === "plus"){

      const currentStock =
        Number(cart[index].stock);


      if(
        Number.isFinite(currentStock) &&
        currentStock > 0 &&
        cart[index].quantity >= currentStock
      ){

        alert(
          "La quantité maximale disponible est " +
          currentStock + "."
        );

        return;
      }


      cart[index].quantity =
        Number(cart[index].quantity || 1) + 1;


      saveCart(cart);

      renderCart();

      return;
    }


    /* MINUS */

    if(action === "minus"){

      cart[index].quantity =
        Number(cart[index].quantity || 1) - 1;


      if(cart[index].quantity <= 0){

        cart.splice(index,1);

      }


      saveCart(cart);

      renderCart();

      return;
    }


    /* REMOVE */

    if(action === "remove"){

      cart.splice(index,1);

      saveCart(cart);

      renderCart();

    }

  }
);


/* =====================================================
   CLEAR CART
===================================================== */

document.getElementById(
  "clearCartBtn"
).addEventListener(
  "click",
  function(){

    const cart =
      getCart();

    if(cart.length === 0){
      return;
    }


    const confirmed =
      confirm(
        "Voulez-vous vraiment vider votre panier ?"
      );


    if(!confirmed){
      return;
    }


    localStorage.removeItem(
      CART_KEY
    );


    renderCart();

  }
);


/* =====================================================
   CHECKOUT
===================================================== */

document.getElementById(
  "checkoutBtn"
).addEventListener(
  "click",
  function(){

    const cart =
      getCart();


    if(cart.length === 0){

      alert(
        "Votre panier est vide."
      );

      return;
    }


    /*
      On sauvegarde aussi le panier
      sous la clé utilisée par checkout.
    */

    localStorage.setItem(
      "jr_checkout_cart",
      JSON.stringify(cart)
    );


    /*
      Si ton checkout.html existe,
      on y va directement.
    */

    window.location.href =
      "checkout.html";

  }
);


/* =====================================================
   INIT
===================================================== */

renderCart();


/*
  Si un autre onglet modifie le panier,
  on actualise automatiquement.
*/

window.addEventListener(
  "storage",
  function(event){

    if(event.key === CART_KEY){

      renderCart();

    }

  }
);

</script>

</body>
