<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JR Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f7f8;
  color: #111;
}

/* HEADER */

header {
  background: #111;
  color: white;
  padding: 18px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.top {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
}

.logo span {
  color: #16a34a;
}

.cart {
  border: 0;
  background: #16a34a;
  color: white;
  padding: 10px 15px;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
}

.cart:hover {
  background: #15803d;
}

/* HERO */

.hero {
  background: #111;
  color: white;
  text-align: center;
  padding: 35px 15px 45px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

.hero h1 span {
  color: #22c55e;
}

.hero p {
  color: #ccc;
  margin: 0;
}

/* CONTAINER */

.container {
  max-width: 1100px;
  margin: auto;
  padding: 22px 15px 50px;
}

/* SHOP */

.shop-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

/* SIDEBAR */

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: white;
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
  position: sticky;
  top: 90px;
}

.sidebar-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #eee;
}

.categories-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.category-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border: 0;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  text-align: right;
  transition: .2s;
}

.category-item:hover {
  background: #f0fdf4;
}

.category-item.active {
  background: #dcfce7;
  box-shadow: inset -3px 0 0 #16a34a;
}

.category-image {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}

.category-name {
  font-size: 14px;
  font-weight: bold;
}

.all-category {
  justify-content: center;
  background: #111;
  color: white;
  padding: 12px;
}

.all-category:hover,
.all-category.active {
  background: #16a34a;
  color: white;
  box-shadow: none;
}

/* PRODUCTS */

.products-area {
  flex: 1;
  min-width: 0;
}

.section-title {
  margin-bottom: 18px;
}

.section-title h2 {
  margin: 0;
  font-size: 22px;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.product {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

.product-img {
  height: 220px;
  background: #e5e7eb;
}

.product-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-info {
  padding: 13px;
}

.product h3 {
  font-size: 16px;
  margin: 0 0 8px;
}

.description {
  color: #666;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 8px;
}

.price {
  color: #16a34a;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.old-price {
  color: #999;
  text-decoration: line-through;
  font-size: 13px;
  margin-right: 5px;
}

.stock {
  color: #666;
  font-size: 13px;
  margin-bottom: 10px;
}

.buy {
  width: 100%;
  border: 0;
  background: #111;
  color: white;
  padding: 11px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.buy:hover {
  background: #16a34a;
}

.buy:disabled {
  background: #999;
  cursor: not-allowed;
}

.loading,
.error {
  text-align: center;
  padding: 30px;
  grid-column: 1 / -1;
}

.error {
  color: #dc2626;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 999;
  padding: 15px;
  overflow-y: auto;
}

.modal.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 550px;
  background: white;
  border-radius: 18px;
  padding: 20px;
  max-height: 92vh;
  overflow-y: auto;
}

/* CART */

.cart-item {
  display: flex;
  gap: 10px;
  padding: 12px;
  margin-bottom: 10px;
  background: #f6f7f8;
  border-radius: 12px;
  align-items: center;
}

.cart-item-img {
  width: 65px;
  height: 65px;
  border-radius: 10px;
  object-fit: cover;
  background: #ddd;
}

.cart-item-info {
  flex: 1;
}

.cart-item-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.cart-item-price {
  color: #16a34a;
  font-weight: bold;
}

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
}

.quantity-btn {
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  cursor: pointer;
}

.remove-btn {
  border: 0;
  background: #dc2626;
  color: white;
  padding: 7px 9px;
  border-radius: 8px;
  cursor: pointer;
}

/* FORM */

.form-group {
  margin-bottom: 11px;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 14px;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  font-family: Arial, sans-serif;
}

.form-textarea {
  min-height: 90px;
  resize: vertical;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: #16a34a;
}

/* BUTTONS */

.green-btn {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #16a34a;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.green-btn:hover {
  background: #15803d;
}

.black-btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.whatsapp-button {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #25D366;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* TOAST */

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  left: 20px;
  max-width: 400px;
  margin: auto;
  background: #111;
  color: white;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  z-index: 9999;
  display: none;
}

/* FOOTER */

footer {
  background: #111;
  color: #aaa;
  text-align: center;
  padding: 25px;
}

footer strong {
  color: #22c55e;
}

/* MOBILE */

@media (max-width: 699px) {

  .shop-layout {
    display: block;
  }

  .sidebar {
    width: 100%;
    position: static;
    margin-bottom: 20px;
  }

  .categories-list {
    display: grid;
    grid-template-columns: repeat(2,1fr);
  }

  .category-image {
    width: 42px;
    height: 42px;
  }

  .products {
    grid-template-columns: repeat(2,1fr);
  }

  .product-img {
    height: 160px;
  }

  .hero h1 {
    font-size: 27px;
  }

}

@media (max-width: 430px) {

  .products {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .product-info {
    padding: 10px;
  }

  .product h3 {
    font-size: 14px;
  }

  .price {
    font-size: 16px;
  }

}

</style>
</head>


<body>


<header>

  <div class="top">

    <div class="logo">
      JR <span>Shop</span>
    </div>

    <button
      type="button"
      class="cart"
      id="openCartBtn"
    >
      🛒 السلة
      (<span id="cartCount">0</span>)
    </button>

  </div>

</header>


<section class="hero">

  <h1>
    مرحبًا بكم في
    <span>JR Shop</span>
  </h1>

  <p>
    ملابس نسائية - رجالية وأطفال
  </p>

</section>


<div class="container">

  <div class="shop-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-title">
        🗂️ الفئات
      </div>

      <div
        id="categoriesList"
        class="categories-list"
      >

        <button
          type="button"
          class="category-item all-category active"
          data-category="all"
        >
          🛍️ جميع المنتجات
        </button>

        <div class="loading">
          جاري تحميل الفئات...
        </div>

      </div>

    </aside>


    <!-- PRODUCTS -->

    <main class="products-area">

      <div class="section-title">

        <h2 id="productsTitle">
          🛍️ جميع المنتجات
        </h2>

      </div>

      <div
        id="products"
        class="products"
      >

        <div class="loading">
          جاري تحميل المنتجات...
        </div>

      </div>

    </main>

  </div>

</div>


<!-- CART -->

<div
  class="modal"
  id="cartModal"
>

  <div class="modal-box">

    <h2 style="margin-top:0;">
      🛒 سلة المشتريات
    </h2>

    <div id="cartItems">
      السلة فارغة
    </div>

    <div
      id="cartTotal"
      style="
        font-size:20px;
        font-weight:bold;
        margin-top:15px;
      "
    >
      المجموع: 0 دج
    </div>

    <button
      type="button"
      id="checkoutBtn"
      class="green-btn"
      style="margin-top:15px;"
    >
      متابعة الطلب
    </button>

    <button
      type="button"
      id="closeCartBtn"
      class="black-btn"
    >
      إغلاق
    </button>

  </div>

</div>


<!-- CHECKOUT -->

<div
  class="modal"
  id="checkoutModal"
>

  <div class="modal-box">

    <h2 style="margin-top:0;">
      📦 معلومات الطلب
    </h2>

    <div class="form-group">

      <label class="form-label">
        الاسم واللقب
      </label>

      <input
        id="customerName"
        class="form-input"
        type="text"
        placeholder="أدخل الاسم واللقب"
      >

    </div>


    <div class="form-group">

      <label class="form-label">
        رقم الهاتف
      </label>

      <input
        id="customerPhone"
        class="form-input"
        type="tel"
        placeholder="0550000000"
      >

    </div>


    <div class="form-group">

      <label class="form-label">
        الولاية
      </label>

      <select
        id="customerWilaya"
        class="form-select"
      >

        <option value="">
          اختر الولاية
        </option>

      </select>

    </div>


    <div class="form-group">

      <label class="form-label">
        البلدية
      </label>

      <input
        id="customerCommune"
        class="form-input"
        type="text"
        placeholder="أدخل البلدية"
      >

    </div>


    <div class="form-group">

      <label class="form-label">
        العنوان
      </label>

      <textarea
        id="customerAddress"
        class="form-textarea"
        placeholder="أدخل العنوان بالتفصيل"
      ></textarea>

    </div>


    <div
      id="checkoutTotal"
      style="
        background:#f6f7f8;
        padding:12px;
        border-radius:10px;
        margin-bottom:10px;
        font-weight:bold;
      "
    >
      المجموع: 0 دج
    </div>


    <button
      type="button"
      id="submitOrderBtn"
      class="green-btn"
    >
      ✅ تأكيد الطلب
    </button>


    <button
      type="button"
      id="whatsappOrderBtn"
      class="whatsapp-button"
    >
      📱 إرسال الطلب عبر WhatsApp
    </button>


    <button
      type="button"
      id="backToCartBtn"
      class="black-btn"
    >
      ↩️ الرجوع للسلة
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<footer>

  <strong>JR Shop</strong>

  <br><br>

  ملابس نسائية - رجالية وأطفال

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://cstjgsuehmqcolajspqh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   WHATSAPP
===================================================== */

const WHATSAPP_NUMBER =
  "213697005313";


/* =====================================================
   VARIABLES
===================================================== */

let allProducts = [];

let categories = [];

let selectedCategory = "all";

let cart = [];


/* =====================================================
   HTML SAFE
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(() => {

    toast.style.display = "none";

  },2500);

}


/* =====================================================
   CART STORAGE
===================================================== */

function saveCart() {

  localStorage.setItem(
    "jr_shop_cart",
    JSON.stringify(cart)
  );

}


function loadCartFromStorage() {

  try {

    const saved =
      localStorage.getItem(
        "jr_shop_cart"
      );

    cart =
      saved
        ? JSON.parse(saved)
        : [];

  } catch {

    cart = [];

  }

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories() {

  const container =
    document.getElementById(
      "categoriesList"
    );

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("categories")
        .select(
          "id,name,slug,image_url"
        )
        .order(
          "name",
          {
            ascending:true
          }
        );


    if (error) {

      console.error(
        "Categories:",
        error
      );

      container.innerHTML = `
        <div class="error">
          فشل تحميل الفئات
          <br><br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

      return;

    }


    categories =
      data || [];

    renderCategories();

  } catch(error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        حدث خطأ أثناء تحميل الفئات
      </div>
    `;

  }

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  const container =
    document.getElementById(
      "categoriesList"
    );


  let html = `

    <button
      type="button"
      class="category-item all-category ${
        selectedCategory === "all"
        ? "active"
        : ""
      }"
      data-category="all"
    >
      🛍️ جميع المنتجات
    </button>

  `;


  categories.forEach(
    category => {

      const image =
        category.image_url ||
        "https://placehold.co/100x100?text=JR";


      html += `

        <button
          type="button"
          class="category-item ${
            String(
              selectedCategory
            ) ===
            String(
              category.id
            )
            ? "active"
            : ""
          }"
          data-category="${
            escapeHtml(
              category.id
            )
          }"
        >

          <img
            class="category-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(
              category.name
            )}"
            onerror="
              this.src='https://placehold.co/100x100?text=JR'
            "
          >

          <span class="category-name">
            ${escapeHtml(
              category.name
            )}
          </span>

        </button>

      `;

    }
  );


  container.innerHTML =
    html;


  container
    .querySelectorAll(
      ".category-item"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectCategory(
              button.dataset.category
            );

          }
        );

      }
    );

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(
  categoryId
) {

  selectedCategory =
    categoryId;


  const title =
    document.getElementById(
      "productsTitle"
    );


  if (
    categoryId === "all"
  ) {

    title.textContent =
      "🛍️ جميع المنتجات";

  } else {

    const category =
      categories.find(
        item =>
          String(item.id) ===
          String(categoryId)
      );


    title.textContent =
      category
      ? "🛍️ " + category.name
      : "🛍️ المنتجات";

  }


  renderCategories();

  filterProducts();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const container =
    document.getElementById(
      "products"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        );


    if (error) {

      console.error(
        "Products:",
        error
      );

      container.innerHTML = `
        <div class="error">
          فشل تحميل المنتجات
          <br><br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

      return;

    }


    allProducts =
      data || [];


    renderProducts(
      allProducts
    );


  } catch(error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        حدث خطأ أثناء تحميل المنتجات
      </div>
    `;

  }

}


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function filterProducts() {

  let products =
    allProducts;


  if (
    selectedCategory !==
    "all"
  ) {

    products =
      allProducts.filter(
        product =>
          String(
            product.category_id
          ) ===
          String(
            selectedCategory
          )
      );

  }


  renderProducts(
    products
  );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
  products
) {

  const container =
    document.getElementById(
      "products"
    );


  if (
    !products ||
    products.length === 0
  ) {

    container.innerHTML = `
      <div class="loading">
        لا توجد منتجات في هذه الفئة.
      </div>
    `;

    return;

  }


  let html = "";


  products.forEach(
    product => {

      const image =
        product.image_url ||
        product.image ||
        "https://placehold.co/500x500?text=JR+Shop";


      const name =
        product.name ||
        "منتج";


      const description =
        product.description ||
        "";


      const price =
        Number(
          product.price || 0
        );


      const oldPrice =
        Number(
          product.old_price || 0
        );


      const stock =
        Number(
          product.stock ?? 0
        );


      const unavailable =
        stock <= 0;


      html += `

        <article class="product">

          <div class="product-img">

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
              onerror="
                this.src='https://placehold.co/500x500?text=JR+Shop'
              "
            >

          </div>


          <div class="product-info">

            <h3>
              ${escapeHtml(name)}
            </h3>


            ${
              description
              ? `
                <div class="description">
                  ${escapeHtml(
                    description
                  )}
                </div>
              `
              : ""
            }


            <div class="price">

              ${price.toLocaleString(
                "fr-DZ"
              )} دج

              ${
                oldPrice > price
                ? `
                  <span class="old-price">
                    ${oldPrice.toLocaleString(
                      "fr-DZ"
                    )} دج
                  </span>
                `
                : ""
              }

            </div>


            <div class="stock">

              ${
                unavailable
                ? "❌ غير متوفر"
                : "✅ متوفر"
              }

            </div>


            <button
              type="button"
              class="buy"
              ${
                unavailable
                ? "disabled"
                : ""
              }
              data-id="${escapeHtml(
                product.id
              )}"
            >

              ${
                unavailable
                ? "غير متوفر"
                : "🛒 أضف إلى السلة"
              }

            </button>

/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
  productId
) {

  const product =
    allProducts.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if (!product) {

    showToast(
      "المنتج غير موجود"
    );

    return;

  }


  const stock =
    Number(
      product.stock ?? 999999
    );


  if (
    stock <= 0
  ) {

    showToast(
      "المنتج غير متوفر"
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existing) {

    if (
      existing.quantity >=
      stock
    ) {

      showToast(
        "وصلت للكمية المتوفرة"
      );

      return;

    }

    existing.quantity++;

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(
          product.price || 0
        ),

      image_url:
        product.image_url ||
        product.image ||
        "",

      quantity:1,

      stock:stock

    });

  }


  saveCart();

  updateCartCount();

  renderCart();

  showToast(
    "✅ تمت إضافة المنتج للسلة"
  );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 0
        ),
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


/* =====================================================
   CART TOTAL
===================================================== */

function getCartTotal() {

  return cart.reduce(
    (
      total,
      item
    ) =>
      total +
      Number(
        item.price || 0
      ) *
      Number(
        item.quantity || 0
      ),
    0
  );

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  const total =
    getCartTotal();


  if (
    cart.length === 0
  ) {

    container.innerHTML = `
      <div
        style="
          text-align:center;
          padding:30px;
          color:#777;
        "
      >

      </div>
    `;

  } else {

    let html = "";


    cart.forEach(
      item => {

        const subtotal =
          Number(
            item.price || 0
          ) *
          Number(
            item.quantity || 0
          );


        html += `

          <div class="cart-item">

            <img
              class="cart-item-img"
              src="${escapeHtml(
                item.image_url ||
                "https://placehold.co/100x100?text=JR"
              )}"
              alt="${escapeHtml(
                item.name
              )}"
            >


            <div class="cart-item-info">

              <div class="cart-item-name">
                ${escapeHtml(
                  item.name
                )}
              </div>


              <div class="cart-item-price">
                ${subtotal.toLocaleString(
                  "fr-DZ"
                )} دج
              </div>


              <div class="quantity-controls">

                <button
                  type="button"
                  class="quantity-btn"
                  data-action="plus"
                  data-id="${escapeHtml(
                    item.id
                  )}"
                >
                  +
                </button>

                <strong>
                  ${item.quantity}
                </strong>

                <button
                  type="button"
                  class="quantity-btn"
                  data-action="minus"
                  data-id="${escapeHtml(
                    item.id
                  )}"
                >
                  −
                </button>

              </div>

            </div>


            <button
              type="button"
              class="remove-btn"
              data-remove="${escapeHtml(
                item.id
              )}"
            >
              🗑️
            </button>

          </div>

        `;

      }
    );


    container.innerHTML =
      html;


    container
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              changeQuantity(
                button.dataset.id,
                button.dataset.action ===
                "plus"
                ? 1
                : -1
              );

            }
          );

        }
      );


    container
      .querySelectorAll(
        "[data-remove]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              removeFromCart(
                button.dataset.remove
              );

            }
          );

        }
      );

  }


  document.getElementById(
    "cartTotal"
  ).textContent =
    "المجموع: " +
    total.toLocaleString(
      "fr-DZ"
    ) +
    " دج";


  document.getElementById(
    "checkoutTotal"
  ).textContent =
    "المجموع: " +
    total.toLocaleString(
      "fr-DZ"
    ) +
    " دج";

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
  productId,
  change
) {

  const item =
    cart.find(
      product =>
        String(product.id) ===
        String(productId)
    );


  if (!item) return;


  const newQuantity =
    item.quantity +
    change;


  if (
    newQuantity <= 0
  ) {

    removeFromCart(
      productId
    );

    return;

  }


  if (
    item.stock &&
    newQuantity >
      item.stock
  ) {

    showToast(
      "لا توجد كمية أكثر من هذا المنتج"
    );

    return;

  }


  item.quantity =
    newQuantity;


  saveCart();

  updateCartCount();

  renderCart();

}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(
  productId
) {

  cart =
    cart.filter(
      item =>
        String(item.id) !==
        String(productId)
    );


  saveCart();

  updateCartCount();

  renderCart();

}
