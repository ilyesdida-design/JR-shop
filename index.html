<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JR Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #16a34a;
    }

    .cart {
      background: #16a34a;
      border: 0;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .hero {
      background: #111;
      color: white;
      padding: 35px 18px 45px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: #22c55e;
    }

    .hero p {
      color: #ccc;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 50px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .product-img {
      height: 180px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 45px;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 13px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .price {
      color: #16a34a;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-right: 5px;
    }

    .stock {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .buy {
      width: 100%;
      border: 0;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy:hover {
      background: #16a34a;
    }

    .loading,
    .error {
      text-align: center;
      padding: 30px;
      font-size: 16px;
    }

    .error {
      color: #dc2626;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
    }

    footer strong {
      color: #22c55e;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">
      JR <span>Shop</span>
    </div>
    
    <button class="cart" onclick="openCart()">
  🛒 السلة (<span id="cartCount">0</span>)
    </button>

  </div>
</header>

<section class="hero">
  <h1>
    مرحباً بكم في <span>JR Shop</span>
  </h1>

  <p>
    اكتشف منتجاتنا الجديدة
  </p>
</section>

<main class="container">

  <div class="section-title">
    <h2>المنتجات</h2>
  </div>

  <div id="products" class="products">
    <div class="loading">
      جاري تحميل المنتجات...
    </div>
  </div>

</main>
  <div id="cartModal" style="
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 100;
  padding: 20px;
">

  <div style="
    background: white;
    max-width: 500px;
    margin: 50px auto;
    border-radius: 16px;
    padding: 20px;
  ">

    <h2 style="margin-bottom: 15px;">
      🛒 سلة المشتريات
    </h2>

    <div id="cartItems">
      السلة فارغة
    </div>

    <div id="cartTotal" style="
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    ">
      المجموع: 0 دج
    </div>

    <button onclick="closeCart()" style="
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: bold;
    ">
      إغلاق
    </button>

  </div>
</div>

<footer>
  <p>
    جميع الحقوق محفوظة © <strong>JR Shop</strong>
  </p>
</footer>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://cstjgsuehmqcolajspqh.supabase.co";
const SUPABASE_KEY = "sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let cart = [];
window.products = [];


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts() {

  const productsContainer = document.getElementById("products");

  productsContainer.innerHTML = `
    <div class="loading">
      جاري تحميل المنتجات...
    </div>
  `;

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {

    console.error("Supabase error:", error);

    productsContainer.innerHTML = `
      <div class="error">
        حدث خطأ أثناء تحميل المنتجات.
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    productsContainer.innerHTML = `
      <div class="loading">
        لا توجد منتجات حالياً.
      </div>
    `;

    return;
  }

  window.products = data;

  productsContainer.innerHTML = data.map(product => {

    const image = product.image
  ? `<img src="${product.image}" alt="${product.name || "منتج JR"}">`
  : "🛍️";

    const oldPrice = product.old_price
      ? `<span class="old-price">${product.old_price} دج</span>`
      : "";

    return `
      <article class="product">

        <div class="product-img">
          ${image}
        </div>

        <div class="product-info">

          <h3>${product.name || "منتج JR"}</h3>

          <div class="description">
            ${product.description || ""}
          </div>

          <div class="price">
            ${Number(product.price)} دج
            ${oldPrice}
          </div>

          <div class="stock">
            المخزون: ${product.stock ?? 0}
          </div>

          <button
            class="buy"
            onclick="addToCart('${product.id}')"
            ${Number(product.stock) <= 0 ? "disabled" : ""}
          >
            ${Number(product.stock) <= 0 ? "نفذ المخزون" : "أضف إلى السلة"}
          </button>

        </div>

      </article>
    `;

  }).join("");
}


/* =========================
   فتح وإغلاق السلة
========================= */

function openCart() {

  document.getElementById("cartModal").style.display = "block";

  renderCart();
}


function closeCart() {

  document.getElementById("cartModal").style.display = "none";
}


/* =========================
   عرض السلة
========================= */

function renderCart() {

  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  if (cart.length === 0) {

    cartItems.innerHTML = `
      <div style="
        text-align:center;
        padding:20px;
        color:#666;
      ">
        🛒 السلة فارغة
      </div>
    `;

    cartTotal.innerHTML = `
      المجموع: 0 دج
    `;

    return;
  }


  cartItems.innerHTML = cart.map(item => {

    const product = window.products.find(
      p => p.id === item.id
    );

    const stock = product
      ? Number(product.stock)
      : 999999;

    return `
      <div style="
        padding:15px 0;
        border-bottom:1px solid #ddd;
      ">

        <strong>
          ${item.name}
        </strong>

        <div style="
          margin-top:10px;
          display:flex;
          align-items:center;
          justify-content:space-between;
        ">

          <button
            onclick="decreaseQuantity('${item.id}')"
            style="
              width:40px;
              height:40px;
              border:0;
              border-radius:8px;
              background:#111;
              color:white;
              font-size:22px;
            "
          >
            −
          </button>

          <span style="
            font-size:18px;
            font-weight:bold;
          ">
            ${item.quantity}
          </span>

          <button
            onclick="increaseQuantity('${item.id}')"
            ${item.quantity >= stock ? "disabled" : ""}
            style="
              width:40px;
              height:40px;
              border:0;
              border-radius:8px;
              background:#16a34a;
              color:white;
              font-size:22px;
              opacity:${item.quantity >= stock ? "0.5" : "1"};
            "
          >
            +
          </button>

        </div>

        <div style="
          margin-top:8px;
          font-weight:bold;
        ">
          ${Number(item.price)} دج × ${item.quantity}
        </div>

        <button
          onclick="removeFromCart('${item.id}')"
          style="
            width:100%;
            margin-top:10px;
            padding:10px;
            border:0;
            border-radius:8px;
            background:#dc2626;
            color:white;
            font-weight:bold;
          "
        >
          🗑️ حذف المنتج
        </button>

      </div>
    `;

  }).join("");


  const total = cart.reduce((sum, item) => {

    return sum +
      (Number(item.price) * Number(item.quantity));

  }, 0);


  cartTotal.innerHTML = `
    <div>
      المجموع: ${total} دج
    </div>

    <button
      onclick="<button
  onclick="submitOrder()"
  style="
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  "
>
  ✅ تأكيد الطلب
</button>

<button
  onclick="sendOrderToWhatsApp()"
  style="
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  "
>
  📱 إرسال الطلب عبر WhatsApp
</button>()"
      style="
        width:100%;
        margin-top:15px;
        padding:13px;
        border:0;
        border-radius:10px;
        background:#16a34a;
        color:white;
        font-weight:bold;
        font-size:16px;
        cursor:pointer;
      "
    >
      ✅ إتمام الطلب
    </button>
  `;
}


/* =========================
   عداد السلة
========================= */

function updateCartCount() {

  const cartCount =
    document.getElementById("cartCount");

  const totalItems = cart.reduce(
    (total, item) => total + item.quantity,
    0
  );

  cartCount.textContent = totalItems;
}


/* =========================
   إضافة للسلة
========================= */

function addToCart(productId) {

  const product = window.products.find(
    p => p.id === productId
  );

  if (!product) {

    alert("لم يتم العثور على المنتج");

    return;
  }


  const stock = Number(product.stock);

  if (stock <= 0) {

    alert("هذا المنتج غير متوفر حالياً");

    return;
  }


  const existingItem = cart.find(
    item => item.id === productId
  );


  if (existingItem) {

    if (existingItem.quantity >= stock) {

      alert("لا يمكن تجاوز كمية المخزون");

      return;
    }

    existingItem.quantity++;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: Number(product.price),

      quantity: 1

    });

  }


  updateCartCount();

  renderCart();
}


/* =========================
   إنقاص الكمية
========================= */

function decreaseQuantity(productId) {

  const item = cart.find(
    item => item.id === productId
  );

  if (!item) return;


  if (item.quantity > 1) {

    item.quantity--;

  } else {

    cart = cart.filter(
      item => item.id !== productId
    );

  }


  updateCartCount();

  renderCart();
}


/* =========================
   زيادة الكمية
========================= */

function increaseQuantity(productId) {

  const item = cart.find(
    item => item.id === productId
  );

  if (!item) return;


  const product = window.products.find(
    p => p.id === productId
  );

  const stock = product
    ? Number(product.stock)
    : 0;


  if (item.quantity >= stock) {

    alert("لا يمكن تجاوز كمية المخزون");

    return;
  }


  item.quantity++;

  updateCartCount();

  renderCart();
}


/* =========================
   حذف المنتج
========================= */

function removeFromCart(productId) {

  cart = cart.filter(
    item => item.id !== productId
  );

  updateCartCount();

  renderCart();
}


/* =========================
   واجهة معلومات الزبون
========================= */

function showCheckout() {

  if (cart.length === 0) {

    alert("السلة فارغة");

    return;
  }


  const cartItems =
    document.getElementById("cartItems");

  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        (Number(item.price) * Number(item.quantity)),
      0
    );


  cartItems.innerHTML = `

    <div style="
      margin-top:10px;
    ">

      <h3 style="
        margin-bottom:15px;
      ">
        📦 معلومات الطلب
      </h3>


      <input
        id="customerName"
        type="text"
        placeholder="الاسم الكامل"
        style="
          width:100%;
          padding:12px;
          margin-bottom:10px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:15px;
        "
      >


      <input
        id="customerPhone"
        type="tel"
        placeholder="رقم الهاتف"
        style="
          width:100%;
          padding:12px;
          margin-bottom:10px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:15px;
        "
      >


      <input
        id="customerWilaya"
        type="text"
        placeholder="الولاية"
        style="
          width:100%;
          padding:12px;
          margin-bottom:10px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:15px;
        "
      >


      <textarea
        id="customerAddress"
        placeholder="العنوان بالتفصيل"
        rows="3"
        style="
          width:100%;
          padding:12px;
          margin-bottom:10px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:15px;
          resize:none;
        "
      ></textarea>


      <div style="
        background:#f6f7f8;
        padding:12px;
        border-radius:10px;
        margin-bottom:10px;
        font-weight:bold;
      ">
        المجموع:
        ${total} دج
      </div>


      <button
        onclick="submitOrder()"
        style="
          width:100%;
          padding:13px;
          border:0;
          border-radius:10px;
          background:#16a34a;
          color:white;
          font-size:16px;
          font-weight:bold;
          cursor:pointer;
        "
      >
        ✅ تأكيد الطلب
      </button>


      <button
        onclick="renderCart()"
        style="
          width:100%;
          margin-top:10px;
          padding:12px;
          border:0;
          border-radius:10px;
          background:#111;
          color:white;
          font-weight:bold;
        "
      >
        ↩️ الرجوع للسلة
      </button>

    </div>

  `;


  document.getElementById("cartTotal").innerHTML =
    `المجموع: ${total} دج`;
}


/* =========================
   إرسال الطلب إلى Supabase
========================= */

async function submitOrder() {

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const wilaya =
    document.getElementById("customerWilaya").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();


  if (!name || !phone || !wilaya || !address) {

    alert("من فضلك أكمل جميع معلومات الطلب");

    return;
  }


  if (cart.length === 0) {

    alert("السلة فارغة");

    return;
  }


  const total = cart.reduce(
    (sum, item) =>
      sum +
      (Number(item.price) * Number(item.quantity)),
    0
  );


  const orderItems = cart.map(item => ({

    product_id: item.id,

    name: item.name,

    price: Number(item.price),

    quantity: Number(item.quantity),

    subtotal:
      Number(item.price) *
      Number(item.quantity)

  }));


  const { data, error } = await supabaseClient.rpc("create_order", {
  p_customer_name: name,
  p_phone: phone,
  p_wilaya: wilaya,
  p_address: address,
  p_items: orderItems,
  p_total: total
});

  if (error) {

    console.error("Order error:", error);

    alert(
      "حدث خطأ أثناء إرسال الطلب.\n\n" +
      error.message
    );

    return;
  }


  console.log("Order created:", data);


  alert(
    "✅ تم إرسال طلبك بنجاح!\n\n" +
    "سنتواصل معك لتأكيد الطلب."
  );


  cart = [];

  updateCartCount();

  renderCart();
}


/* =========================
   تشغيل الموقع
========================= */

loadProducts();

updateCartCount();

renderCart();

</script>                
</body>
</html>
