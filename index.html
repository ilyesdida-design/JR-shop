<script>


/* =====================================================
   SUPABASE
===================================================== */

/*
  ⚠️ ضع هنا نفس بيانات Supabase الموجودة عندك
*/

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   WHATSAPP
===================================================== */

const WHATSAPP_NUMBER =
  "213697005313";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allProducts = [];

let categories = [];

let selectedCategory = "all";

let cart = [];


/* =====================================================
   CART STORAGE
===================================================== */

function saveCart() {

  localStorage.setItem(
    "jr_shop_cart",
    JSON.stringify(cart)
  );

}


function loadCartFromStorage() {

  try {

    const saved =
      localStorage.getItem(
        "jr_shop_cart"
      );

    cart =
      saved
        ? JSON.parse(saved)
        : [];

  } catch (error) {

    cart = [];

  }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.style.display =
    "block";


  setTimeout(() => {

    toast.style.display =
      "none";

  }, 2500);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CATEGORIES
===================================================== */

async function loadCategories() {

  const container =
    document.getElementById(
      "categoriesList"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("categories")
        .select(
          "id,name,slug,image_url"
        )
        .order(
          "name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Categories error:",
        error
      );

      container.innerHTML = `
        <div class="error">
          حدث خطأ أثناء تحميل الفئات
        </div>
      `;

      return;

    }


    categories =
      data || [];


    renderCategories();

  } catch (error) {

    console.error(
      error
    );

    container.innerHTML = `
      <div class="error">
        حدث خطأ غير متوقع
      </div>
    `;

  }

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  const container =
    document.getElementById(
      "categoriesList"
    );


  let html = `

    <button
      type="button"
      class="category-item all-category ${
        selectedCategory === "all"
          ? "active"
          : ""
      }"
      data-category="all"
    >
      🛍️ جميع المنتجات
    </button>

  `;


  if (categories.length === 0) {

    html += `

      <div
        style="
          text-align:center;
          padding:15px;
          color:#777;
          font-size:14px;
        "
      >
        لا توجد فئات
      </div>

    `;

  } else {

    categories.forEach(
      category => {

        const image =
          category.image_url ||
          "https://via.placeholder.com/100?text=JR";


        html += `

          <button
            type="button"
            class="category-item ${
              String(
                selectedCategory
              ) ===
              String(
                category.id
              )
                ? "active"
                : ""
            }"
            data-category="${
              escapeHtml(
                category.id
              )
            }"
          >

            <img
              class="category-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(
                category.name
              )}"
              onerror="
                this.src='https://via.placeholder.com/100?text=JR'
              "
            >

            <span class="category-name">
              ${escapeHtml(
                category.name
              )}
            </span>

          </button>

        `;

      }
    );

  }


  container.innerHTML =
    html;


  container
    .querySelectorAll(
      ".category-item"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectCategory(
              button.dataset.category
            );

          }
        );

      }
    );

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(
  categoryId
) {

  selectedCategory =
    categoryId;


  const title =
    document.getElementById(
      "productsTitle"
    );


  if (
    categoryId === "all"
  ) {

    title.textContent =
      "🛍️ جميع المنتجات";

  } else {

    const category =
      categories.find(
        item =>
          String(item.id) ===
          String(categoryId)
      );


    title.textContent =
      category
        ? "🛍️ " +
          category.name
        : "🛍️ المنتجات";

  }


  renderCategories();

  filterProducts();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const container =
    document.getElementById(
      "products"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Products error:",
        error
      );


      container.innerHTML = `

        <div class="error">

          حدث خطأ أثناء تحميل المنتجات

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      `;

      return;

    }


    allProducts =
      data || [];


    window.allProducts =
      allProducts;


    renderProducts(
      allProducts
    );


  } catch (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="error">
        حدث خطأ غير متوقع
      </div>

    `;

  }

}


/* =====================================================
   FILTER PRODUCTS
===================================================== */

function filterProducts() {

    selectedCategory !==

  ) {

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
  products
) {

  const container =
    document.getElementById(
      "products"
    );


  if (
    !products ||

  ) {

    container.innerHTML = `

      <div class="loading">

  let html = "";

        product.name ||
        "منتج";

        product.description ||

      const price =

          product.price || 0
        );

        Number(
          product.old_price || 0
        );

        );

        stock <= 0;


      html += `

        <article
          class="product"
        >

          <div class="product-img">

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
              onerror="

          <div class="product-info">

            </h3>


            ${

                  <div class="description">
                    ${escapeHtml(
                      description
                    )}
                  </div>
                `
                : ""
            }


            <div class="price">

              ${price.toLocaleString(
                "fr-DZ"
              )} دج

              ${
                oldPrice > price
                  ? `
                    <span class="old-price">
                      ${oldPrice.toLocaleString(
                        "fr-DZ"
                      )} دج
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="stock">

              ${
                outOfStock
                  ? "❌ غير متوفر"
                  : "✅ متوفر"
              }

            </div>


            <button
              type="button"
              class="buy"
              ${
                outOfStock
                  ? "disabled"
                  : ""
              }
              onclick="
                addToCart('${escapeHtml(
                  product.id
                )}')
              "
            >

              ${
                outOfStock
                  ? "غير متوفر"
                  : "🛒 أضف إلى السلة"
              }

            </button>

          </div>

        </article>

      `;

    }
  );


  container.innerHTML =
    html;

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(
  productId
) {

  const product =
    allProducts.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if (!product) {

    showToast(
      "المنتج غير موجود"
    );

    return;

  }


  const stock =
    Number(
      product.stock ?? 999999
    );


  if (
    stock <= 0
  ) {

    showToast(
      "هذا المنتج غير متوفر"
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existing) {

    if (
      existing.quantity >=
      stock
    ) {

      showToast(
        "وصلت للكمية المتوفرة"
      );

      return;

    }


    existing.quantity++;

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(
          product.price || 0
        ),

      image_url:
        product.image_url ||
        product.image ||
        "",

      quantity:
        1,

      stock:
        stock

    });

  }


  saveCart();

  updateCartCount();

  renderCart();

  showToast(
    "✅ تمت إضافة المنتج للسلة"
  );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 0
        ),
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


/* =====================================================
   CART TOTAL
===================================================== */

function getCartTotal() {

  return cart.reduce(
    (
      total,
      item
    ) =>
      total +
      Number(
        item.price || 0
      ) *
      Number(
        item.quantity || 0
      ),
    0
  );

}

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
  productId,
  change
) {

  const item =
    cart.find(
      product =>
        String(product.id) ===
        String(productId)
    );


  if (!item) return;


  const newQuantity =
    Number(
      item.quantity
    ) +
    Number(
      change
    );


  if (
    newQuantity <= 0
  ) {

    removeFromCart(
      productId
    );

    return;

  }


  if (
    item.stock &&
    newQuantity >
      item.stock
  ) {

    showToast(
      "لا توجد كمية أكثر من هذا المنتج"
    );

    return;

  }


  item.quantity =
    newQuantity;


  saveCart();

  updateCartCount();

  renderCart();

}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(
  productId
) {

  cart =
    cart.filter(
      item =>
        String(item.id) !==
        String(productId)
    );


  saveCart();

  updateCartCount();

  renderCart();

}
