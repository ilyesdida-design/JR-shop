<script>

"use strict";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://cstjgsuehmqcolajspqh.supabase.co";

const SUPABASE_KEY =

const supabaseClient =

const WHATSAPP_NUMBER =

/* =========================

========================= */

/*
  Dataset:
  1541 communes
  Algeria
*/

const COMMUNES_URL =
  "https://raw.githubusercontent.com/ihahachi/Algeria-Cities/main/json/algeria_cities.json";


let algeriaData = [];


/* =========================
   VARIABLES
========================= */

let cart = [];

let products = [];


/* =========================
   LOCAL STORAGE
========================= */

function loadCartFromStorage() {

  try {

    const savedCart =
      localStorage.getItem("jr_shop_cart");

    if (savedCart) {

      const parsed =
        JSON.parse(savedCart);

      if (Array.isArray(parsed)) {
        cart = parsed;
      }

    }

  } catch (error) {

    console.error(
      "Cart storage error:",
      error
    );

    cart = [];
  }

}


function saveCart() {

  try {

    localStorage.setItem(
      "jr_shop_cart",
      JSON.stringify(cart)
    );

  } catch (error) {

    console.error(
      "Could not save cart:",
      error
    );

  }

}


/* =========================
   TOAST
========================= */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      toast.style.display = "none";

    }, 2000);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD WILAYAS + COMMUNES
========================= */

async function loadAlgeriaData() {

  try {

    const response =
      await fetch(COMMUNES_URL);

    if (!response.ok) {
      throw new Error(
        "Impossible de charger la liste des communes"
      );
    }

    const data =
      await response.json();


    /*
      بعض datasets تكون:
      Array
      وبعضها object فيه data
    */

    if (Array.isArray(data)) {

      algeriaData = data;

    } else if (
      data &&
      Array.isArray(data.data)
    ) {

      algeriaData = data.data;

    } else {

      throw new Error(
        "Format de données incorrect"
      );

    }


    console.log(
      "Algeria communes loaded:",
      algeriaData.length
    );


  } catch (error) {

    console.error(
      "Algeria data error:",
      error
    );

    /*
      إذا فشل التحميل نخلي select
      يقول للزبون يعاود المحاولة.
    */

    const wilaya =
      document.getElementById(
        "customerWilaya"
      );

    if (wilaya) {

      wilaya.innerHTML = `
        <option value="">
          تعذر تحميل الولايات
        </option>
      `;

    }

  }

}


/* =========================
   GET WILAYA CODE
========================= */

function getWilayaCode(item) {

  return String(
    item.wilaya_code ??
    item.wilayaCode ??
    item.code ??
    item.wilaya_id ??
    ""
  );

}


/* =========================
   GET WILAYA NAME
========================= */

function getWilayaName(item) {

  return (
    item.wilaya_name ??
    item.nameAr ??
    item.name_ar ??
    item.wilayaName ??
    item.name ??
    ""
  );

}


/* =========================
   GET COMMUNE NAME
========================= */

function getCommuneName(item) {

  return (
    item.commune_name ??
    item.nameAr ??
    item.name_ar ??
    item.communeName ??
    item.name ??
    ""
  );

}


/* =========================
   POPULATE WILAYAS
========================= */

function populateWilayas() {

  const select =
    document.getElementById(
      "customerWilaya"
    );


  if (!select) {
    return;
  }


  /*
    نجيب الولايات unique
  */

  const wilayas = [];


  const seen =
    new Set();


  algeriaData.forEach(item => {

    const code =
      getWilayaCode(item);

    const name =
      getWilayaName(item);


    if (
      code &&
      name &&
      !seen.has(code)
    ) {

      seen.add(code);

      wilayas.push({
        code,
        name
      });

    }

  });


  wilayas.sort(
    (a, b) =>
      Number(a.code) -
      Number(b.code)
  );


  select.innerHTML = `

    <option value="">
      اختر الولاية
    </option>

  `;


  wilayas.forEach(wilaya => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      wilaya.code;

    option.textContent =
      wilaya.name;


    select.appendChild(
      option
    );

  });

}


/* =========================
   POPULATE COMMUNES
========================= */

function populateCommunes(wilayaCode) {

  const select =
    document.getElementById(
      "customerCommune"
    );


  if (!select) {
    return;
  }


  select.innerHTML = `

    <option value="">
      جاري تحميل البلديات...
    </option>

  `;


  select.disabled = true;


  if (!wilayaCode) {

    select.innerHTML = `

      <option value="">
        اختر الولاية أولاً
      </option>

    `;

    return;
  }


  const communes =
    algeriaData
      .filter(item =>
        getWilayaCode(item) ===
        String(wilayaCode)
      )
      .map(item => ({
        name:
          getCommuneName(item)
      }))
      .filter(item => item.name);


  communes.sort(
    (a, b) =>
      a.name.localeCompare(
        b.name,
        "ar"
      )
  );


  select.innerHTML = `

    <option value="">
      اختر البلدية
    </option>

  `;


  communes.forEach(commune => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      commune.name;

    option.textContent =
      commune.name;


    select.appendChild(
      option
    );

  });


  select.disabled =
    communes.length === 0;


  if (communes.length === 0) {

    select.innerHTML = `

      <option value="">
        لا توجد بلديات
      </option>

    `;

  }

}


/* =========================

========================= */

document

    function(event) {

      if (

/* =========================

========================= */

async function loadProducts() {

  const productsContainer =
    document.getElementById(
      "products"
    );


  productsContainer.innerHTML = `

    <div class="loading">
      جاري تحميل المنتجات...
    </div>

  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("is_active", true)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(
        "Supabase error:",
        error
      );


      productsContainer.innerHTML = `

        <div class="error">

          حدث خطأ أثناء تحميل المنتجات.

          <br><br>

          ${escapeHtml(error.message)}

        </div>

      `;

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      productsContainer.innerHTML = `

        <div class="loading">

          لا توجد منتجات حالياً.

        </div>

      `;

      products = [];

      return;
    }


    products = data;


    renderProducts();

    cleanCart();

    updateCartCount();

    renderCart();


  } catch (error) {

    console.error(
      "Unexpected load error:",
      error
    );


    productsContainer.innerHTML = `

      <div class="error">

        حدث خطأ غير متوقع أثناء تحميل المنتجات.

      </div>

    `;

  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts() {

  const productsContainer =
    document.getElementById(
      "products"
    );


  productsContainer.innerHTML =
    products.map(product => {

      const productId =
        String(product.id);


      const image =
        product.image
          ? `

            <img
              src="${escapeHtml(product.image)}"

        product.old_price
          ? `

            <span class="old-price">
              ${Number(product.old_price)} دج
            </span>

          `
          : "";


      const stock =
        Number(
          product.stock || 0
        );


      return `

        <article class="product">

          <div class="product-img">
            ${image}
          </div>


          <div class="product-info">

            <h3>
              ${escapeHtml(
                product.name ||
                "منتج JR"
              )}
            </h3>


            <div class="description">

              ${escapeHtml(
                product.description ||
                ""
              )}

            </div>


            <div class="price">

              ${Number(
                product.price || 0
              )} دج

              ${oldPrice}

            </div>

              المخزون:
              ${stock}

            </div>


            <button
              type="button"
              class="buy add-to-cart-btn"
              data-product-id="${escapeHtml(productId)}"
              ${stock <= 0 ? "disabled" : ""}
            >

              ${
                stock <= 0
                  ? "نفذ المخزون"
                  : "أضف إلى السلة"
              }

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   ADD TO CART EVENT
========================= */

document
  .getElementById("products")

    "click",
    function(event) {

      const button =
        event.target.closest(
          ".add-to-cart-btn"
        );

/* =========================
   ADD TO CART
========================= */

function addToCart(productId) {

  const id =
    String(productId);


  const product =
    products.find(
      p =>
        String(p.id) === id
    );


  if (!product) {

    alert(
      "لم يتم العثور على المنتج"
    );

    return;
  }


  const stock =
    Number(
      product.stock || 0
    );


  if (stock <= 0) {

    alert(
      "هذا المنتج غير متوفر حالياً"
    );

    return;
  }


  const existingItem =
    cart.find(
      item =>
        String(item.id) === id
    );


  if (existingItem) {

    if (
      Number(existingItem.quantity) >=
      stock
    ) {

      alert(
        "لا يمكن تجاوز كمية المخزون"
      );

      return;
    }


    existingItem.quantity =
      Number(
        existingItem.quantity
      ) + 1;


  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name ||
        "منتج JR",

      price:
        Number(
          product.price || 0
        ),

      quantity:
        1

    });

  }


  saveCart();

  updateCartCount();

  renderCart();

  showToast(
    "✅ تمت إضافة المنتج إلى السلة"
  );

}


/* =========================
   CLEAN CART
========================= */

function cleanCart() {

  cart =
    cart.filter(item => {

      const product =
        products.find(
          p =>
            String(p.id) ===
            String(item.id)
        );


      if (!product) {
        return false;
      }


      const stock =
        Number(
          product.stock || 0
        );


      if (stock <= 0) {
        return false;
      }


      if (
        Number(item.quantity) >
        stock
      ) {

        item.quantity =
          stock;

      }


      return true;

    });


  saveCart();

}

      return `

              data-id="${escapeHtml(String(item.id))}"
              style="
                width:40px;

/* =========================

========================= */

function updateCartCount() {

  const cartCount =
    document.getElementById(
      "cartCount"
    );


  const totalItems =
    cart.reduce(
      (total, item) =>
        total +
        Number(
          item.quantity || 0
        ),
      0
    );


  cartCount.textContent =
    totalItems;

}


/* =========================
   DECREASE
========================= */

function decreaseQuantity(
  productId
) {

  const id =
    String(productId);


  const item =
    cart.find(
      item =>
        String(item.id) === id
    );


  if (!item) {
    return;
  }


  if (
    Number(item.quantity) > 1
  ) {

    item.quantity =
      Number(item.quantity) - 1;

  } else {

    cart =
      cart.filter(
        item =>
          String(item.id) !== id
      );

  }


  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================
   INCREASE
========================= */

function increaseQuantity(
  productId
) {

  const id =
    String(productId);


  const item =
    cart.find(
      item =>
        String(item.id) === id
    );


  if (!item) {
    return;
  }


  const product =
    products.find(
      p =>
        String(p.id) === id
    );


  const stock =
    product
      ? Number(
          product.stock || 0
        )
      : 0;


  if (
    Number(item.quantity) >=
    stock
  ) {

    alert(
      "لا يمكن تجاوز كمية المخزون"
    );

    return;
  }


  item.quantity =
    Number(item.quantity) + 1;


  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(
  productId
) {

  const id =
    String(productId);


  cart =
    cart.filter(
      item =>
        String(item.id) !== id
    );


  saveCart();

  updateCartCount();

  renderCart();

  showToast(
    "🗑️ تم حذف المنتج من السلة"
  );

}

async function submitOrder() {

  if (
    cart.length === 0
  ) {

    alert(
      "السلة فارغة"
    );

    return;
  }


  const customer =
    getCustomerData();


  if (!customer) {
    return;
  }


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        (
          Number(
            item.price || 0
          ) *
          Number(
            item.quantity || 0
          )
        ),
      0
    );


  const orderItems =
    cart.map(item => ({

      product_id:
        item.id,

      name:
        item.name,

      price:
        Number(
          item.price || 0
        ),

      quantity:
        Number(
          item.quantity || 0
        ),

      subtotal:
        Number(
          item.price || 0
        ) *
        Number(
          item.quantity || 0
        )

    }));


  const submitButton =
    document.getElementById(
      "submitOrderBtn"
    );


  if (submitButton) {

    submitButton.disabled =
      true;

    submitButton.textContent =
      "⏳ جاري إرسال الطلب...";

  }


  /*
    مهم:
    الـRPC الحالي تاعك عندو p_wilaya فقط.
    لذلك نرسل الولاية + البلدية داخل
    p_wilaya بدون تغيير قاعدة البيانات.
  */

  const wilayaForOrder =
    customer.wilayaName +
    " - " +
    customer.commune;


  /*
    نضيف البلدية أيضاً إلى العنوان
    باش تبقى واضحة حتى لو فتحت الطلب
    من Supabase.
  */

  const addressForOrder =
    "البلدية: " +
    customer.commune +
    "\n" +
    customer.address;


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "create_order",
        {

          p_customer_name:
            customer.name,

          p_phone:
            customer.phone,

          p_wilaya:
            wilayaForOrder,

          p_address:
            addressForOrder,

          p_items:
            orderItems,

          p_total:
            total

        }
      );


    if (error) {

      console.error(
        "Order error:",
        error
      );


      alert(
        "حدث خطأ أثناء إرسال الطلب.\n\n" +
        error.message
      );


      return;
    }


    console.log(
      "Order created:",
      data
    );


    alert(
      "✅ تم إرسال طلبك بنجاح!\n\n" +
      "سنتواصل معك لتأكيد الطلب."
    );


    cart = [];


    saveCart();


    updateCartCount();


    renderCart();


  } catch (error) {

    console.error(
      "Unexpected order error:",
      error
    );


    alert(
      "حدث خطأ غير متوقع أثناء إرسال الطلب."
    );


  } finally {

    if (submitButton) {

      submitButton.disabled =
        false;

      submitButton.textContent =
        "✅ تأكيد الطلب";

    }

  }

}
