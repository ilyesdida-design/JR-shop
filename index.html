<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JR Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #16a34a;
    }

    .cart {
      background: #16a34a;
      border: 0;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .hero {
      background: #111;
      color: white;
      padding: 35px 18px 45px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: #22c55e;
    }

    .hero p {
      color: #ccc;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 50px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .product-img {
      height: 180px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 45px;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 13px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .price {
      color: #16a34a;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-right: 5px;
    }

    .stock {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .buy {
      width: 100%;
      border: 0;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy:hover {
      background: #16a34a;
    }

    .loading,
    .error {
      text-align: center;
      padding: 30px;
      font-size: 16px;
    }

    .error {
      color: #dc2626;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
    }

    footer strong {
      color: #22c55e;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">
      JR <span>Shop</span>
    </div>
    
    <button class="cart" onclick="openCart()">
  🛒 السلة (<span id="cartCount">0</span>)
    </button>

  </div>
</header>

<section class="hero">
  <h1>
    مرحباً بكم في <span>JR Shop</span>
  </h1>

  <p>
    اكتشف منتجاتنا الجديدة
  </p>
</section>

<main class="container">

  <div class="section-title">
    <h2>المنتجات</h2>
  </div>

  <div id="products" class="products">
    <div class="loading">
      جاري تحميل المنتجات...
    </div>
  </div>

</main>
  <div id="cartModal" style="
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 100;
  padding: 20px;
">

  <div style="
    background: white;
    max-width: 500px;
    margin: 50px auto;
    border-radius: 16px;
    padding: 20px;
  ">

    <h2 style="margin-bottom: 15px;">
      🛒 سلة المشتريات
    </h2>

    <div id="cartItems">
      السلة فارغة
    </div>

    <div id="cartTotal" style="
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    ">
      المجموع: 0 دج
    </div>

    <button onclick="closeCart()" style="
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: bold;
    ">
      إغلاق
    </button>

  </div>
</div>

<footer>
  <p>
    جميع الحقوق محفوظة © <strong>JR Shop</strong>
  </p>
</footer>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://cstjgsuehmqcolajspqh.supabase.co";

  const SUPABASE_KEY = "sb_publishable_e_wQxqCrx21Qq1kRYKjFMg_yR6TQfKX";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );let cart = [];

  async function loadProducts() {

    const productsContainer = document.getElementById("products");

    productsContainer.innerHTML = `
      <div class="loading">
        جاري تحميل المنتجات...
      </div>
    `;

    const { data, error } = await supabaseClient
      .from("products")
      .select("*")
      .eq("is_active", true)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Supabase error:", error);

      productsContainer.innerHTML = `
        <div class="error">
          حدث خطأ أثناء تحميل المنتجات.
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      productsContainer.innerHTML = `
        <div class="loading">
          لا توجد منتجات حالياً.
        </div>
      `;

      return;
    }
window.products = data;
    productsContainer.innerHTML = data.map(product => {

      const image = product.image_url
        ? `<img src="${product.image_url}" alt="${product.name || "منتج JR"}">`
        : "🛍️";

      const oldPrice = product.old_price
        ? `<span class="old-price">${product.old_price} دج</span>`
        : "";

      return `
        <article class="product">

          <div class="product-img">
            ${image}
          </div>

          <div class="product-info">

            <h3>${product.name || "منتج JR"}</h3>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="price">
              ${product.price} دج
              ${oldPrice}
            </div>

            <div class="stock">
              المخزون: ${product.stock ?? 0}
            </div>

            <button class="buy" onclick="addToCart('${product.id}')">
              أضف إلى السلة
            </button>

          </div>

        </article>
      `;

    }).join("");
  }
function openCart() {
  document.getElementById("cartModal").style.display = "block";
  renderCart();
}

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}

function renderCart() {
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  if (cart.length === 0) {
    cartItems.innerHTML = "السلة فارغة";
    cartTotal.textContent = "المجموع: 0 دج";
    return;
  }

  cartItems.innerHTML = cart.map(item => `
    <div style="
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    ">

      <strong>${item.name}</strong>

      <div style="
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      ">

        <button
          onclick="decreaseQuantity('${item.id}')"
          style="
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 22px;
          "
        >
          −
        </button>

        <span style="
          font-size: 18px;
          font-weight: bold;
        ">
          ${item.quantity}
        </span>

        <button
          onclick="increaseQuantity('${item.id}')"
          style="
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 22px;
          "
        >
          +
        </button>

      </div>

      <div style="
        margin-top: 8px;
        font-weight: bold;
      ">
        ${item.price} دج × ${item.quantity}
      </div>

    </div>
  `).join("");

  const total = cart.reduce((sum, item) => {
    return sum + (item.price * item.quantity);
  }, 0);

  cartTotal.textContent = `المجموع: ${total} دج`;
}function updateCartCount() {
  const cartCount = document.getElementById("cartCount");

  const totalItems = cart.reduce((total, item) => {
    return total + item.quantity;
  }, 0);

  cartCount.textContent = totalItems;
  } function addToCart(productId) {
  const product = window.products?.find(p => p.id === productId);

  if (!product) {
    alert("لم يتم العثور على المنتج");
    return;
  }

  const existingItem = cart.find(item => item.id === productId);

  if (existingItem) {
    existingItem.quantity += 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: product.price,
      quantity: 1
    });
  }

  updateCartCount();
  }

  loadProducts();
</script>

</body>
</html>
