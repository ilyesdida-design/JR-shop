========================= */

let cart = [];

/* =========================
   LOCAL STORAGE
========================= */

function loadCartFromStorage() {

  try {

    const savedCart =
      localStorage.getItem("jr_shop_cart");

    if (savedCart) {

      const parsed =
        JSON.parse(savedCart);

      if (Array.isArray(parsed)) {
        cart = parsed;
      }

    }

  } catch (error) {

    console.error(
      "Cart storage error:",
      error
    );

    cart = [];
  }

}


function saveCart() {

  try {

    localStorage.setItem(
      "jr_shop_cart",
      JSON.stringify(cart)
    );

  } catch (error) {

    console.error(
      "Could not save cart:",
      error
    );

  }

}


/* =========================
   TOAST
========================= */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      toast.style.display = "none";

    }, 2000);

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const productsContainer =
    document.getElementById("products");

  productsContainer.innerHTML = `
    <div class="loading">
      جاري تحميل المنتجات...
    </div>
  `;


  try {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("is_active", true)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(
        "Supabase error:",
        error
      );

      productsContainer.innerHTML = `
        <div class="error">
          حدث خطأ أثناء تحميل المنتجات.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      productsContainer.innerHTML = `
        <div class="loading">
          لا توجد منتجات حالياً.
        </div>
      `;

      products = [];

      return;
    }


    products = data;


    renderProducts();


    /*
      بعد تحميل المنتجات،
      نتأكد أن المنتجات الموجودة
      في السلة مازالت صالحة.
    */

    cleanCart();

    updateCartCount();

    renderCart();

  } catch (error) {

    console.error(
      "Unexpected load error:",
      error
    );

    productsContainer.innerHTML = `
      <div class="error">
        حدث خطأ غير متوقع أثناء تحميل المنتجات.
      </div>
    `;

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

            ${image}

            <h3>

                  : "أضف إلى السلة"
              }

            </button>

        </article>

      `;

    }).join("");

}

/* =========================
   ADD TO CART
========================= */

function addToCart(productId) {

  /*
    مهم جداً:
    نحول ID إلى String
    لأن Supabase ممكن يرجعو UUID
    أو رقم.
  */

  const id =
    String(productId);


  console.log(
    "Adding product:",
    id
  );


  const product =
    products.find(
      p => String(p.id) === id
    );


  if (!product) {

    console.error(
      "Product not found:",
      id
    );

    console.log(
      "Products:",
      products
    );

    alert(
      "لم يتم العثور على المنتج"
    );

    return;
  }


  const stock =
    Number(product.stock || 0);


  if (stock <= 0) {

    alert(
      "هذا المنتج غير متوفر حالياً"
    );

    return;
  }


  const existingItem =
    cart.find(
      item => String(item.id) === id
    );


  if (existingItem) {

    const currentQuantity =
      Number(existingItem.quantity || 0);


    if (currentQuantity >= stock) {

      alert(
        "لا يمكن تجاوز كمية المخزون"
      );

      return;
    }


    existingItem.quantity =
      currentQuantity + 1;


  } else {

    cart.push({

      id: product.id,

      name:
        product.name || "منتج JR",

      price:
        Number(product.price || 0),

      quantity: 1

    });

  }


  saveCart();

  updateCartCount();

  renderCart();

  showToast(
    "✅ تمت إضافة المنتج إلى السلة"
  );

}


/* =========================
   CLEAN CART
========================= */

function cleanCart() {

  cart =
    cart.filter(item => {

      const product =
        products.find(
          p => String(p.id) === String(item.id)
        );


      if (!product) {
        return false;
      }


      const stock =
        Number(product.stock || 0);


      if (stock <= 0) {
        return false;
      }


      if (
        Number(item.quantity) > stock
      ) {

        item.quantity = stock;

      }


      return true;

    });


  saveCart();

}

function decreaseQuantity(productId) {

  const id =
    String(productId);


  const item =
    cart.find(
      item => String(item.id) === id
    );


  if (!item) {
    return;
  }


  if (
    Number(item.quantity) > 1
  ) {

    item.quantity =
      Number(item.quantity) - 1;

  } else {

    cart =
      cart.filter(
        item =>
          String(item.id) !== id
      );

  }


  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================
   INCREASE
========================= */

function increaseQuantity(productId) {

  const id =
    String(productId);


  const item =
    cart.find(
      item => String(item.id) === id
    );


  if (!item) {
    return;
  }


  const product =
    products.find(
      p => String(p.id) === id
    );


  const stock =
    product
      ? Number(product.stock || 0)
      : 0;


  if (
    Number(item.quantity) >= stock
  ) {

    alert(
      "لا يمكن تجاوز كمية المخزون"
    );

    return;
  }


  item.quantity =
    Number(item.quantity) + 1;


  saveCart();

  updateCartCount();

  renderCart();

}

function getCustomerData() {

  const nameElement =
    document.getElementById(
      "customerName"
    );


  const phoneElement =
    document.getElementById(
      "customerPhone"
    );


  const wilayaElement =
    document.getElementById(
      "customerWilaya"
    );


  const addressElement =
    document.getElementById(
      "customerAddress"
    );


  if (
    !nameElement ||
    !phoneElement ||
    !wilayaElement ||
    !addressElement
  ) {

    alert(
      "من فضلك أدخل معلومات الطلب"
    );

    return null;
  }


  const name =
    nameElement.value.trim();


  const phone =
    phoneElement.value.trim();


  const wilaya =
    wilayaElement.value.trim();


  const address =
    addressElement.value.trim();


  if (
    !name ||
    !phone ||
    !wilaya ||
    !address
  ) {

    alert(
      "من فضلك أكمل جميع معلومات الطلب"
    );

    return null;
  }


  return {
    name,
    phone,
    wilaya,
    address
  };

}


/* =========================
   WHATSAPP
========================= */

function sendOrderToWhatsApp() {

  if (cart.length === 0) {

    alert(
      "السلة فارغة"
    );

    return;
  }


  const customer =
    getCustomerData();


  if (!customer) {
    return;
  }


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        (
          Number(item.price || 0) *
          Number(item.quantity || 0)
        ),
      0
    );


  let message =
    "🛍️ طلب جديد من JR Shop\n\n";


  message +=
    "👤 الاسم: " +
    customer.name +
    "\n";


  message +=
    "📞 الهاتف: " +
    customer.phone +
    "\n";


  message +=
    "📍 الولاية: " +
    customer.wilaya +
    "\n";


  message +=
    "🏠 العنوان: " +
    customer.address +
    "\n\n";


  message +=
    "📦 المنتجات:\n";


  cart.forEach(
    (item, index) => {

      const subtotal =
        Number(item.price || 0) *
        Number(item.quantity || 0);


      message +=
        (index + 1) +
        ". " +
        item.name +
        " × " +
        item.quantity +
        " = " +
        subtotal +
        " دج\n";

    }
  );


  message +=
    "\n💰 المجموع: " +
    total +
    " دج";


  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =========================
   SUBMIT ORDER
========================= */

async function submitOrder() {

  if (cart.length === 0) {

    alert(
      "السلة فارغة"
    );

    return;
  }


  const customer =
    getCustomerData();


  if (!customer) {
    return;
  }


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        (
          Number(item.price || 0) *
          Number(item.quantity || 0)
        ),
      0
    );


  const orderItems =
    cart.map(item => ({

      product_id:
        item.id,

      name:
        item.name,

      price:
        Number(item.price || 0),

      quantity:
        Number(item.quantity || 0),

      subtotal:
        Number(item.price || 0) *
        Number(item.quantity || 0)

    }));


  const submitButton =
    document.getElementById(
      "submitOrderBtn"
    );


  if (submitButton) {

    submitButton.disabled = true;

    submitButton.textContent =
      "⏳ جاري إرسال الطلب...";

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "create_order",
        {
          p_customer_name:
            customer.name,

          p_phone:
            customer.phone,

          p_wilaya:
            customer.wilaya,

          p_address:
            customer.address,

          p_items:
            orderItems,

          p_total:
            total
        }
      );


    if (error) {

      console.error(
        "Order error:",
        error
      );

      alert(
        "حدث خطأ أثناء إرسال الطلب.\n\n" +
        error.message
      );

      return;
    }


    console.log(
      "Order created:",
      data
    );


    alert(
      "✅ تم إرسال طلبك بنجاح!\n\n" +
      "سنتواصل معك لتأكيد الطلب."
    );


    cart = [];

    saveCart();

    updateCartCount();

    renderCart();


  } catch (error) {

    console.error(
      "Unexpected order error:",
      error
    );

    alert(
      "حدث خطأ غير متوقع أثناء إرسال الطلب."
    );

  } finally {

    if (submitButton) {

      submitButton.disabled = false;

      submitButton.textContent =
        "✅ تأكيد الطلب";

    }

  }

}
