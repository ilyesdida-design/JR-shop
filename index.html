<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #16a34a;
    }

    .cart {
      background: #16a34a;
      border: 0;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .hero {
      background: #111;
      color: white;
      padding: 35px 18px 45px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: #22c55e;
    }

    .hero p {
      color: #ccc;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px 15px 50px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .product-img {
      height: 180px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 45px;
    }

    .product-info {
      padding: 13px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .price {
      color: #16a34a;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .buy {
      width: 100%;
      border: 0;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy:hover {
      background: #16a34a;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
    }

    footer strong {
      color: #22c55e;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(4, 1fr);
      }

      .product-img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo
